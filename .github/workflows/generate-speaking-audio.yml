name: Generate Speaking Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 mecab libmecab-dev mecab-ipadic-utf8

      - name: Install MeloTTS
        run: |
          python -m pip install --upgrade pip wheel

          # MeloTTS/librosa still uses pkg_resources.
          # Keep setuptools below the version that removed it.
          python -m pip install "setuptools==80.10.2"

          git clone --depth 1 https://github.com/myshell-ai/MeloTTS.git /tmp/MeloTTS
          python -m pip install -e /tmp/MeloTTS

          # Re-pin in case dependencies changed setuptools.
          python -m pip install --force-reinstall "setuptools==80.10.2"

          # MeloTTS imports Japanese text helpers during startup.
          # The `unidic` Python package does not include its dictionary by default.
          # Download it so MeCab can initialize even though we generate Chinese only.
          python -m unidic download

          # Clear checks before the long generation step.
          python -c "import pkg_resources; print('pkg_resources OK')"
          python -c "import unidic, os; print('UniDic:', unidic.DICDIR); print('mecabrc exists:', os.path.exists(os.path.join(unidic.DICDIR, 'mecabrc')))"
          python -c "from melo.api import TTS; print('MeloTTS import OK')"

      - name: Generate Mandarin audio
        run: |
          python scripts/generate-speaking-audio.py

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/speaking
          if git diff --cached --quiet; then
            echo "No new audio files."
          else
            git commit -m "Generate Meow Meow speaking audio"
            git push
          fi
