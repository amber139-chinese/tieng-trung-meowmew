name: Generate Speaking Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install MeloTTS
        run: |
          python -m pip install --upgrade pip setuptools wheel
          git clone --depth 1 https://github.com/myshell-ai/MeloTTS.git /tmp/MeloTTS
          python -m pip install -e /tmp/MeloTTS

      - name: Generate Mandarin audio
        run: |
          python scripts/generate-speaking-audio.py

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/speaking
          if git diff --cached --quiet; then
            echo "No new audio files."
          else
            git commit -m "Generate Meow Meow speaking audio"
            git push
          fi
