name: Auto update sitemap

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "scripts/generate-sitemap.py"

  workflow_dispatch:

permissions:
  contents: write

# Không cho nhiều workflow sitemap chạy đè lên nhau
concurrency:
  group: auto-update-sitemap
  cancel-in-progress: true

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap
        run: python scripts/generate-sitemap.py

      - name: Commit sitemap if changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- sitemap.xml)" ]; then
            echo "sitemap.xml is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml
          git commit -m "Auto update sitemap"

          git pull --rebase origin main
          git push origin main
