<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý lớp · Tiếng Trung Meow Meow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#6FAFC4;--dark:#3F8198;--soft:#EAF6F8;--ink:#293A40;--muted:#6A7A80;--line:#D7E9ED;--green:#31775F}
*{box-sizing:border-box}body{margin:0;font-family:"Be Vietnam Pro",sans-serif;color:var(--ink);background:#F6FAFB}
.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:76px 0 60px}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
h1{font-family:"Noto Serif SC",serif;font-size:clamp(2rem,5vw,3.4rem);margin:6px 0}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;color:var(--dark);border-radius:10px;padding:9px 12px;text-decoration:none;font-weight:700;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(55,110,125,.06)}
.kpi b{display:block;font-size:1.8rem;color:var(--dark)}.kpi span{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:14px}
.card h2{font-size:1.1rem;margin:0 0 4px}
.tabs{display:flex;gap:6px;margin:12px 0}.tab{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:999px;font-weight:700;cursor:pointer;color:#61757C}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-top:1px solid #EDF3F5}.row:first-of-type{border-top:0}
.rank{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--dark);font-weight:800}
.name{font-weight:700}.right{text-align:right;font-weight:700;color:var(--dark)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 9px;border-bottom:1px solid #EDF3F5;text-align:left;font-size:13px}th{font-size:11px;color:var(--muted);letter-spacing:.04em}
.person{cursor:pointer}.person:hover{background:#F8FCFD}
.denied{max-width:650px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}
.code{font-family:monospace;background:#F2F7F8;padding:9px;border-radius:9px;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(20,40,47,.35);display:none;align-items:center;justify-content:center;padding:18px;z-index:100000}
.modal.open{display:flex}.modal-card{width:min(760px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}
.close{float:right;border:0;background:#EEF6F8;border-radius:50%;width:34px;height:34px;cursor:pointer}
@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}
</style>
<script defer src="meow-auth.js"></script>
</head>
<body>
<div class="wrap" id="app"><div class="small">Đang kiểm tra quyền quản trị...</div></div>
<div class="modal" id="modal"><div class="modal-card"><button class="close" id="closeModal">✕</button><div id="detail"></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let profiles=[],progress=[],games=[],activities=[],course='hsk1';

function startTodayISO(){
  const d=new Date();d.setHours(0,0,0,0);return d.toISOString();
}
function since7ISO(){return new Date(Date.now()-7*86400000).toISOString()}
function fmtDate(s){if(!s)return '—';return new Date(s).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'})}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0}

function statsFor(uid,c){
  const p=progress.filter(x=>x.user_id===uid&&x.course===c);
  const g=games.filter(x=>x.user_id===uid&&x.course===c);
  const a=activities.filter(x=>x.user_id===uid&&x.course===c);
  const completed=p.filter(x=>x.status==='completed').length;
  const bests=p.map(x=>x.best_score).filter(x=>x!==null);
  const recent=g.filter(x=>new Date(x.played_at)>=new Date(since7ISO()));
  const days=new Set(recent.map(x=>new Date(x.played_at).toISOString().slice(0,10))).size;
  const last=[...p.map(x=>x.last_opened_at),...g.map(x=>x.played_at),...a.map(x=>x.activity_at)].filter(Boolean).sort().pop();
  return {completed,touched:p.length,avgBest:avg(bests),attempts:g.length,avgGame:avg(g.map(x=>x.score)),attempts7:recent.length,days7:days,last,
    points:completed*100+avg(bests)+Math.min(g.length,50)};
}

function renderRank(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.course===course));
  const rows=profiles.map(p=>({p,s:statsFor(p.id,course)}));
  const leader=[...rows].sort((a,b)=>b.s.points-a.s.points||b.s.completed-a.s.completed);
  const active=[...rows].sort((a,b)=>b.s.days7-a.s.days7||b.s.attempts7-a.s.attempts7);

  $('#leader').innerHTML=leader.slice(0,12).map((x,i)=>`<div class="row"><div class="rank">${i+1}</div><div><div class="name">${esc(x.p.display_name)}</div><div class="small">${x.s.completed} bài hoàn thành · TB ${x.s.avgBest}/100</div></div><div class="right">${x.s.points}<div class="small">điểm</div></div></div>`).join('')||'<div class="small">Chưa có dữ liệu.</div>';

  $('#active').innerHTML=active.slice(0,12).map((x,i)=>`<div class="row"><div class="rank">${i+1}</div><div><div class="name">${esc(x.p.display_name)}</div><div class="small">${x.s.days7} ngày học · ${x.s.attempts7} lượt luyện / 7 ngày</div></div><div class="right">${x.s.avgGame}<div class="small">điểm TB</div></div></div>`).join('')||'<div class="small">Chưa có dữ liệu.</div>';
}

function openStudent(uid){
  const p=profiles.find(x=>x.id===uid);if(!p)return;
  const s1=statsFor(uid,'hsk1'),s4=statsFor(uid,'hsk4');
  const pg=progress.filter(x=>x.user_id===uid).sort((a,b)=>a.course.localeCompare(b.course)||a.lesson_no-b.lesson_no);
  const gs=games.filter(x=>x.user_id===uid).sort((a,b)=>new Date(b.played_at)-new Date(a.played_at)).slice(0,30);
  $('#detail').innerHTML=`
    <div class="small">HỌC VIÊN</div><h2>${esc(p.display_name)}</h2>
    <div class="small">Tên tài khoản: ${esc(p.username)} · Tham gia: ${fmtDate(p.created_at)}</div>
    <div class="kpis" style="margin:18px 0">
      <div class="kpi"><b>${s1.completed}</b><span>HSK1 hoàn thành</span></div>
      <div class="kpi"><b>${s4.completed}</b><span>HSK4 hoàn thành</span></div>
      <div class="kpi"><b>${s1.attempts+s4.attempts}</b><span>Lượt làm bài</span></div>
      <div class="kpi"><b>${avg(games.filter(x=>x.user_id===uid).map(x=>x.score))}</b><span>Điểm trung bình</span></div>
    </div>
    <h3>Tiến độ từng bài</h3>
    <div class="table-wrap"><table><thead><tr><th>Khóa</th><th>Bài</th><th>Trạng thái</th><th>Gần nhất</th><th>Cao nhất</th><th>Mở gần nhất</th></tr></thead><tbody>
    ${pg.map(x=>`<tr><td>${x.course.toUpperCase()}</td><td>${x.lesson_no}</td><td>${x.status==='completed'?'Hoàn thành':'Đang học'}</td><td>${x.last_score??'—'}</td><td>${x.best_score??'—'}</td><td>${fmtDate(x.last_opened_at)}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có dữ liệu</td></tr>'}
    </tbody></table></div>
    <h3>30 lượt làm gần nhất</h3>
    <div class="table-wrap"><table><thead><tr><th>Khóa</th><th>Bài</th><th>Hoạt động</th><th>Điểm</th><th>Thời gian</th></tr></thead><tbody>
    ${gs.map(x=>`<tr><td>${x.course.toUpperCase()}</td><td>${x.lesson_no}</td><td>${esc(x.game_id)}</td><td>${x.score}/100</td><td>${fmtDate(x.played_at)}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có dữ liệu</td></tr>'}
    </tbody></table></div>`;
  $('#modal').classList.add('open');
}

function renderStudents(){
  const rows=profiles.map(p=>{
    const a=statsFor(p.id,'hsk1'),b=statsFor(p.id,'hsk4');
    return {p,a,b,last:[a.last,b.last].filter(Boolean).sort().pop()};
  }).sort((x,y)=>new Date(y.last||0)-new Date(x.last||0));

  $('#students').innerHTML=rows.map(x=>`<tr class="person" data-id="${x.p.id}">
    <td><b>${esc(x.p.display_name)}</b><div class="small">${esc(x.p.username)}</div></td>
    <td>${x.a.completed}/15</td><td>${x.b.completed}/7</td>
    <td>${x.a.attempts+x.b.attempts}</td>
    <td>${avg(games.filter(g=>g.user_id===x.p.id).map(g=>g.score))}/100</td>
    <td>${fmtDate(x.last)}</td></tr>`).join('');
  document.querySelectorAll('.person').forEach(r=>r.onclick=()=>openStudent(r.dataset.id));
}

async function loadAdmin(detail){
  const {client,user,isAdmin}=detail;
  if(!isAdmin){
    const {data:p}=await client.from('profiles').select('username,display_name').eq('id',user.id).maybeSingle();
    $('#app').innerHTML=`<div class="denied"><div class="small">QUẢN LÝ LỚP</div><h2>Tài khoản chưa được cấp quyền giáo viên</h2>
      <p class="muted">Hãy chạy file <b>cap-quyen-admin.sql</b> trong Supabase. Tên tài khoản hiện tại của bạn:</p>
      <div class="code">${esc(p?.username||'(không đọc được username)')}</div>
      <p class="small">Sau khi cấp quyền, tải lại trang này.</p><a class="btn" href="hsk1.html">Về HSK1</a></div>`;
    return;
  }

  const c=client;
  const [p1,p2,p3,p4]=await Promise.all([
    c.from('profiles').select('id,username,display_name,created_at').order('created_at'),
    c.from('lesson_progress').select('*'),
    c.from('game_results').select('*').order('played_at',{ascending:false}).limit(10000),
    c.from('activity_logs').select('*').order('activity_at',{ascending:false}).limit(10000)
  ]);
  if(p1.error||p2.error||p3.error||p4.error){
    $('#app').innerHTML=`<div class="denied"><h2>Chưa đọc được dữ liệu quản trị</h2><p class="muted">Hãy chắc chắn đã chạy tracking-admin-setup.sql.</p></div>`;
    return;
  }
  profiles=p1.data||[];progress=p2.data||[];games=p3.data||[];activities=p4.data||[];

  const today=startTodayISO();
  const activeToday=new Set(activities.filter(x=>x.activity_at>=today).map(x=>x.user_id)).size;
  const attemptsToday=games.filter(x=>x.played_at>=today).length;
  const completed=progress.filter(x=>x.status==='completed').length;

  $('#app').innerHTML=`
    <div class="top"><div><div class="muted">MEOW MEOW 课堂 · QUẢN LÝ</div><h1>Tổng quan lớp học</h1><div class="muted">Theo dõi HSK1 và HSK4 trong cùng một trang.</div></div><div><a class="btn" href="index.html">Trang chính</a></div></div>
    <div class="kpis">
      <div class="kpi"><b>${profiles.length}</b><span>Tổng học viên</span></div>
      <div class="kpi"><b>${activeToday}</b><span>Học hôm nay</span></div>
      <div class="kpi"><b>${attemptsToday}</b><span>Lượt làm bài hôm nay</span></div>
      <div class="kpi"><b>${completed}</b><span>Bài đã hoàn thành</span></div>
    </div>
    <div class="tabs"><button class="tab active" data-course="hsk1">HSK1</button><button class="tab" data-course="hsk4">HSK4</button></div>
    <div class="layout">
      <section class="card"><h2>Bảng thành tích</h2><div class="small">Bài hoàn thành + điểm cao + luyện tập.</div><div id="leader"></div></section>
      <section class="card"><h2>Học viên tích cực · 7 ngày</h2><div class="small">Số ngày có làm bài và số lượt luyện.</div><div id="active"></div></section>
    </div>
    <section class="card"><h2>Danh sách học viên</h2><div class="small">Bấm vào một học viên để xem chi tiết.</div>
      <div class="table-wrap"><table><thead><tr><th>Học viên</th><th>HSK1</th><th>HSK4</th><th>Lượt làm</th><th>Điểm TB</th><th>Hoạt động gần nhất</th></tr></thead><tbody id="students"></tbody></table></div>
    </section>`;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{course=b.dataset.course;renderRank()});
  renderRank();renderStudents();
}
$('#closeModal').onclick=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};
window.addEventListener('meow-auth-ready',e=>loadAdmin(e.detail),{once:true});
</script>
</body></html>
