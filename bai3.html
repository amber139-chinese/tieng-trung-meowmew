这是","我的","+人","/物"]},{"source":"Hội thoại · 白家月","answer":"我是法国人我的中文老师也是中国人","parts":["我是","法国","人我","的","中文","老师","也是","中国人"]},{"source":"Hội thoại · 陈天中","answer":"这是我女朋友","parts":["这是","我","女朋友"]}],"sentencePractice":[{"answer":"她是中国人吗","parts":["她","是","中国","人","吗"],"note":[["是","shì","là"]]},{"answer":"这是我的姐姐","parts":["这","是","我","的","姐姐"],"note":[["是","shì","là"],["我","wǒ","tôi"]]},{"answer":"你的女朋友是哪国人","parts":["你","的","女朋友","是","哪","国","人"],"note":[["你","nǐ","bạn"],["是","shì","là"]]},{"answer":"姐姐工作太忙","parts":["姐姐","工作","太","忙"],"note":[]}],"situationPractice":[{"answer":"我们想学中文","parts":["我们","想","学","中文"],"note":[["学","xué","học"]]},{"answer":"她还在工作吗","parts":["她","还","在","工作","吗"],"note":[["在","zài","đang/ở"]]},{"answer":"法国人也想学中文","parts":["法国","人","也","想","学","中文"],"note":[["也","yě","cũng"],["学","xué","học"]]},{"answer":"这是谁的朋友","parts":["这","是","谁","的","朋友"],"note":[["是","shì","là"],["朋友","péngyou","bạn"]]}]},"gameTitle":"Game quốc tịch","customGame":{"type":"passport","title":"⑥ Hộ chiếu quốc tịch","desc":"Nhìn quốc gia rồi chọn cách nói quốc tịch phù hợp.","items":[{"flag":"🇨🇳","country":"中国","o":["中国人","法国人","泰国人","老师"],"a":0},{"flag":"🇫🇷","country":"法国","o":["中国人","法国人","泰国人","学生"],"a":1},{"flag":"🇹🇭","country":"泰国","o":["法国人","中国人","泰国人","中文"],"a":2}]}};
const D = DATA;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const state = {tab:'vocab',flash:0,mask:false};
const tabs = [['vocab','Từ mới'],['grammar','Ngữ pháp'],['patterns','Mẫu câu'],['dialogues','Hội thoại'],['games','Game']];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
let voices=[], currentVoice=null;
function loadVoices(){
  voices=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang)||/Chinese|Mandarin|中文|普通话/i.test(v.name));
  const priority=[/Yunxi/i,/Yunyang/i,/Yunjian/i,/Yunfeng/i,/Male/i,/男/i,/Mandarin.*China/i];
  currentVoice=voices.find(v=>priority.some(r=>r.test(v.name))) || voices.find(v=>/zh-CN/i.test(v.lang)) || voices[0] || null;
  const sel=$('#voiceSelect'); if(!sel)return;
  sel.innerHTML='';
  if(!voices.length){const o=document.createElement('option');o.textContent='Giọng zh-CN của trình duyệt';sel.appendChild(o);return}
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${v.name} · ${v.lang}`;if(v===currentVoice)o.selected=true;sel.appendChild(o)});
  sel.onchange=()=>{currentVoice=voices[Number(sel.value)]||currentVoice}
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,150)}
function speak(text,rate=.88){
  if(!('speechSynthesis' in window)){toast('Trình duyệt này không hỗ trợ giọng đọc');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=rate;u.pitch=.92;if(currentVoice)u.voice=currentVoice;
  speechSynthesis.speak(u);
}
function speakDialogue(d){
  speechSynthesis.cancel(); let i=0;
  const next=()=>{if(i>=d.lines.length)return;const u=new SpeechSynthesisUtterance(d.lines[i][1]);u.lang='zh-CN';u.rate=.86;u.pitch=.92;if(currentVoice)u.voice=currentVoice;u.onend=()=>{i++;setTimeout(next,180)};speechSynthesis.speak(u)};
  next();
}
function initDecor(){
  const layer=$('#stickers');
  layer.innerHTML=D.decor.map((x,i)=>`<div class="sticker s${i+1}" style="--rot:${[-10,8,-7,10,-5,7][i]}deg">${x}</div>`).join('');
  if(D.specialEffect==='snow'){document.body.classList.add('snowing');const snow=$('#snow');for(let i=0;i<36;i++){const f=document.createElement('div');f.className='flake';f.textContent='❄';f.style.left=(Math.random()*100)+'%';f.style.animationDuration=(6+Math.random()*7)+'s';f.style.animationDelay=(Math.random()*6)+'s';f.style.fontSize=(10+Math.random()*14)+'px';snow.appendChild(f)}}
}
function init(){
  document.title=`Bài ${D.lesson} · ${D.title} · Tiếng Trung Meow Meow`;
  $('#lessonTitle').textContent=D.title;$('#lessonVi').textContent=D.vi;
  $('#vocabCount').textContent=`${D.vocab.length} từ mới`;
  $('#grammarCount').textContent=`${D.grammar.length} điểm ngữ pháp`;
  $('#dialogueCount').textContent=`${D.dialogues.length} hội thoại`;
  const nav=$('#lessonSelect');nav.value=String(D.lesson);nav.onchange=()=>location.href=`meowmeow.bai${nav.value}.html`;
  initDecor(); renderTabs(); render();
}
function renderTabs(){
  const w=$('#tabs');w.innerHTML='';
  tabs.forEach(([id,name])=>{const b=document.createElement('button');b.className='tab'+(state.tab===id?' active':'');b.textContent=name;b.onclick=()=>{state.tab=id;renderTabs();render()};w.appendChild(b)})
}
function intro(title,sub,actions=''){return `<div class="section-intro"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function render(){
  const c=$('#content');
  if(state.tab==='vocab')renderVocab(c);
  else if(state.tab==='grammar')renderGrammar(c);
  else if(state.tab==='patterns')renderPatterns(c);
  else if(state.tab==='dialogues')renderDialogues(c);
  else renderGames(c);
}
function renderVocab(c){
  const v=D.vocab[state.flash];
  c.innerHTML=intro(`Từ mới · ${D.vocab.length} từ`,'Bấm vào thẻ để ẩn/hiện pinyin và nghĩa. Mỗi từ có nút nghe riêng.',
    `<button class="btn" id="prev">← Trước</button><button class="btn" id="rand">Ngẫu nhiên</button><button class="btn" id="next">Sau →</button>`)
    +`<div class="flash-wrap"><div class="flashcard ${state.mask?'mask':''}" id="fc"><div><div class="cn">${v[0]}</div><div class="py">${v[1]}</div><div class="vi">${v[2]}</div><div class="audio-row"><button class="btn primary" id="speakWord">🔊 Nghe từ</button></div></div><div class="hint">Từ ${state.flash+1}/${D.vocab.length} · bấm vào nền thẻ để che/hiện</div></div><div class="vocab-list" id="vlist"></div></div>`;
  const list=$('#vlist');
  D.vocab.forEach((x,i)=>{const r=document.createElement('div');r.className='vrow';r.innerHTML=`<div class="n">${String(i+1).padStart(2,'0')}</div><div><b>${x[0]}</b><small>${x[1]} · ${x[2]}</small></div><button class="iconbtn" title="Nghe">🔊</button>`;r.onclick=e=>{if(e.target.tagName==='BUTTON'){e.stopPropagation();speak(x[0]);return}state.flash=i;renderVocab(c)};list.appendChild(r)});
  $('#fc').onclick=e=>{if(e.target.closest('button'))return;state.mask=!state.mask;renderVocab(c)};
  $('#speakWord').onclick=()=>speak(v[0]);$('#prev').onclick=()=>{state.flash=(state.flash-1+D.vocab.length)%D.vocab.length;renderVocab(c)};$('#next').onclick=()=>{state.flash=(state.flash+1)%D.vocab.length;renderVocab(c)};$('#rand').onclick=()=>{state.flash=Math.floor(Math.random()*D.vocab.length);renderVocab(c)};
}
function renderGrammar(c){
  c.innerHTML=intro('Điểm ngữ pháp','Các điểm ngữ pháp được tổng hợp theo chính nội dung từng PDF.')
    +`<div class="grid">${D.grammar.map(g=>`<div class="card"><h3>${g.name}</h3><div>${g.desc}</div><div class="formula">${g.formula}</div><div class="example">${g.ex}</div></div>`).join('')}</div>`;
}
function renderPatterns(c){
  c.innerHTML=intro('Mẫu câu & cấu trúc','Các khung câu để học sinh thay từ và luyện nói nhanh.')
    +`<div class="pattern-list">${D.patterns.map((p,i)=>`<div class="pattern"><div><b>${i+1}.</b> ${p}</div><button class="iconbtn" data-p="${i}">🔊</button></div>`).join('')}</div>`;
  $$('[data-p]').forEach(b=>b.onclick=()=>speak(D.patterns[Number(b.dataset.p)]));
}
function renderDialogues(c){
  c.innerHTML=intro('Hội thoại trong bài','Giữ lại các đoạn hội thoại trong PDF. Có thể nghe từng câu hoặc nghe cả đoạn.')
    +D.dialogues.map((d,di)=>`<div class="dialogue"><div class="dialogue-head"><h3>${d.title}</h3><button class="btn primary" data-play="${di}">▶ Nghe cả đoạn</button></div>${d.lines.map((ln,li)=>`<div class="line"><div class="speaker">${ln[0]}</div><div class="cnline">${ln[1]}</div><button class="iconbtn" data-line="${di}-${li}">🔊</button></div>`).join('')}</div>`).join('');
  $$('[data-play]').forEach(b=>b.onclick=()=>speakDialogue(D.dialogues[Number(b.dataset.play)]));
  $$('[data-line]').forEach(b=>b.onclick=()=>{const [di,li]=b.dataset.line.split('-').map(Number);speak(D.dialogues[di].lines[li][1])});
}
function normalize(s){return String(s||'').replace(/[\s，。！？、；：,.!?;:]/g,'')}
function renderGames(c){
  c.innerHTML=intro(D.gameTitle,'Mỗi bài có 5 mini game nền tảng + 1 game riêng theo đúng chủ đề của bài.')
    +`<div class="game-stack">
      <div class="game-card" id="g1"></div>
      <div class="game-card" id="g2"></div>
      <div class="game-card" id="g3"></div>
      <div class="game-card" id="g4"></div>
      <div class="game-card" id="g5"></div>
      <div class="game-card" id="g6"></div>
    </div>`;
  renderGame1(); renderGame2(); renderGame3(); renderGame4(); renderGame5(); renderCustomGame();
}
function renderGame1(){
  const qs=D.games.mcq.map(q=>{const correct=q.options[q.a];const ops=shuffle(q.options);return {...q,options:ops,a:ops.indexOf(correct)}});
  const box=$('#g1');
  box.innerHTML=`<h3>① Chọn nghĩa đúng</h3><p>Chọn nghĩa tiếng Việt phù hợp với từ tiếng Trung.</p><div class="quiz-list">${qs.map((q,i)=>`<div class="qcard" data-g1="${i}"><div class="qtitle">${i+1}. ${q.q}</div><div class="opts">${q.options.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback"></div></div>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn primary" id="gradeG1">Chấm phần ①</button></div><div id="scoreG1" style="margin-top:10px"></div>`;
  const ans={};
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.q),j=Number(b.dataset.o);ans[i]=j;b.closest('.opts').querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
  $('#gradeG1').onclick=()=>{let s=0;qs.forEach((q,i)=>{const card=box.querySelector(`[data-g1="${i}"]`);const bs=card.querySelectorAll('.opt');const ch=ans[i];bs[q.a].classList.add('good');if(ch!==undefined&&ch!==q.a)bs[ch].classList.add('bad');if(ch===q.a)s++;card.querySelector('.feedback').textContent=ch===q.a?'✓ Đúng':`Đáp án: ${String.fromCharCode(65+q.a)}. ${q.options[q.a]}`});$('#scoreG1').innerHTML=`<span class="score">${s}/${qs.length} đúng</span>`}
}
function renderGame2(){
  const qs=shuffle(D.games.pinyin).slice(0,5); const box=$('#g2');
  box.innerHTML=`<h3>② Pinyin → gõ chữ Hán</h3><p>Nhìn pinyin và nghĩa, sau đó tự gõ chữ Hán đúng.</p>${qs.map((q,i)=>`<div class="qcard"><div class="qtitle">${i+1}. ${q.prompt}</div><input class="inputq" id="hanzi-${i}" placeholder="Nhập chữ Hán"><div class="feedback" id="hf-${i}"></div></div>`).join('')}<div class="actions" style="margin-top:12px"><button class="btn primary" id="gradeG2">Chấm phần ②</button></div><div id="scoreG2" style="margin-top:10px"></div>`;
  $('#gradeG2').onclick=()=>{let s=0;qs.forEach((q,i)=>{const val=normalize($(`#hanzi-${i}`).value);const ok=val===normalize(q.answer);if(ok)s++;$(`#hf-${i}`).innerHTML=ok?'<span class="goodtxt">✓ Đúng</span>':`<span class="badtxt">✗ Đáp án: ${q.answer}</span>`});$('#scoreG2').innerHTML=`<span class="score">${s}/${qs.length} đúng</span>`}
}

function noteHTML(q){
  if(!q.note || !q.note.length) return '';
  return `<div class="vocab-note"><b>📝 Ghi chú từ bổ sung:</b> ${q.note.map(x=>`<span><b>${x[0]}</b> · ${x[1]} · ${x[2]}</span>`).join('')}</div>`;
}
function bindOrderSet(box,cardClass){
  box.querySelectorAll('.'+cardClass).forEach(card=>{
    const bank=card.querySelector('.order-bank'),ans=card.querySelector('.order-answer');
    bank.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      if(ch.classList.contains('used'))return;
      ch.classList.add('used');
      const x=ch.cloneNode(true);x.classList.remove('used');
      x.onclick=()=>{
        const original=bank.querySelector(`[data-src="${x.dataset.src}"]`);
        if(original) original.classList.remove('used');
        x.remove();
      };
      ans.appendChild(x);
    });
  });
}
function gradeOrderSet(box,qs,selector,scoreId){
  let s=0;
  qs.forEach((q,i)=>{
    const card=box.querySelector(`${selector}[data-idx="${i}"]`);
    const txt=[...card.querySelectorAll('.order-answer .chip')].map(x=>x.textContent).join('');
    const ok=normalize(txt)===normalize(q.answer);
    if(ok)s++;
    card.querySelector('.feedback').innerHTML=ok
      ? '<span class="goodtxt">✓ Đúng</span>'
      : `<span class="badtxt">✗ Đáp án: ${q.answer}</span>`;
  });
  $(scoreId).innerHTML=`<span class="score">${s}/${qs.length} đúng · ${Math.round(s/qs.length*100)}/100</span>`;
}
function renderGame3(){
  const qs=shuffle(D.games.sentencePractice || []).slice(0,4),box=$('#g3');
  box.innerHTML=`<h3>③ Sắp xếp câu bằng từ mới trong bài</h3>
  <p>Các câu dưới đây là câu luyện mới, không lấy nguyên từ hội thoại. Hãy dùng từ mới của bài để sắp xếp thành câu đúng.</p>
  ${qs.map((q,i)=>`<div class="qcard order-new" data-idx="${i}">
    <div class="qtitle">${i+1}. Sắp xếp thành câu:</div>
    ${noteHTML(q)}
    <div class="order-bank">${shuffle(q.parts.map((p,j)=>({p,j}))).map(x=>`<button class="chip" data-src="${x.j}">${x.p}</button>`).join('')}</div>
    <div class="order-answer"></div><div class="feedback"></div>
  </div>`).join('')}
  <div class="actions" style="margin-top:12px"><button class="btn primary" id="gradeG3">Chấm phần ③</button></div>
  <div id="scoreG3" style="margin-top:10px"></div>`;
  bindOrderSet(box,'order-new');
  $('#gradeG3').onclick=()=>gradeOrderSet(box,qs,'.order-new','#scoreG3');
}

  <p>Tình huống mới để học sinh dùng từ của bài theo cách khác với hội thoại gốc. Nếu có từ ngoài bài, phần ghi chú sẽ ghi rõ pinyin và nghĩa.</p>

    ${noteHTML(q)}
    <div class="order-bank">${shuffle(q.parts.map((p,j)=>({p,j}))).map(x=>`<button class="chip" data-src="${x.j}">${x.p}</button>`).join('')}</div>
    <div class="order-answer"></div><div class="feedback"></div>
  </div>`).join('')}
  <div class="actions" style="margin-top:12px"><button class="btn primary" id="gradeG4">Chấm phần ④</button></div>

function renderGame5(){
  const pairs=shuffle(D.games.match); const left=shuffle(pairs.map((x,i)=>({...x,id:i}))), right=shuffle(pairs.map((x,i)=>({...x,id:i}))); const box=$('#g5');
  box.innerHTML=`<h3>⑤ Ghép cặp từ vựng</h3><p>Ghép chữ Hán với nghĩa tiếng Việt tương ứng.</p><div class="match-wrap"><div class="match-col">${left.map(x=>`<button class="match-item" data-side="l" data-id="${x.id}">${x.cn}</button>`).join('')}</div><div class="match-col">${right.map(x=>`<button class="match-item" data-side="r" data-id="${x.id}">${x.vi}</button>`).join('')}</div></div><div class="feedback" id="mf" style="margin-top:10px"></div><div id="scoreG5" style="margin-top:10px"></div>`;
  let L=null,R=null,done=0;
  function check(){if(!L||!R)return;if(L.dataset.id===R.dataset.id){L.classList.add('done');R.classList.add('done');done++;$('#mf').textContent=`✓ Đúng · ${done}/${pairs.length} cặp`;if(done===pairs.length)$('#scoreG5').innerHTML=`<span class="score">Hoàn thành 100/100 🎉</span>`}else{$('#mf').textContent='✗ Chưa đúng, thử lại';L.classList.remove('sel');R.classList.remove('sel')}L=R=null}
  box.querySelectorAll('.match-item').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;if(b.dataset.side==='l'){if(L)L.classList.remove('sel');L=b}else{if(R)R.classList.remove('sel');R=b}b.classList.add('sel');check()})
}

function renderCustomGame(){
  const G=D.customGame,box=$('#g6'); if(!G){box.style.display='none';return}
  box.innerHTML=`<h3>${G.title}</h3><p>${G.desc}</p><div id="customBody"></div><div id="customScore" style="margin-top:10px"></div>`;
  const body=$('#customBody');
  const renderChoiceSet=(items, extraRenderer=null, listen=false)=>{
    const qs=items.map(q=>{const correct=q.o[q.a];const ops=shuffle(q.o);return {...q,o:ops,a:ops.indexOf(correct)}});
    body.innerHTML=qs.map((q,i)=>`${extraRenderer?extraRenderer(q,i):''}<div class="qcard" data-cq="${i}"><div class="qtitle">${i+1}. ${q.q||''} ${listen?`<button class="iconbtn" data-clisten="${i}">🔊</button>`:''}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-ci="${i}" data-co="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback"></div></div>`).join('')+`<div class="actions" style="margin-top:12px"><button class="btn primary" id="gradeCustom">Chấm game chủ đề</button></div>`;
    const ans={};body.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ci,j=+b.dataset.co;ans[i]=j;b.closest('.opts').querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
    body.querySelectorAll('[data-clisten]').forEach(b=>b.onclick=()=>speak(qs[+b.dataset.clisten].speech,.78));
    $('#gradeCustom').onclick=()=>{let s=0;qs.forEach((q,i)=>{const card=body.querySelector(`[data-cq="${i}"]`),bs=card.querySelectorAll('.opt'),ch=ans[i];bs[q.a].classList.add('good');if(ch!==undefined&&ch!==q.a)bs[ch].classList.add('bad');if(ch===q.a)s++;card.querySelector('.feedback').textContent=ch===q.a?'✓ Đúng':`✗ Đáp án: ${q.o[q.a]}`});$('#customScore').innerHTML=`<span class="score">${s}/${qs.length} đúng · ${Math.round(s/qs.length*100)}/100</span>`}
  };
  if(['reply','intro','family','calendar','shopping','status'].includes(G.type)){
    renderChoiceSet(G.items,G.story?(_,i)=>i===0?`<div class="custom-scene">${G.story}</div>`:'':null);
  } else if(G.type==='passport'){
    renderChoiceSet(G.items,(q)=>`<div class="passport"><div class="flag">${q.flag}</div><div><b>${q.country}</b><div>Chọn quốc tịch đúng</div></div></div>`);
  } else if(G.type==='location'){
    renderChoiceSet(G.items,(_,i)=>i===0?`<div class="custom-scene">${G.scene}</div>`:'');
  } else if(G.type==='schedule'){
    const table=`<table class="schedule-table"><tr><th>时间</th><th>地方</th><th>活动</th></tr>${G.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;renderChoiceSet(G.items,(_,i)=>i===0?table:'');
  } else if(G.type==='phone'){
    body.innerHTML=G.items.map((q,i)=>`<div class="qcard"><div class="qtitle">${i+1}. Nghe và nhập số điện thoại</div><button class="btn primary" data-phone="${i}">🔊 Nghe số</button><input class="inputq" id="phone-${i}" inputmode="numeric" placeholder="Nhập dãy số"><div class="feedback" id="pf-${i}"></div></div>`).join('')+`<button class="btn primary" id="gradeCustom">Chấm game chủ đề</button>`;
    body.querySelectorAll('[data-phone]').forEach(b=>b.onclick=()=>speak(G.items[+b.dataset.phone].speech,.66));
    $('#gradeCustom').onclick=()=>{let s=0;G.items.forEach((q,i)=>{const v=$(`#phone-${i}`).value.replace(/\D/g,''),ok=v===q.answer;if(ok)s++;$(`#pf-${i}`).innerHTML=ok?'<span class="goodtxt">✓ Đúng</span>':`<span class="badtxt">✗ ${q.answer}</span>`});$('#customScore').innerHTML=`<span class="score">${s}/${G.items.length} đúng · ${Math.round(s/G.items.length*100)}/100</span>`}
  } else if(G.type==='time'||G.type==='weather'){
    renderChoiceSet(G.items,null,true);
  } else if(G.type==='restaurant'){
    let current=0,selected=new Set();
    const renderOrder=()=>{const q=G.orders[current];body.innerHTML=`<div class="qcard"><div class="qtitle">Đơn ${current+1}/${G.orders.length}</div><button class="btn primary" id="hearOrder">🔊 Nghe khách gọi món</button><div class="menu-grid">${q.choices.map(x=>`<button class="menu-item" data-food="${x}">${x}</button>`).join('')}</div><div class="feedback" id="foodFb"></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="checkOrder">Kiểm tra đơn</button></div></div>`;$('#hearOrder').onclick=()=>speak(q.speech,.78);selected=new Set();body.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{const x=b.dataset.food;if(selected.has(x)){selected.delete(x);b.classList.remove('selected')}else{selected.add(x);b.classList.add('selected')}});$('#checkOrder').onclick=()=>{const want=[...q.want].sort().join('|'),got=[...selected].sort().join('|'),ok=want===got;$('#foodFb').innerHTML=ok?'<span class="goodtxt">✓ Đúng món!</span>':`<span class="badtxt">✗ Cần chọn: ${q.want.join(' + ')}</span>`;if(ok){setTimeout(()=>{current++;if(current<G.orders.length)renderOrder();else $('#customScore').innerHTML='<span class="score">Hoàn thành 100/100 🎉</span>'},500)}}};renderOrder();
  } else if(G.type==='timeline'||G.type==='airport'){
    const steps=G.steps;body.innerHTML=`<div class="drag-wrap"><div><b>Các chặng:</b><div class="drag-bank" id="dragBank">${shuffle(steps).map(x=>`<button class="drag-chip" draggable="true" data-step="${x}">${x}</button>`).join('')}</div></div><div><b>Thứ tự của bạn:</b><div class="drag-slots" id="dragSlots">${steps.map((_,i)=>`<div class="drop-slot" data-slot="${i}">${i+1}</div>`).join('')}</div></div><div class="feedback" id="dragFb"></div><div class="actions"><button class="btn" id="clearDrag">Làm lại</button><button class="btn primary" id="gradeCustom">Chấm game chủ đề</button></div></div>`;
    let selectedChip=null;const chips=body.querySelectorAll('.drag-chip'),slots=body.querySelectorAll('.drop-slot');
    function place(chip,slot){if(!chip||!slot)return;const old=body.querySelector(`.drop-slot[data-value="${chip.dataset.step}"]`);if(old){old.textContent=Number(old.dataset.slot)+1;old.classList.remove('filled');delete old.dataset.value}if(slot.dataset.value){const prev=body.querySelector(`.drag-chip[data-step="${slot.dataset.value}"]`);if(prev)prev.classList.remove('used')}slot.dataset.value=chip.dataset.step;slot.textContent=chip.dataset.step;slot.classList.add('filled');chip.classList.add('used');chips.forEach(x=>x.classList.remove('selected'));selectedChip=null}
    chips.forEach(ch=>{ch.ondragstart=e=>{e.dataTransfer.setData('text/plain',ch.dataset.step)};ch.onclick=()=>{chips.forEach(x=>x.classList.remove('selected'));selectedChip=ch;ch.classList.add('selected')}});slots.forEach(sl=>{sl.ondragover=e=>e.preventDefault();sl.ondrop=e=>{e.preventDefault();const val=e.dataTransfer.getData('text/plain');place(body.querySelector(`.drag-chip[data-step="${val}"]`),sl)};sl.onclick=()=>{if(selectedChip)place(selectedChip,sl)}});
    $('#clearDrag').onclick=()=>{slots.forEach(sl=>{sl.textContent=Number(sl.dataset.slot)+1;sl.classList.remove('filled');delete sl.dataset.value});chips.forEach(ch=>ch.classList.remove('used','selected'));selectedChip=null;$('#dragFb').textContent=''};
    $('#gradeCustom').onclick=()=>{const got=[...slots].map(sl=>sl.dataset.value||'');const ok=got.join('|')===steps.join('|');$('#dragFb').innerHTML=ok?'<span class="goodtxt">✓ Đúng thứ tự!</span>':`<span class="badtxt">✗ Đáp án: ${steps.join(' → ')}</span>`;$('#customScore').innerHTML=`<span class="score">${ok?'100/100':'Chưa đạt'}</span>`}
  }
}

init();
</script></body></html>
