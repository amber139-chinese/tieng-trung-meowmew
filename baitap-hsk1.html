<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập HSK1 · Tiếng Trung Meow Meow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --brand:#2E8AA3;--brand-2:#58B4C8;--brand-dark:#1F6479;--deep:#143F4F;--deep-2:#0E2F3C;
      --soft:#E8F4F7;--paper:#FBF8F2;--line:#DCE9EC;--white:#fff;
      --ink:#1B2E35;--muted:#5B7078;
      --gold:#F0B94B;--coral:#EF6A4C;--coral-dark:#D9533A;--seal:#D6453A;
      --shadow:0 14px 36px rgba(20,63,79,.10);
      --serif:"Noto Serif SC","Be Vietnam Pro",serif;--sans:"Be Vietnam Pro",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.7;background:var(--paper)}
    a{color:inherit;text-decoration:none}
    .container{width:min(900px,calc(100% - 32px));margin:0 auto}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(251,248,242,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .topbar-inner{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--deep)}
    .logo-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--seal),#F0806B);font-family:var(--serif);font-size:18px;font-weight:900}
    .user-chip{font-size:.85rem;font-weight:600;color:var(--brand-dark);background:var(--soft);padding:8px 14px;border-radius:999px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 28px;border-radius:999px;font-weight:700;font-size:.95rem;border:0;cursor:pointer;font-family:inherit;transition:.2s}
    .btn-primary{background:var(--coral);color:#fff;box-shadow:0 10px 22px rgba(239,106,76,.3)}
    .btn-primary:hover{background:var(--coral-dark);transform:translateY(-1px)}
    .hidden{display:none!important}
    .hero{padding:36px 0 18px}
    .hero h1{margin:0 0 8px;font-family:var(--serif);font-size:clamp(1.7rem,4vw,2.3rem);color:var(--deep)}
    .hero p{margin:0;color:var(--muted)}
    .back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;color:var(--brand-dark);margin-bottom:12px}
    .back:hover{color:var(--coral)}
    .section-kicker{display:inline-flex;align-items:center;gap:10px;font-size:.78rem;font-weight:800;letter-spacing:.14em;color:var(--brand-dark)}
    .section-kicker:before{content:"";width:26px;height:3px;border-radius:3px;background:var(--coral)}
    .ex-list{display:grid;gap:12px;padding-bottom:48px}
    .ex-item{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:16px;padding:16px 18px;border:1.5px solid var(--line);border-radius:18px;background:#fff;transition:.18s;box-shadow:0 6px 16px rgba(20,63,79,.06)}
    .ex-item:hover{border-color:var(--brand-2);transform:translateY(-2px);box-shadow:var(--shadow)}
    .ex-no{width:64px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:900;font-size:1.05rem;background:linear-gradient(145deg,var(--brand-dark),var(--brand-2))}
    .ex-item:nth-child(6n+2) .ex-no{background:linear-gradient(145deg,#E2573A,#F2866C)}
    .ex-item:nth-child(6n+3) .ex-no{background:linear-gradient(145deg,#C98A1E,#E9B94F)}
    .ex-item:nth-child(6n+4) .ex-no{background:linear-gradient(145deg,#4A6FA5,#86A2CC)}
    .ex-item:nth-child(6n+5) .ex-no{background:linear-gradient(145deg,#B84868,#DC8AA2)}
    .ex-item:nth-child(6n) .ex-no{background:linear-gradient(145deg,#2A8C86,#62BEB8)}
    .ex-title{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--deep);margin:0 0 2px}
    .ex-desc{margin:0;font-size:.88rem;color:var(--muted)}
    .ex-go{font-weight:800;font-size:.88rem;color:var(--coral);white-space:nowrap}
    @media(max-width:560px){
      .ex-item{grid-template-columns:52px 1fr;gap:12px}
      .ex-go{grid-column:2}
      .ex-no{width:52px;height:44px;font-size:.95rem}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="index.html"><span class="logo-mark">喵</span><span>Tiếng Trung Meow Meow</span></a>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <a id="teacherBtn" class="btn btn-primary hidden" href="quan-ly-bai-tap.html" style="min-height:38px;padding:8px 16px;font-size:.85rem">Quản lý bài tập</a>
        <div id="userChip" class="user-chip hidden">...</div>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="hero">
      <a class="back" href="hsk1.html">← Về HSK1</a>
      <div class="section-kicker">THƯ MỤC BÀI TẬP · 练习</div>
      <h1>Bài tập HSK1</h1>
      <p></p>
    </div>

    <div class="ex-list" id="exList"></div>
  </main>

  <script>
    // Danh sách 15 bài — link tới file bài tập riêng (bạn upload/sửa sau)
    const LESSONS = [
      { n: 1,  zh: "你好！",              vi: "Chào hỏi cơ bản",                    file: "hsk1-baitap/baitap-hsk1-bai01.html" },
      { n: 2,  zh: "我叫李文",             vi: "Hỏi tên, giới thiệu bản thân",        file: "hsk1-baitap/baitap-hsk1-bai02.html" },
      { n: 3,  zh: "我是中国人",           vi: "Quốc tịch, 是 / 的 / 吗",              file: "hsk1-baitap/baitap-hsk1-bai03.html" },
      { n: 4,  zh: "我有两个孩子",         vi: "Gia đình, số lượng, hỏi tuổi",        file: "hsk1-baitap/baitap-hsk1-bai04.html" },
      { n: 5,  zh: "今天我休息",           vi: "Ngày tháng, thứ trong tuần",          file: "hsk1-baitap/baitap-hsk1-bai05.html" },
      { n: 6,  zh: "你的手机号是多少？",   vi: "Số điện thoại, con số",               file: "hsk1-baitap/baitap-hsk1-bai06.html" },
      { n: 7,  zh: "我晚上六点半下班",     vi: "Nói giờ, phút, thời gian trong ngày", file: "hsk1-baitap/baitap-hsk1-bai07.html" },
      { n: 8,  zh: "我爸爸也在医院工作",   vi: "Nơi làm việc, 在 / 也",               file: "hsk1-baitap/baitap-hsk1-bai08.html" },
      { n: 9,  zh: "我明天上午在学校学习", vi: "Thời gian + địa điểm + hoạt động",    file: "hsk1-baitap/baitap-hsk1-bai09.html" },
      { n: 10, zh: "这儿的苹果真便宜",     vi: "Mua sắm, giá tiền",                   file: "hsk1-baitap/baitap-hsk1-bai10.html" },
      { n: 11, zh: "我读大学呢",           vi: "Học tập, đang diễn ra (呢)",          file: "hsk1-baitap/baitap-hsk1-bai11.html" },
      { n: 12, zh: "昨天下雪了",           vi: "Thời tiết, trợ từ 了",                file: "hsk1-baitap/baitap-hsk1-bai12.html" },
      { n: 13, zh: "请给我一杯茶",         vi: "Gọi món, lượng từ",                   file: "hsk1-baitap/baitap-hsk1-bai13.html" },
      { n: 14, zh: "我看了一个电影",       vi: "Hoạt động đã xảy ra, 了",             file: "hsk1-baitap/baitap-hsk1-bai14.html" },
      { n: 15, zh: "大兴机场见！",         vi: "Sân bay, di chuyển, hẹn gặp",         file: "hsk1-baitap/baitap-hsk1-bai15.html" }
    ];

    const $ = id => document.getElementById(id);

    $("exList").innerHTML = LESSONS.map(L => `
      <a class="ex-item" href="${L.file}">
        <span class="ex-no">${String(L.n).padStart(2, "0")}</span>
        <span>
          <div class="ex-title">Bài ${L.n} · ${L.zh}</div>
          <p class="ex-desc">${L.vi}</p>
        </span>
        <span class="ex-go">Vào bài →</span>
      </a>
    `).join("");

    // Hiện chip user + nút quản lý nếu đã login (amber123)
    (async function () {
      try {
        const db = window.supabase.createClient(
          "https://xmtvmwcjjqqzscmkdlwd.supabase.co",
          "sb_publishable_R5TEjUNB6lDTJuN4MNdhVQ_ANwIaKLP"
        );
        const { data: { session } } = await db.auth.getSession();
        if (!session) return;
        const meta = session.user.user_metadata || {};
        const name = meta.display_name || meta.username || session.user.email?.split("@")[0] || "Bạn";
        $("userChip").textContent = "Xin chào, " + name;
        $("userChip").classList.remove("hidden");
        if (["amber123","amber"].includes((meta.username || "").toLowerCase())) {
          $("teacherBtn").classList.remove("hidden");
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
