<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thi thử 2 - HSK 3.0 cấp 1</title>
<script src="assets/hsk-config.js"></script>
<style>
:root{--p:#e8554e;--p-d:#c93f39;--p-l:#fdeceb;--ink:#22252b;--mut:#6b7280;--ln:#e6e8ec;--bg:#f6f7f9;--card:#fff;--ok:#1f9d57;--ok-l:#e7f6ee;--bad:#d64545;--bad-l:#fdeeee;--am:#d98a0b;--fr:#f1f3f6}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,"Noto Sans SC","PingFang SC",sans-serif}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;transition:.15s}
.btn.pri{background:var(--p);color:#fff;box-shadow:0 4px 12px #e8554e40}.btn.pri:hover{background:var(--p-d)}
.btn.sec{background:#fff;color:var(--p);border:1.5px solid var(--p)}.btn.sec:hover{background:var(--p-l)}
.btn.ter{background:transparent;color:var(--mut);padding:11px 12px;text-decoration:underline}.btn.ter:hover{color:var(--ink)}
.btn.lg{padding:14px 28px;font-size:17px}
.bar{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.bar>div{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.bar h1{font-size:16px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.timer{font:700 22px/1 ui-monospace,Menlo,Consolas,monospace;padding:9px 14px;border-radius:12px;background:var(--fr);letter-spacing:.04em}
.timer.warn{background:#fff3dc;color:var(--am)}.timer.danger{background:var(--bad-l);color:var(--bad);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
.start{max-width:560px;margin:7vh auto;background:var(--card);border-radius:20px;padding:32px;box-shadow:0 10px 40px #0001;text-align:center}
.start h2{margin:0 0 4px;font-size:26px}.start p{color:var(--mut);margin:0 0 18px}
.start input{width:100%;padding:13px 14px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;margin-bottom:10px}.start input:focus{outline:0;border-color:var(--p)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px}.facts div{background:var(--fr);border-radius:12px;padding:12px 6px}.facts b{display:block;font-size:22px}.facts span{font-size:12px;color:var(--mut)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 10px}
.layout{max-width:1120px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
.sec{background:var(--card);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px #0000000d}
.sech{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:19px}.sech span{font-size:13px;font-weight:400;color:var(--mut)}
audio{width:100%;margin:0 0 6px}.hint{font-size:13px;color:var(--mut);margin:0 0 6px}
.ph{margin:22px 0 10px;padding-left:12px;border-left:4px solid var(--p)}.ph b{display:block}.ph span{font-size:13px;color:var(--mut)}
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 12px}
.fig{position:relative}.frame{display:block;aspect-ratio:4/3;background:var(--fr);border-radius:12px;overflow:hidden;border:1px solid var(--ln)}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.fig .lt{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.bank{background:var(--p-l);border-radius:12px;padding:12px 16px;margin:0 0 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px}.bank b{color:var(--p);margin-right:6px}
.q{padding:16px 0;border-top:1px solid var(--ln);scroll-margin-top:90px}.q:first-of-type{border-top:0}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.num{flex:none;min-width:34px;height:34px;border-radius:10px;background:var(--p-l);color:var(--p);display:grid;place-items:center;font-weight:800}
.qt{font-size:19px;padding-top:2px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.opts.imgs{grid-template-columns:repeat(3,1fr)}.opts.lt6{grid-template-columns:repeat(6,1fr);max-width:520px}
.opt{position:relative;display:flex;align-items:center;gap:10px;border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;transition:.12s}
.opt:hover{border-color:#f0a19d}.opt input{position:absolute;opacity:0}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fr);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt .oc small{display:block;color:var(--mut);font-size:12px;line-height:1.2}.opt .zh{font-size:18px}
.opt.on{border-color:var(--p);background:var(--p-l)}.opt.on .k{background:var(--p);color:#fff}
.opt:has(input:focus-visible){outline:3px solid #e8554e55}
.opts.imgs .opt{flex-direction:column;align-items:stretch;padding:8px}.opts.imgs .opt .frame{order:1}.opts.imgs .opt .k{order:2;align-self:center}
.opts.lt6 .opt{justify-content:center;padding:8px 0}
.done .opt{cursor:default;pointer-events:none}.opt.ok{border-color:var(--ok);background:var(--ok-l)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-l)}.opt.bad .k{background:var(--bad);color:#fff}
.sol{display:none;margin-top:12px;border-radius:12px;background:var(--fr);padding:12px 14px;font-size:15px}
.done .sol{display:block}.sol .v{font-weight:700;margin-bottom:6px}.sol .v.ok{color:var(--ok)}.sol .v.bad{color:var(--bad)}.sol .v.sk{color:var(--am)}
.sol p{margin:3px 0}.sol .tr{font-size:17px}.sol .vi{color:var(--mut)}
.side{position:sticky;top:84px;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 4px #0000000d;max-height:calc(100vh - 100px);overflow:auto}
.side h3{margin:0 0 8px;font-size:15px}.prog{height:8px;border-radius:8px;background:var(--fr);overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;width:0;background:var(--p);transition:.3s}
.cnt{font-size:13px;color:var(--mut);margin-bottom:12px}.cnt b{color:var(--ink);font-size:15px}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.nb{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--ln);background:#fff;font-weight:600;color:var(--mut)}.nb.a{background:var(--p);border-color:var(--p);color:#fff}
.nb.c{background:var(--ok);border-color:var(--ok);color:#fff}.nb.w{background:var(--bad);border-color:var(--bad);color:#fff}.nb.s{background:#fff;border:1.5px dashed var(--am);color:var(--am)}
.lg2{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);margin:0 0 12px}.lg2 i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--ln)}
.side .btn{width:100%;margin-top:6px}
.result{display:none;background:linear-gradient(135deg,#e8554e,#f08a5d);color:#fff;border-radius:18px;padding:22px;margin-bottom:18px}
.result.show{display:block}.result .big{font-size:52px;font-weight:800;line-height:1}.result .big small{font-size:22px;opacity:.85}
.pill{display:inline-block;vertical-align:middle;font-size:15px;font-weight:700;padding:5px 14px;border-radius:99px;background:#fff;margin-left:8px}.pill.ok{color:var(--ok)}.pill.no{color:var(--bad)}.result .sub{margin-top:6px;opacity:.95}.rs{display:flex;flex-wrap:wrap;gap:12px 28px;margin:12px 0 16px}.rs div{background:#ffffff26;border-radius:12px;padding:8px 14px}.rs b{font-size:20px}
.result .btn.pri{background:#fff;color:var(--p-d);box-shadow:none}.result .btn.sec{background:transparent;color:#fff;border-color:#fff}.result .btn.ter{color:#fff}
.flt{display:none;gap:6px;margin:0 0 14px}.flt.show{display:flex}.flt button{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;color:var(--mut)}.flt button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hide{display:none!important}
dialog{border:0;border-radius:18px;padding:24px;max-width:420px;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}
dialog h3{margin:0 0 6px}dialog p{color:var(--mut);margin:0 0 18px}.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;display:none}
.fab{display:none}#close{display:none}
@media(max-width:980px){
 #close{display:block}.layout{grid-template-columns:1fr;padding:10px}.side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:20px 20px 0 0;max-height:72vh;transform:translateY(105%);transition:.25s;box-shadow:0 -10px 40px #0003}.side.open{transform:none}
 .fab{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:13px 16px;justify-content:space-between;font-weight:700;box-shadow:0 8px 24px #0004}
 body{padding-bottom:72px}.opts.imgs,.pool{gap:6px}.opts.lt6{grid-template-columns:repeat(6,1fr)}.bar h1 small{display:none}.timer{font-size:19px;padding:8px 10px}.btn.lg{width:100%}
}
@media print{.bar,.side,.fab{display:none}#close{display:none}}
</style></head><body>

function show(){const s=score(),pc=Math.round(s.t/TOTAL*100),un=TOTAL-Object.keys(S.ans).length;
 const res=$('#res');res.className='result show';res.innerHTML=`<div class="big">${s.t*5}<small>/200 điểm</small> <span class="pill ${s.t*5>=120?'ok':'no'}">${s.t*5>=120?'✓ Đạt':'Chưa đạt'}</span></div><div class="sub">Đúng ${s.t}/${TOTAL} câu · ${pc}% · Điểm đạt: từ 120/200</div><div class="rs"><div>🎧 Nghe hiểu <b>${s.l*5}/100</b></div><div>📖 Đọc hiểu <b>${s.r*5}/100</b></div><div>✗ Sai <b>${TOTAL-s.t-un}</b></div><div>– Bỏ trống <b>${un}</b></div></div><button class="btn pri" id="rv">Xem lời giải câu sai</button> <button class="btn sec" id="rt">Làm lại</button> <button class="btn ter" id="mail">Gửi kết quả cho giáo viên</button>`;
 $('#flt').classList.add('show');document.body.classList.add('done');$('#tm').textContent='Đã nộp ✓';$('#tm').className='timer';$('.lg2').innerHTML='<span><i style="background:var(--ok);border-color:var(--ok)"></i>Đúng</span><span><i style="background:var(--bad);border-color:var(--bad)"></i>Sai</span><span><i style="border:1.5px dashed var(--am)"></i>Bỏ trống</span>';$('#sub').classList.add('hide');$('#sub2').classList.add('hide');clearInterval(iv);
 X.qs.forEach(q=>{const a=S.ans[q.n],ok=a===q.a,ob=q.opts.find(o=>o.k===q.a),ya=q.opts.find(o=>o.k===a);
  const ct=o=>o?(o.zh?o.k+' · '+o.zh:o.k):'';const el=document.querySelector(`#q${q.n} .sol`);
  el.innerHTML=`<div class="v ${ok?'ok':a?'bad':'sk'}">${ok?'✓ Chính xác':a?'✗ Chưa đúng — bạn chọn '+ct(ya):'– Bạn chưa chọn đáp án'}</div><p>Đáp án đúng: <b>${ct(ob)}</b></p>${q.tr?`<p class="tr">🎧 ${q.tr}</p>`:''}<p class="vi">${q.vi}</p>`;
  document.getElementById('q'+q.n).dataset.st=ok?'c':a?'w':'s'});
 $('#rv').onclick=()=>{flt('w')};$('#rt').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};$('#mail').onclick=mail}
document.addEventListener('click',e=>{const b=e.target.closest('.flt button');if(b)flt(b.dataset.f)});
function flt(f){document.querySelectorAll('.flt button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
 document.querySelectorAll('.q').forEach(q=>q.classList.toggle('hide',f==='w'?q.dataset.st!=='w':f==='s'?q.dataset.st!=='s':false));
 document.querySelectorAll('.sec').forEach(sec=>{let grp=[],vis=false;const flush=()=>{grp.forEach(e=>e.classList.toggle('hide',f!=='all'&&!vis));grp=[];vis=false};
  [...sec.children].forEach(e=>{if(e.classList.contains('ph')){flush();grp=[e]}else if(e.classList.contains('pool')||e.classList.contains('bank'))grp.push(e);else if(e.classList.contains('q')){if(!e.classList.contains('hide'))vis=true}});flush()});
 (document.querySelector('.q:not(.hide)')||$('#flt')).scrollIntoView({block:'start'})}
function payload(){const s=score();return{lesson:'Thi thử số '+X.id,student:{name:S.name,cls:S.cls},time:new Date().toLocaleString('vi-VN'),score:s.t*5+'/200',passed:s.t*5>=120,correct:s.t+'/'+TOTAL,listening:s.l*5+'/100',reading:s.r*5+'/100',answers:X.qs.map(q=>({q:q.n,answer:S.ans[q.n]||'',correct:q.a,ok:S.ans[q.n]===q.a}))}}
async function send(){if(!C.ENDPOINT)return;try{await fetch(C.ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload())});toast('Đã gửi kết quả cho giáo viên ✓')}catch(e){toast('Gửi kết quả lỗi, bấm “Gửi kết quả cho giáo viên” để thử lại.')}}
function mail(){if(C.ENDPOINT){send();return}const p=payload();location.href=`mailto:${C.FALLBACK_EMAIL||''}?subject=${encodeURIComponent('Thi thử HSK1 số '+X.id+' - '+S.name+' - '+S.cls)}&body=${encodeURIComponent(p.score+(p.passed?' - Đạt':' - Chưa đạt')+' (Nghe hiểu '+p.listening+', Đọc hiểu '+p.reading+'; đúng '+p.correct+')\n'+p.answers.map(a=>a.q+'.'+(a.answer||'-')).join(' '))}`}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
if(S.start&&S.name)begin();
</script></body></html>
