<style>
/* ===========================================================
   Tiếng Trung Meow Meow — theme dùng chung cho bai1..bai15
   Ghi đè lên CSS có sẵn trong từng bài, nên chỉ cần 1 file này

@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap');

:root{

}
body{font-family:var(--sans);color:var(--ink);

  background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.brand{gap:12px}

.hero{border-radius:30px;padding:30px 30px 28px;

.pill{border-radius:999px;padding:7px 13px;font-weight:800;background:#fff;box-shadow:0 2px 8px rgba(143,58,88,.05)}

/* ---------- Panel + tab ---------- */
.panel{border-radius:28px;box-shadow:var(--shadow)}

.btn{border-radius:13px;transition:.15s;box-shadow:0 2px 8px rgba(143,58,88,.05)}

  background-repeat:no-repeat;background-position:13px center}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vcard{position:relative;border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;background:linear-gradient(160deg,#fff,#fff6f9);
  cursor:pointer;transition:.18s;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:158px;font:inherit;color:inherit}
.vcard:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(143,58,88,.15);border-color:var(--rose3)}

.vcard .no{position:absolute;top:10px;left:14px;font-size:11px;font-weight:800;color:#c8b4bb}

.vgrid.hide .vcard .mean{filter:blur(7px);opacity:.5}
.vgrid.hide .vcard:hover .mean,.vgrid.hide .vcard:focus-visible .mean{filter:none;opacity:1}
.v-empty{text-align:center;color:var(--muted);padding:40px 10px;border:2px dashed var(--line);border-radius:20px}

.char-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.irow{border-radius:16px;padding:12px 14px;border:1px solid var(--line);background:#fffafb}

.irow .v{font-size:15px;line-height:1.55;color:#40333a;font-weight:600}
.irow.rad{background:linear-gradient(135deg,#fff8ec,#fffaf4);border-color:#f0dcb8}

.bo-glyph{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--rose2);margin-right:8px;vertical-align:middle}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.steps .lbl{width:100%;font-size:12.5px;font-weight:900;color:var(--muted);margin-bottom:2px}
.steps .lbl em{font-style:normal;color:#b9891f}

.step svg{width:64px;height:64px;border:1px solid var(--line);border-radius:12px;background:#fff}

.bo-item{display:flex;align-items:center;gap:10px;border:1px solid #f0dcb8;background:linear-gradient(135deg,#fffaf1,#fff);border-radius:16px;padding:8px 14px 8px 10px;cursor:pointer;transition:.15s}
.bo-item:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(180,120,40,.15)}
.bo-item b{font-family:var(--serif);font-size:30px;color:var(--rose2);line-height:1}
.bo-item small{display:block;font-weight:800;color:#8a6422;font-size:12px}

<script>
/* Tiếng Trung Meow Meow — HSK2 · Bài 14 — dữ liệu chữ Hán + từ vựng. Sửa trực tiếp được. */
window.MEOW_CHARS = window.MEOW_CHARS || {};
Object.assign(window.MEOW_CHARS, {"站":["立 (lập)","立 (bộ lập) + 占 (phần âm zhàn)","Đây là chữ hình thanh: 立 gợi nghĩa liên quan đến tư thế đứng; 占 gợi âm đọc zhàn.","Đứng thẳng trên đôi chân 立; phần 占 giúp nhớ âm zhàn → 站."],"包":["勹 (bao)","勹 (bao bọc) + 巳 (phần bên trong)","勹 tạo khung bao bọc phần bên trong. Có thể nhìn hình thể chữ để liên tưởng đến việc gói hoặc bọc một vật.","Một vật được 勹 bao lấy → 包 (bao, cái túi)."],"过":["辶 (sước)","辶 (bộ sước) + 寸 (phần còn lại của chữ giản thể)","辶 là bộ liên quan đến bước đi, di chuyển. Chữ giản thể 过 thường gặp trong nghĩa đi qua, trải qua.","Thấy bộ 辶 như bước chân đang di chuyển qua một nơi → 过."],"年":["干 (can)","Chữ độc thể; không tách thành công thức bộ thủ và phần âm đơn giản","年 là chữ độc thể. Dạng chữ cổ thường được giải thích gắn với hình ảnh người gánh lúa/mùa thu hoạch; nghĩa phát triển thành một năm.","Mùa thu hoạch trở lại theo chu kỳ mỗi năm → 年 (năm)."],"没":["氵 (thủy)","氵 (nước) + 殳 (thành phần âm trong chữ 沒)","氵 gợi liên hệ với nước. Chữ giản thể 没 kế thừa cấu tạo của 沒; không nên lấy nghĩa riêng của 殳 để suy ra nghĩa toàn chữ.","Liên tưởng đồ vật chìm/mất trong nước 氵 → 没 (không có, chưa)."],"意":["心 (tâm)","音 (âm) + 心 (tim)","意 gồm 音 ở trên và 心 ở dưới. 心 là bộ nghĩa, gợi suy nghĩ và ý định xuất phát từ trong lòng.","Âm thanh 音 vang lên trong tim 心 thành ý nghĩ, ý định → 意."],"思":["心 (tâm)","田 (phần trên) + 心 (tim)","思 gồm 田 ở trên và 心 ở dưới. Đây là cách phân tích mặt chữ để ghi nhớ, không có nghĩa là từng phần luôn mang nghĩa độc lập trong từ.","Dùng đầu óc và trái tim để suy nghĩ → 思 (nghĩ)."],"位":["亻 (nhân đứng)","亻 (người) + 立 (đứng)","亻 gợi nghĩa liên quan đến con người; 立 gợi hình ảnh đứng ở một vị trí. 位 có nghĩa là vị trí và được dùng làm lượng từ lịch sự cho người.","Mỗi người 亻 có một vị trí 立 → 位; dùng 这位 để nói lịch sự về một người."],"前":["刂 (đao đứng)","䒑 (phần trên) + 月 (phần giữa) + 刂 (bộ đao đứng)","刂 là bộ thủ của chữ 前. Hình thể chữ có cấu tạo lịch sử phức tạp; các phần trên đây giúp nhận diện chữ, không nên gán nghĩa riêng cho từng nét.","Nhớ 前 là hướng ở phía trước; 刂 là dấu hiệu nhận diện bộ thủ của chữ."],"面":["面 (diện)","Chữ độc thể, bộ thủ của chính nó","面 là chữ độc thể, có nghĩa là mặt; từ đó mở rộng thành bề mặt hoặc phương hướng như 前面.","Tưởng tượng một khuôn mặt nhìn thẳng → 面 (mặt, phía)."],"房":["户 (hộ)","户 (cửa nhà) + 方 (phần âm fáng)","Đây là chữ hình thanh: 户 gợi nghĩa liên quan đến nhà/cửa; 方 góp phần gợi âm đọc fáng.","Cửa 户 dẫn vào một căn nhà → 房 (nhà)."],"子":["子 (tử)","Chữ độc thể, dạng chữ cổ mô phỏng em bé","子 là chữ độc thể, dạng chữ cổ thường được giải thích là hình em bé. Chữ dùng với nghĩa con, trẻ nhỏ.","Liên tưởng hình ảnh em bé → 子 (con, trẻ)."],"小":["小 (tiểu)","Chữ độc thể gồm ba nét nhỏ","小 là chữ độc thể; hình thể ba nét nhỏ gợi ý nghĩa nhỏ bé.","Ba nét nhỏ xíu → 小 (nhỏ)."],"孩":["子 (tử)","子 (trẻ nhỏ) + 亥 (phần âm hái)","Đây là chữ hình thanh: 子 gợi nghĩa liên quan đến trẻ em; 亥 góp phần gợi âm đọc hái.","Bộ 子 báo hiệu nghĩa liên quan đến trẻ nhỏ; 亥 giúp nhớ âm hái → 孩."],"儿":["儿 (nhi)","Chữ độc thể; trong 小孩儿、女孩儿 là thành phần 儿化","儿 có thể mang nghĩa trẻ nhỏ. Trong các từ 小孩儿 và 女孩儿, 儿 tạo âm hóa ở cuối từ, thường không đọc thành một âm tiết riêng.","Nhớ 儿 trong 小孩儿、女孩儿 là đuôi 儿化, làm âm cuối mang sắc thái -r."],"女":["女 (nữ)","Chữ độc thể, dạng chữ cổ mô phỏng hình người phụ nữ","女 là chữ độc thể, nghĩa là nữ/phụ nữ; đồng thời là bộ thủ trong nhiều chữ liên quan đến nữ giới hoặc quan hệ gia đình.","Liên tưởng hình người phụ nữ trong chữ cổ → 女."],"姓":["女 (nữ)","女 (bộ nữ) + 生 (phần âm shēng)","Đây là chữ hình thanh: 女 là bộ nghĩa, 生 góp phần gợi âm. 姓 dùng để nói họ của một người.","女 + 生 ghép thành 姓; gặp 姓 thì nghĩ đến họ tên của một người."],"眼":["目 (mục)","目 (mắt) + 艮 (phần âm gèn trong cấu tạo chữ)","Đây là chữ hình thanh: 目 gợi nghĩa liên quan đến mắt; 艮 là thành phần góp phần gợi âm trong cấu tạo chữ.","Thấy bộ 目 là nghĩ đến mắt → 眼."],"睛":["目 (mục)","目 (mắt) + 青 (phần âm qīng)","Đây là chữ hình thanh: 目 gợi nghĩa liên quan đến mắt; 青 là thành phần gợi âm. 睛 thường xuất hiện trong từ 眼睛.","Có bộ 目 nên liên quan đến mắt; nhớ 睛 là phần thứ hai trong 眼睛."],"跳":["足 (túc)","足 (chân) + 兆 (phần âm tiào)","Đây là chữ hình thanh: 足 gợi hành động dùng chân; 兆 góp phần gợi âm đọc tiào.","Dùng chân 足 bật lên khỏi mặt đất để nhảy → 跳."],"舞":["夕 (tịch)","舛 (bộ suyễn, hình hai chân) + 無 (thành phần âm theo giải thích chữ cổ)","舞 có cấu tạo phức tạp. Theo giải thích chữ cổ, 舛 gợi hai bàn chân đặt ngược hướng, còn 無 là thành phần âm; chữ gắn với động tác dùng chân và cơ thể để múa. Bộ tra cứu của chữ giản thể thường xếp dưới 夕.","Tưởng tượng hai chân thay đổi hướng theo nhịp điệu → 舞 (múa)."]});
window.MEOW_WORDS = window.MEOW_WORDS || {};
Object.assign(window.MEOW_WORDS, {"站":["Động từ","我站在家门前了，你快点儿。|Wǒ zhàn zài jiāmén qián le, nǐ kuài diǎnr.|Tôi đã đứng trước cửa nhà rồi, bạn mau lên.","你家楼下站着两个人。|Nǐ jiā lóuxià zhànzhe liǎng ge rén.|Dưới nhà bạn có hai người đang đứng.","站起来！|Zhàn qǐlái!|Đứng dậy!"],"包":["Danh từ","他手里拿着黑色的包。|Tā shǒu lǐ názhe hēisè de bāo.|Trong tay anh ấy đang cầm một chiếc túi màu đen.","这个包里面有我的钱包。|Zhège bāo lǐmiàn yǒu wǒ de qiánbāo.|Trong chiếc túi này có ví tiền của tôi."],"过年":["Động từ","我们一起过年过得很开心。|Wǒmen yìqǐ guònián guò de hěn kāixīn.|Chúng tôi đón Tết cùng nhau rất vui.","你们过年过得怎么样？|Nǐmen guònián guò de zěnmeyàng?|Các bạn đón Tết thế nào?"],"没意思":["Cụm tính từ","这个电影真没意思。|Zhège diànyǐng zhēn méi yìsi.|Bộ phim này thật nhàm chán.","一个人过年真的没意思。|Yí ge rén guònián zhēn de méi yìsi.|Đón Tết một mình thật sự rất buồn chán."],"位":["Lượng từ (kính ngữ)","介绍一下，这位是我汉语老师。|Jièshào yíxià, zhè wèi shì wǒ Hànyǔ lǎoshī.|Xin giới thiệu, đây là giáo viên tiếng Trung của tôi.","请问，您几位？|Qǐngwèn, nín jǐ wèi?|Xin hỏi, quý vị có mấy người?"],"前面":["Danh từ phương vị","前面那位先生就是王医生。|Qiánmiàn nà wèi xiānsheng jiù shì Wáng yīshēng.|Vị tiên sinh phía trước chính là bác sĩ Vương.","前面的车怎么了？怎么还不开呢？|Qiánmiàn de chē zěnme le? Zěnme hái bù kāi ne?|Chiếc xe phía trước bị sao vậy? Sao vẫn chưa chạy?"],"房子":["Danh từ","你住的房子真不错。|Nǐ zhù de fángzi zhēn búcuò.|Căn nhà bạn đang ở thật sự rất tốt.","楼上的房子是我好朋友的。|Lóushàng de fángzi shì wǒ hǎo péngyou de.|Căn nhà ở tầng trên là của bạn thân tôi."],"小孩儿":["Danh từ","他们家的小孩儿很可爱。|Tāmen jiā de xiǎoháir hěn kě'ài.|Đứa trẻ nhà họ rất đáng yêu.","我小孩儿今年八岁。|Wǒ xiǎoháir jīnnián bā suì.|Con tôi năm nay tám tuổi."],"女孩儿":["Danh từ","他们家有个女孩儿，她也学中文。|Tāmen jiā yǒu ge nǚháir, tā yě xué Zhōngwén.|Nhà họ có một bé gái, cô bé ấy cũng học tiếng Trung.","你看那个穿着红色裤子的女孩儿！真漂亮！|Nǐ kàn nàge chuānzhe hóngsè kùzi de nǚháir! Zhēn piàoliang!|Nhìn bé gái mặc chiếc quần màu đỏ kia kìa! Đẹp thật!"],"姓":["Động từ","那位先生姓王。|Nà wèi xiānsheng xìng Wáng.|Vị tiên sinh đó họ Vương.","请问，您贵姓？|Qǐngwèn, <script>window.MEOW_CONFIG={className:"Lớp HSK 2 · 3.0"};</script>
<script>
/* ===========================================================
   Tiếng Trung Meow Meow — tab Từ vựng (dùng chung bai1..bai15)
   Cần: meow-vocab-data.js (MEOW_CHARS, MEOW_WORDS) nạp trước file này.
   Đổi tên lớp / tên web: sửa MEOW_CONFIG bên dưới (hoặc khai báo
   window.MEOW_CONFIG = {...} trước khi nạp file này).
   =========================================================== */
(function () {
  'use strict';

  var CFG = Object.assign({
    brand: 'Tiếng Trung Meow Meow',
    className: 'Lớp HSK 1'
  }, window.MEOW_CONFIG || {});
  window.MEOW_CONFIG = CFG;

  var CH = window.MEOW_CHARS || {};
  var WD = window.MEOW_WORDS || {};
  var HW_URL = 'https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js';

  var isHan = function (c) { return /[\u4e00-\u9fff]/.test(c); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m];
    });
  };
  var plain = function (s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  };
  var q = function (s, r) { return (r || document).querySelector(s); };
  var qa = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var say = function (t, rate) { if (typeof speak === 'function') speak(t, rate); };

  /* ---------- Bộ thủ ---------- */
  function parseRad(r) {
    r = String(r || '');
    var m = r.match(/^(\S+)\s*(?:\((.*)\))?/);
    return { glyph: m ? m[1] : r, name: m && m[2] ? m[2] : '' };
  }

  function radSet(r) { var o = {}; String(r.glyph).split(/[\/\s]+/).forEach(function (g) { for (var i = 0; i < g.length; i++) o[g[i]] = 1; }); return o; }
  function hl(t, rs) { return esc(t).replace(/[\u2E80-\u2FDF\u3400-\u9FFF\uF900-\uFAFF]/g, function (c) { return '<span class="' + (rs[c] ? 'hz-rad' : 'hz-cmp') + '">' + c + '</span>'; }); }
  function tiles(t, rs) {
    var ps = String(t).split(/\s+\+\s+/); if (ps.length < 2) return '';
    var out = [];
    for (var i = 0; i < ps.length; i++) {
      var m = ps[i].match(/^([\u2E80-\u9FFF\u3400-\u4DBF]+)\s*[\(（]?([^\)）]*)[\)）]?\s*(.*)$/);
      if (!m) return '';
      var cap = (m[2] || m[3] || '').trim(), isR = !!rs[m[1][0]], isP = /âm/i.test(cap);
      out.push('<div class="ftile ' + (isR ? 'rad' : isP ? 'pho' : '') + '"><span class="g">' + esc(m[1]) + '</span><span class="c">' + esc(cap) + '</span>' + (isR ? '<span class="role">BỘ THỦ</span>' : isP ? '<span class="role">PHẦN ÂM</span>' : '<span class="role" style="color:var(--muted)">PHẦN NGHĨA</span>') + '</div>');
    }
    return '<div class="formula-strip">' + out.join('<span class="fop">+</span>') + '</div>';
  }
  function uniqChars(word) {
    var seen = {}, out = [];
    word.split('').forEach(function (c) { if (isHan(c) && !seen[c]) { seen[c] = 1; out.push(c); } });
    return out;
  }

  /* ---------- Hanzi Writer (thứ tự nét) ---------- */
  var hwPromise = null;
  function loadHW() {
    if (window.HanziWriter) return Promise.resolve(window.HanziWriter);
    if (hwPromise) return hwPromise;
    hwPromise = new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = HW_URL;
      s.onload = function () { window.HanziWriter ? res(window.HanziWriter) : rej(new Error('no HW')); };
      s.onerror = function () { hwPromise = null; rej(new Error('load fail')); };
      document.head.appendChild(s);
    });
    return hwPromise;
  }
  var mountToken = 0;

  function strokeSteps(data) {
    var rad = {};
    (data.radStrokes || []).forEach(function (i) { rad[i] = 1; });
    return data.strokes.map(function (_, i) {
      var paths = data.strokes.slice(0, i + 1).map(function (p, j) {
        var col = j === i ? (rad[j] ? '#e0a95a' : '#c4587a') : '#d9c6cd';
        return '<path d="' + p + '" fill="' + col + '"/>';
      }).join('');
      return '<div class="step"><svg viewBox="0 0 1024 1024"><g transform="translate(0,900) scale(1,-1)">' + paths + '</g></svg><span>' + (i + 1) + '</span></div>';
    }).join('');
  }

  function mountWriter(col, ch, stepsBox) {
    var token = ++mountToken;
    var slow = !!col._slow;
    col.innerHTML = '<div class="hw-board"><div class="hw-target"></div></div>' +
      '<div class="hw-info" data-info>Đang tải thứ tự nét…</div>' +
      '<div class="hw-ctrl">' +
      '<button class="btn primary" data-a="play"> Xem nét</button>' +
      '<button class="btn" data-a="quiz"> Viết thử</button>' +
      '<button class="btn' + (slow ? ' primary' : '') + '" data-a="slow"> Chậm</button></div>';
    stepsBox.innerHTML = '';
    var target = q('.hw-target', col), info = q('[data-info]', col);

    loadHW().then(function (HW) {
      if (token !== mountToken) return;
      var alive = true, gen = 0, quizzing = false;
      var writer = HW.create(target, ch, {
        width: 236, height: 236, padding: 14, showOutline: true, showCharacter: false,
        strokeColor: '#8f3a58', radicalColor: '#e0a95a', outlineColor: '#efdde3',
        highlightColor: '#c4587a', drawingColor: '#3f2430',
        strokeAnimationSpeed: slow ? 0.45 : 1, delayBetweenStrokes: slow ? 600 : 320, strokeFadeDuration: 250
      });
      function loop() {
        if (!alive || token !== mountToken) return;
        var g = ++gen;
        writer.animateCharacter({
          onComplete: function () {
            setTimeout(function () { if (alive && g === gen && token === mountToken && !quizzing) loop(); }, 1400);
          }
        });
      }
      loop();
      col.onclick = function (e) {
        var b = e.target.closest('[data-a]'); if (!b) return;
        var a = b.getAttribute('data-a');
        if (a === 'play') {
          quizzing = false; writer.cancelQuiz(); writer.hideCharacter(); writer.showOutline();
          info.textContent = ''; loop();
        } else if (a === 'quiz') {
          quizzing = true; ++gen; writer.cancelQuiz(); writer.hideCharacter(); writer.showOutline();
          info.textContent = 'Hãy viết từng nét theo đúng thứ tự ';
          writer.quiz({ onComplete: function () { quizzing = false; info.innerHTML = '<b>Giỏi quá iii, Meow tự hào về bạn!</b> Bấm “Xem nét” để xem lại.'; } });
        } else if (a === 'slow') {
          alive = false; col._slow = !slow; mountWriter(col, ch, stepsBox);
        }
      };
      HW.loadCharacterData(ch).then(function (data) {
        if (token !== mountToken) return;
        if (!quizzing) info.innerHTML = '<b>' + data.strokes.length + ' nét</b> · nét vàng là bộ thủ';
        stepsBox.innerHTML = '<div class="lbl">Thứ tự từng nét <em>(vàng = nét thuộc bộ thủ)</em></div>' + strokeSteps(data);
      }).catch(function () { info.textContent = ''; });
      col._stop = function () { alive = false; try { writer.cancelQuiz(); } catch (e) { } };
    }).catch(function () {
      if (token !== mountToken) return;
      col.innerHTML = '<div class="hw-board"><div class="hw-msg" style="padding-top:90px">Cần kết nối mạng để xem thứ tự nét </div></div>';
    });
  }

  /* ---------- Chi tiết từ ---------- */
  var modal, cur = 0, curChar = 0;

  function ensureModal() {
    if (modal) return;
    modal = document.createElement('div');
    modal.className = 'vmodal';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.innerHTML = '<div class="vsheet" id="vsheet"></div>';
    document.body.appendChild(modal);
    modal.addEventListener('mousedown', function (e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      else if (e.target.tagName !== 'INPUT') {
        if (e.key === 'ArrowLeft') go(-1);
        if (e.key === 'ArrowRight') go(1);
      }
    });
  }
  function closeModal() {
    if (!modal) return;
    mountToken++;
    qa('.hw-col', modal).forEach(function (c) { c._stop && c._stop(); });
    modal.classList.remove('open');
    document.body.style.overflow = '';
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
  function go(d) {
    var n = D.vocab.length;
    openWord((cur + d + n) % n);
  }

  function parseEx(s) {
    var p = String(s).split('|');
    return { cn: p[0] || '', py: p[1] || '', vi: p[2] || '' };
  }
  function hl(cn, word) {
    var e = esc(cn);
    var w = esc(word);
    if (w && e.indexOf(w) > -1) return e.replace(w, '<mark>' + w + '</mark>');
    return e;
  }

  function openWord(i) {
    ensureModal();
    cur = i; curChar = 0;
    var v = D.vocab[i], word = v[0], info = WD[word];
    var chars = uniqChars(word);
    var sheet = q('#vsheet', modal);

    var examples = info ? info.slice(1).map(parseEx) : [];
    var exHTML = examples.length ? examples.map(function (e, k) {
      return '<div class="ex"><div><div class="ecn">' + hl(e.cn, word) + '</div><div class="epy">' + esc(e.py) + '</div><div class="evi">' + esc(e.vi) + '</div></div>' +
        '<button class="iconbtn" data-ex="' + k + '" title="Nghe câu">Nghe</button></div>';
    }).join('') : '<div class="evi" style="color:var(--muted)">Chưa có ví dụ cho từ này.</div>';

    var boHTML = chars.filter(function (c) { return CH[c]; }).map(function (c) {
      var r = parseRad(CH[c][0]);
      return '<div class="bo-item" data-bo="' + c + '" title="Xem chữ ' + c + '"><b>' + esc(r.glyph) + '</b><div><small>' + esc(r.name || 'bộ ' + r.glyph) + '</small><span>trong chữ ' + c + '</span></div></div>';
    }).join('');

    sheet.innerHTML =
      '<button class="vclose" aria-label="Đóng">×</button>' +
      '<div class="vhead">' +
        '<div class="vbig">' + esc(word) + '</div>' +
        '<div class="vpy">' + esc(v[1]) + '</div>' +
        '<div class="vvi">' + esc(v[2]) + '</div>' +
        '<div class="vmeta">' +
          (info ? '<span class="tag gold">' + esc(info[0]) + '</span>' : '') +
          (v[3] ? '<span class="tag" style="background:#e6efff;color:#27508f">Từ mở rộng</span>' : '') +
          '<button class="btn primary" data-say="1">Nghe</button>' +
          '<button class="btn" data-say=".55"> Nghe chậm</button>' +
        '</div>' +
      '</div>' +
      '<div class="vbody">' +
        '<section class="vsec"><h4>Ví dụ</h4>' + exHTML + '</section>' +
        '<section class="vsec"><h4>Thứ tự nét · chiết tự · mẹo nhớ</h4>' +
          (chars.length > 1 ? '<div class="char-tabs">' + chars.map(function (c, k) { return '<button class="ctab' + (k === 0 ? ' on' : '') + '" data-c="' + k + '">' + c + '</button>'; }).join('') + '</div>' : '') +
          '<div class="char-panel"><div class="hw-col"></div><div class="info-col"></div></div>' +
          '<div class="steps"></div>' +
        '</section>' +
        (boHTML ? '<section class="vsec"><h4>Các bộ có trong từ</h4><div class="bo-list">' + boHTML + '</div></section>' : '') +
      '</div>' +
      '<div class="vnav"><button class="btn" data-nav="-1">Từ trước</button><span class="mid">' + (i + 1) + ' / ' + D.vocab.length + '</span><button class="btn" data-nav="1">Từ sau</button></div>';

    sheet.onclick = function (e) {
      var t = e.target.closest('button,[data-bo]'); if (!t) return;
      if (t.classList.contains('vclose')) return closeModal();
      if (t.hasAttribute('data-say')) return say(word, parseFloat(t.getAttribute('data-say')) || .88);
      if (t.hasAttribute('data-ex')) return say(examples[+t.getAttribute('data-ex')].cn, .85);
      if (t.hasAttribute('data-nav')) return go(+t.getAttribute('data-nav'));
      if (t.hasAttribute('data-c')) return showChar(chars, +t.getAttribute('data-c'));
      if (t.hasAttribute('data-bo')) { var k = chars.indexOf(t.getAttribute('data-bo')); if (k > -1) { showChar(chars, k); q('.vsec:nth-of-type(2)', sheet).scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } }
    };

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    modal.scrollTop = 0;
    showChar(chars, 0);
  }

  function showChar(chars, k) {
    curChar = k;
    var sheet = q('#vsheet', modal), ch = chars[k];
    qa('.ctab', sheet).forEach(function (b, j) { b.classList.toggle('on', j === k); });
    var col = q('.hw-col', sheet);
    col._stop && col._stop(); col._slow = false;
    var d = CH[ch];
    var box = q('.info-col', sheet);
    if (d) {
      var r = parseRad(d[0]), rs = radSet(r);
      box.innerHTML =
        '<div class="irow rad"><div class="k">Bộ thủ của chữ này</div><div class="v"><span class="bo-glyph">' + esc(r.glyph) + '</span>' + esc(r.name) + '</div></div>' +
        '<div class="irow"><div class="k">Chiết tự: tách chữ ra từng phần</div><div class="v"><div class="legend"><span class="l-rad">Bộ thủ</span><span class="l-pho">Phần khác</span></div>' + tiles(d[1], rs) + '<div>' + hl(d[1], rs) + '</div></div></div>' +
        '<div class="irow"><div class="k">Meow giải nghĩa</div><div class="v">' + hl(d[2], rs) + '</div></div>' +
        '<div class="irow tip"><div class="k">Mẹo nhớ của Meow</div><div class="v">' + hl(d[3], rs) + '</div></div>';
    } else {
      box.innerHTML = '<div class="irow"><div class="v">Meow chưa soạn chiết tự cho chữ này, đợi Meow nha.</div></div>';
    }
    mountWriter(col, ch, q('.steps', sheet));
  }

  /* ---------- Tab Từ vựng ---------- */
  var vs = { q: '', hide: false, rad: '' };

  function radicalMap() {
    var m = {};
    D.vocab.forEach(function (v, i) {
      uniqChars(v[0]).forEach(function (c) {
        if (!CH[c]) return;
        var r = parseRad(CH[c][0]);
        var o = m[r.glyph] || (m[r.glyph] = { glyph: r.glyph, name: r.name, chars: {}, n: 0 });
        if (!o.chars[c]) { o.chars[c] = 1; o.n++; }
      });
    });
    return Object.keys(m).map(function (k) { return m[k]; })
      .sort(function (a, b) { return b.n - a.n; });
  }

  function matches(v) {
    if (vs.rad) {
      var ok = uniqChars(v[0]).some(function (c) { return CH[c] && parseRad(CH[c][0]).glyph === vs.rad; });
      if (!ok) return false;
    }
    if (!vs.q) return true;
    var s = plain(vs.q);
    return v[0].indexOf(vs.q) > -1 || plain(v[1]).indexOf(s) > -1 || plain(v[2]).indexOf(s) > -1;
  }

  window.renderVocab = function (c) {
    var rads = radicalMap().slice(0, 14);
    c.innerHTML =
      '<div class="section-intro"><div><h2> Từ vựng · ' + D.vocab.filter(function(x){return !x[3]}).length + ' từ' + (D.vocab.some(function(x){return x[3]}) ? ' + ' + D.vocab.filter(function(x){return x[3]}).length + ' từ mở rộng' : '') + '</h2>' +
      '<p>Bấm vào một từ, Meow sẽ chỉ bạn cách đọc, ví dụ, thứ tự nét, chiết tự, mẹo nhớ và các bộ thủ trong từ đó.</p></div></div>' +
      (rads.length ? '<div class="rad-strip"><span class="lbl"> Bộ thủ trong bài:</span>' +
        rads.map(function (r) { return '<button class="rad-chip' + (vs.rad === r.glyph ? ' on' : '') + '" data-rad="' + esc(r.glyph) + '" title="Lọc các từ có bộ ' + esc(r.glyph) + '"><b>' + esc(r.glyph) + '</b>' + esc(r.name) + ' ×' + r.n + '</button>'; }).join('') +
        '</div>' : '') +
      '<div class="v-toolbar">' +
        '<input class="vsearch" id="vq" type="search" placeholder="Tìm chữ Hán, pinyin hoặc nghĩa…" value="' + esc(vs.q) + '" autocomplete="off">' +
        '<button class="vtoggle' + (vs.hide ? ' on' : '') + '" id="vhide"> Ẩn nghĩa (tự kiểm tra)</button>' +
        '<button class="btn" id="vrand"> Từ ngẫu nhiên</button>' +
        '<span class="v-count" id="vcount"></span>' +
      '</div>' +
      '<div class="vgrid' + (vs.hide ? ' hide' : '') + '" id="vgrid"></div>';

    var grid = q('#vgrid', c);
    function paint() {
      var list = [];
      D.vocab.forEach(function (v, i) { if (matches(v)) list.push([v, i]); });
      q('#vcount', c).textContent = list.length + '/' + D.vocab.length + ' từ';
      if (!list.length) { grid.innerHTML = '<div class="v-empty" style="grid-column:1/-1">Không có từ nào khớp </div>'; return; }
      grid.innerHTML = list.map(function (p) {
        var v = p[0], i = p[1], info = WD[v[0]];
        return '<div class="vcard" tabindex="0" role="button" data-i="' + i + '">' +
          '<span class="no">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<button class="spk" data-spk="' + i + '" title="Nghe">Nghe</button>' +
          '<div class="hz' + (v[0].length > 3 ? ' long' : '') + '">' + esc(v[0]) + '</div>' +
          '<div class="py">' + esc(v[1]) + '</div>' +
          '<div class="mean">' + esc(v[2]) + '</div>' +
          '<div class="tags">' + (info ? '<span class="tag gold">' + esc(info[0].split(' (')[0].split(' / ')[0]) + '</span>' : '') +
          (v[3] ? '<span class="tag" style="background:#e6efff;color:#27508f">Mở rộng</span>' : '') + '<span class="tag">' + uniqChars(v[0]).length + ' chữ</span></div></div>';
      }).join('');
    }
    paint();

    grid.onclick = function (e) {
      var s = e.target.closest('[data-spk]');
      if (s) { e.stopPropagation(); say(D.vocab[+s.getAttribute('data-spk')][0]); return; }
      var card = e.target.closest('.vcard'); if (card) openWord(+card.getAttribute('data-i'));
    };
    grid.onkeydown = function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('vcard')) { e.preventDefault(); openWord(+e.target.getAttribute('data-i')); }
    };
    q('#vq', c).oninput = function () { vs.q = this.value.trim(); paint(); };
    q('#vhide', c).onclick = function () { vs.hide = !vs.hide; this.classList.toggle('on', vs.hide); grid.classList.toggle('hide', vs.hide); };
    q('#vrand', c).onclick = function () { openWord(Math.floor(Math.random() * D.vocab.length)); };
    qa('.rad-chip', c).forEach(function (b) {
      b.onclick = function () { var g = b.getAttribute('data-rad'); vs.rad = vs.rad === g ? '' : g; window.renderVocab(c); };
    });
  };

  /* ---------- Header / hero / tab dùng chung ---------- */
  function polish() {
    if (typeof D === 'undefined') return;
    var brand = q('.brand');
    if (brand) brand.innerHTML = '<span class="catdot"></span><span class="brand-text"><b>' + esc(CFG.brand) + '</b><small>' + esc(CFG.className) + '</small></span>';
    var eb = q('.hero .eyebrow');
    if (eb) eb.innerHTML = '<span class="eb-class">' + esc(CFG.className) + '</span><span>Bài ' + D.lesson + '</span>';
    var hero = q('.hero');
    if (hero && !q('.lesson-no', hero)) {
      var n = document.createElement('div');
      n.className = 'lesson-no';
      n.innerHTML = '<small>Bài</small><b>' + D.lesson + '</b>';
      hero.appendChild(n);
    }
    var vc = q('#vocabCount'); if (vc) { var nExt = D.vocab.filter(function(x){return x[3]}).length; vc.textContent = ' ' + (D.vocab.length - nExt) + ' từ vựng' + (nExt ? ' + ' + nExt + ' mở rộng' : ''); }
    var gc = q('#grammarCount'); if (gc) gc.textContent = ' ' + D.grammar.length + ' điểm ngữ pháp';
    var dc = q('#dialogueCount'); if (dc) dc.textContent = ' ' + D.dialogues.length + ' hội thoại';
    var ft = q('.footer'); if (ft) ft.innerHTML = 'Học cùng <b>' + esc(CFG.brand) + '</b> · ' + esc(CFG.className) + '  vui quá là vui';
    if (typeof tabs !== 'undefined') {
      var label = { vocab: ' Từ vựng', grammar: ' Ngữ pháp', patterns: ' Mẫu câu', dialogues: ' Hội thoại', games: ' Game' };
      tabs.forEach(function (t) { if (label[t[0]]) t[1] = label[t[0]]; });
      if (typeof renderTabs === 'function') renderTabs();
      if (typeof render === 'function') render();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', polish);
  else polish();
})();

</script>

,{"cn":"过年","vi":"đón Tết"},{"cn":"没意思","vi":"nhàm chán"},{"cn":"位","vi":"vị (lượng từ lịch sự)"},{"cn":"前面","vi":"phía trước"},{"cn":"房子","vi":"căn nhà"},{"cn":"小孩儿","vi":"trẻ nhỏ"},{"cn":"女孩儿","vi":"bé gái"},{"cn":"姓","vi":"họ"},{"cn":"眼睛","vi":"mắt"},{"cn":"跳舞","vi":"nhảy múa"}],"sentencePractice":[{"answer":"你家楼下站着一个人","parts":["你家","楼下","站着","一个人"],"note":[]},{"answer":"你一个人在这儿多没意思啊","parts":["你","一个人","在这儿","多","没意思","啊"],"note":[]},{"answer":"我们一起去多好啊","parts":["我们","一起","去","多","好","啊"],"note":[]},{"answer":"她经常跑上来找我玩","parts":["她","经常","跑上来","找我","玩"],"note":[]}],"situationPractice":[{"answer":"爸爸手里拿着一杯咖啡","parts":["爸爸","手里","拿着","一杯咖啡"],"note":[]},{"answer":"这位是我的汉语老师","parts":["这位","是","我的","汉语老师"],"note":[]},{"answer":"楼不高我们走上去吧","parts":["楼不高","我们","走上去","吧"],"note":[]},{"answer":"我妹妹跳舞跳得很好","parts":["我妹妹","跳舞","跳得","很好"],"note":[]}]},"gameTitle":"Game: Đón Tết và gặp gỡ bạn bè","customGame":{"type":"reply","title":"⑥ Điền từ thích hợp","desc":"Chọn từ đúng điền vào chỗ trống.","items":[{"q":"你一个人在这儿多（　）啊！","o":["没意思","前面","眼睛","姓","跳舞"],"a":0},{"q":"我家楼下（　）着一个人。","o":["站","过年","位","房子","包"],"a":0},{"q":"请问，您贵（　）？","o":["姓","眼睛","小孩儿","前面","跳舞"],"a":0},{"q":"这（　）是我的汉语老师。","o":["位","包","房子","女孩儿","站"],"a":0},{"q":"她从小就学（　）了。","o":["跳舞","过年","姓","没意思","前面"],"a":0}]},"decor":["🧧","🏠","🎒","🧒","💃","🎊"],"specialEffect":""};
const D = DATA;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const state = {tab:'vocab',flash:0,mask:false};
const tabs = [['vocab','Từ mới'],['grammar','Ngữ pháp'],['patterns','Mẫu câu'],['dialogues','Hội thoại'],['games','Game']];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
let voices=[], currentVoice=null, femaleList=[], maleList=[];
/* Giọng đọc theo nhân vật trong giáo trình.
   g = nữ (F) hoặc nam (M); k = chọn giọng thứ mấy trong nhóm (để hai nhân vật cùng giới trong một hội thoại không trùng giọng);
   p = cao độ (trẻ em cao hơn, người lớn tuổi thấp hơn). 胡医生, 服务员, 售货员 giáo trình không ghi giới tính, tạm gán để hai vai tương phản. */
const CHAR_VOICE={
  '王一飞':{g:'F',k:0,p:1},
  '王一雪':{g:'F',k:1,p:.94},
  '白家月':{g:'F',k:1,p:1.08},
  '安妮':{g:'F',k:1,p:1.06},
  '刘小雪':{g:'F',k:1,p:1.28},
  '胡医生':{g:'F',k:0,p:.94},
  '售货员':{g:'F',k:1,p:.98},
  '陈天中':{g:'M',k:1,p:1.05},
  '李文':{g:'M',k:0,p:1},
  '刘明':{g:'M',k:0,p:.88},
  '刘小明':{g:'M',k:0,p:1.4},
  '杨同乐':{g:'M',k:1,p:1},
  '服务员':{g:'M',k:0,p:1},
  '白家月、安妮':{g:'F',k:1,p:1.06},
  '刘爷爷':{g:'M',k:1,p:.8},
  '刘奶奶':{g:'F',k:0,p:.85}
};
function spkProfile(sp,d){
  if(CHAR_VOICE[sp])return CHAR_VOICE[sp];
  const order=[...new Set(d.lines.map(l=>l[0]))].indexOf(sp);
  return {g:order%2?'M':'F',k:0,p:1};
}
function voiceGender(n){
  if(/Yunxi|Yunjian|Yunyang|Yunxia|Yunhao|Kangkang|Li-?mu/i.test(n))return 'M';
  if(/Xiaoxiao|Xiaoyi|Xiaobei|Xiaoni|Xiaohan|Xiaomeng|Xiaomo|Xiaoxuan|Xiaorui|Xiaoshuang|Huihui|Yaoyao|Ting-?ting|Mei-?jia|Yu-?shu|Lili|Google|普通话/i.test(n))return 'F';
  return '';
}
function loadVoices(){
  voices=speechSynthesis.getVoices().filter(v=>/^zh[-_]CN/i.test(v.lang)||/Mandarin|普通话|Putonghua/i.test(v.name));
  const rank=v=>{const n=v.name;let s=0;
    if(/Xiaoxiao/i.test(n))s+=100;else if(/Yunxi/i.test(n))s+=100;
    else if(/Xiaoyi|Yunjian|Yunyang|Yunxia/i.test(n))s+=90;
    if(/Natural|Online/i.test(n))s+=60;
    if(/Google/i.test(n))s+=50;
    if(/Premium|Enhanced|Siri/i.test(n))s+=40;
    if(/Tingting|Ting-Ting|Meijia/i.test(n))s+=20;
    if(!v.localService)s+=5;
    if(/Kangkang|Yaoyao|Huihui|Lili/i.test(n))s-=30;
    return s};
  voices.sort((a,b)=>rank(b)-rank(a));
  femaleList=voices.filter(v=>voiceGender(v.name)==='F');
  if(!femaleList.length)femaleList=voices.filter(v=>voiceGender(v.name)==='');
  maleList=voices.filter(v=>voiceGender(v.name)==='M');
  currentVoice=femaleList[0]||voices[0]||null;
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,150)}
function stopAudio(){
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(window._dlgAudio){try{window._dlgAudio.pause()}catch(e){}window._dlgAudio=null}
}
function makeUtter(text,prof,rate){
  prof=prof||{g:'F',k:0,p:1};
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=rate;
  let v=null,pitch=prof.p;
  if(prof.g==='M'){
    if(maleList.length)v=maleList[prof.k%maleList.length];
    else{v=currentVoice;pitch=Math.max(.5,prof.p*.75)}
  }else{
    v=femaleList.length?femaleList[prof.k%femaleList.length]:currentVoice;
  }
  if(v)u.voice=v;
  u.pitch=pitch;
  return u;
}
function speak(text,rate=.88,prof){
  if(!('speechSynthesis' in window)){toast('Meow chưa đọc được trên trình duyệt này, bạn thử Chrome giúp Meow nha');return}
  stopAudio();
  speechSynthesis.speak(makeUtter(text,prof,rate));
}
/* Nghe cả đoạn: ưu tiên file mp3 cùng thư mục (hsk2_bai1_hoithoai1.mp3, hsk2_bai1_hoithoai2.mp3, ...).
   Chưa có file thì tự đọc bằng giọng trình duyệt, mỗi nhân vật một giọng. */
function speakDialogue(d){
  stopAudio();
  const di=D.dialogues.indexOf(d);
  const src=`hsk2_bai${D.lesson}_hoithoai${di+1}.mp3`;
  const tts=()=>{
    if(!('speechSynthesis' in window)){toast('Meow chưa đọc được trên trình duyệt này, bạn thử Chrome giúp Meow nha');return}
    let i=0;
    const next=()=>{
      if(i>=d.lines.length)return;
      const ln=d.lines[i];
      const u=makeUtter(ln[1],spkProfile(ln[0],d),.85);
      u.onend=()=>{i++;setTimeout(next,450)};
      speechSynthesis.speak(u);
    };
    next();
  };
  let fell=false;
  const fb=()=>{if(fell)return;fell=true;window._dlgAudio=null;tts()};
  try{
    const a=new Audio(src);window._dlgAudio=a;
    a.addEventListener('error',fb);
    const p=a.play();if(p&&p.catch)p.catch(fb);
  }catch(e){fb()}
}
function initDecor(){
  const layer=$('#stickers');
  layer.innerHTML=D.decor.map((x,i)=>`<div class="sticker s${i+1}" style="--rot:${[-10,8,-7,10,-5,7][i]}deg">${x}</div>`).join('');
  if(D.specialEffect==='snow'){document.body.classList.add('snowing');const snow=$('#snow');for(let i=0;i<36;i++){const f=document.createElement('div');f.className='flake';f.textContent='';f.style.left=(Math.random()*100)+'%';f.style.animationDuration=(6+Math.random()*7)+'s';f.style.animationDelay=(Math.random()*6)+'s';f.style.fontSize=(10+Math.random()*14)+'px';snow.appendChild(f)}}
}
function init(){

function renderGrammar(c){
  const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const zh=s=>s.replace(/[㐀-鿿]+(?:[，。！？、：；…“”（）][㐀-鿿]+)*/g,m=>'<span class="zh">'+m+'</span>');
  const rich=t=>zh(E(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'));
  const paras=t=>{const out=[];let ul=[];String(t).split('\n').forEach(l=>{if(/^•/.test(l)){ul.push('<li>'+rich(l.replace(/^•\s*/,''))+'</li>')}else{if(ul.length){out.push('<ul>'+ul.join('')+'</ul>');ul=[]}if(l.trim())out.push('<p>'+rich(l)+'</p>')}});if(ul.length)out.push('<ul>'+ul.join('')+'</ul>');return out.join('')};
  const say=[];
  const exRows=list=>list.map(e=>{const k=say.push(e[0].replace(/\[\[|\]\]/g,''))-1;return `<div class="ex"><div><div class="ecn">${E(e[0]).replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>')}</div><div class="epy">${E(e[1])}</div><div class="evi">${E(e[2])}</div></div><button class="iconbtn" data-gsay="${k}">Nghe</button></div>`}).join('');

  c.innerHTML=intro('Điểm ngữ pháp','Mỗi điểm gồm: giải thích, cấu trúc, ví dụ có pinyin và nghĩa, lỗi hay gặp, và phần ngữ pháp nâng cao (bấm để mở).')+chips
  +D.grammar.map((g,i)=>`<article class="gp" id="gp${i}">
    <header class="gp-head"><div class="gp-no">${i+1}</div><div><h3>${rich(g.name)}</h3><div class="gp-tag">${E(g.tag||'')}</div></div></header>
    <div class="gp-body">
      <section class="gp-sec"><h4>Giải thích</h4><div class="gp-desc">${paras(g.desc)}</div></section>
      <section class="gp-sec"><h4>Cấu trúc</h4>${(g.forms||[]).map(f=>`<div class="gp-form"><div class="k">${E(f[0])}</div><div class="v">${rich(f[1])}</div></div>`).join('')}</section>
      <section class="gp-sec"><h4>Ví dụ</h4>${exRows(g.ex||[])}</section>
      ${g.compare?`<section class="gp-sec"><h4>${E(g.compare.title)}</h4><table class="gp-table"><thead><tr>${g.compare.head.map(h=>`<th>${rich(h)}</th>`).join('')}</tr></thead><tbody>${g.compare.rows.map(r=>`<tr><th>${E(r[0])}</th>${r.slice(1).map(x=>`<td>${rich(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></section>`:''}
      ${(g.notes&&g.notes.length)?`<section class="gp-sec"><h4>Lưu ý</h4><ul class="gp-notes">${g.notes.map(n=>`<li>${rich(n)}</li>`).join('')}</ul></section>`:''}
      ${(g.mistakes&&g.mistakes.length)?`<section class="gp-sec"><h4>Lỗi hay gặp</h4>${g.mistakes.map(m=>`<div class="gp-mist"><div class="bad"><span class="lab">Sai</span><span class="zh">${E(m[0])}</span></div><div class="good"><span class="lab">Đúng</span><span class="zh">${E(m[1])}</span></div><div class="why">${rich(m[2])}</div></div>`).join('')}</section>`:''}
      ${(g.adv&&g.adv.length)?`<details class="gp-adv"><summary>Ngữ pháp nâng cao<small>${g.adv.length} mục · bấm để mở</small></summary><div class="gp-adv-body">${g.adv.map(a=>`<div class="gp-adv-item"><h5>${rich(a.t)}</h5><p>${rich(a.d)}</p>${exRows(a.ex||[])}</div>`).join('')}</div></details>`:''}
    </div></article>`).join('');
  $$('[data-gsay]').forEach(b=>b.onclick=()=>speak(say[+b.dataset.gsay],.85));
  $$('[data-gj]').forEach(b=>b.onclick=()=>{const t=document.getElementById('gp'+b.dataset.gj);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});
}

function noteHTML(q){
  if(!q.note || !q.note.length) return '';
  return `<div class="vocab-note"><b> Ghi chú từ bổ sung:</b> ${q.note.map(x=>`<span><b>${x[0]}</b> · ${x[1]} · ${x[2]}</span>`).join('')}</div>`;
}
function bindOrderSet(box,cardClass){
  box.querySelectorAll('.'+cardClass).forEach(card=>{
    const bank=card.querySelector('.order-bank'),ans=card.querySelector('.order-answer');
    bank.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      if(ch.classList.contains('used'))return;
      ch.classList.add('used');
      const x=ch.cloneNode(true);x.classList.remove('used');
      x.onclick=()=>{
        const original=bank.querySelector(`[data-src="${x.dataset.src}"]`);
        if(original) original.classList.remove('used');
        x.remove();
      };
      ans.appendChild(x);
    });
  });
}
function gradeOrderSet(box,qs,selector,scoreId){
  let s=0;
  qs.forEach((q,i)=>{
    const card=box.querySelector(`${selector}[data-idx="${i}"]`);
    const txt=[...card.querySelectorAll('.order-answer .chip')].map(x=>x.textContent).join('');
    const ok=normalize(txt)===normalize(q.answer);
    if(ok)s++;
    card.querySelector('.feedback').innerHTML=ok
      ? '<span class="goodtxt">Bạn làm đúng rồi, giỏi quá iii</span>'
      : `<span class="badtxt">Làm lại giúp Meow nha. Đáp án: ${q.answer}</span>`;
  });
  $(scoreId).innerHTML=`<span class="score">${s}/${qs.length} đúng · ${Math.round(s/qs.length*100)}/100</span>`;
}

    const table=`<table class="schedule-table"><tr><th>时间</th><th>地方</th><th>活动</th></tr>${G.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;renderChoiceSet(G.items,(_,i)=>i===0?table:'');
  } else if(G.type==='phone'){
    body.innerHTML=G.items.map((q,i)=>`<div class="qcard"><div class="qtitle">${i+1}. Nghe và nhập số điện thoại</div><button class="btn primary" data-phone="${i}">Nghe số</button><input class="inputq" id="phone-${i}" inputmode="numeric" placeholder="Nhập dãy số"><div class="feedback" id="pf-${i}"></div></div>`).join('')+`<button class="btn primary" id="gradeCustom">Chấm game chủ đề</button>`;
    body.querySelectorAll('[data-phone]').forEach(b=>b.onclick=()=>speak(G.items[+b.dataset.phone].speech,.66));
    $('#gradeCustom').onclick=()=>{let s=0;G.items.forEach((q,i)=>{const v=$(`#phone-${i}`).value.replace(/\D/g,''),ok=v===q.answer;if(ok)s++;$(`#pf-${i}`).innerHTML=ok?'<span class="goodtxt">Bạn làm đúng rồi, giỏi quá iii</span>':`<span class="badtxt">Làm lại giúp Meow nha. Đáp án: ${q.answer}</span>`});$('#customScore').innerHTML=`<span class="score">${s}/${G.items.length} đúng · ${Math.round(s/G.items.length*100)}/100</span>`}
  } else if(G.type==='time'||G.type==='weather'){
    renderChoiceSet(G.items,null,true);
  } else if(G.type==='restaurant'){
    let current=0,selected=new Set();
    const renderOrder=()=>{const q=G.orders[current];body.innerHTML=`<div class="qcard"><div class="qtitle">Đơn ${current+1}/${G.orders.length}</div><button class="btn primary" id="hearOrder">Nghe khách gọi món</button><div class="menu-grid">${q.choices.map(x=>`<button class="menu-item" data-food="${x}">${x}</button>`).join('')}</div><div class="feedback" id="foodFb"></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="checkOrder">Kiểm tra đơn</button></div></div>`;$('#hearOrder').onclick=()=>speak(q.speech,.78);selected=new Set();body.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{const x=b.dataset.food;if(selected.has(x)){selected.delete(x);b.classList.remove('selected')}else{selected.add(x);b.classList.add('selected')}});$('#checkOrder').onclick=()=>{const want=[...q.want].sort().join('|'),got=[...selected].sort().join('|'),ok=want===got;$('#foodFb').innerHTML=ok?'<span class="goodtxt">Bạn làm đúng rồi, giỏi quá iii</span>':`<span class="badtxt">Làm lại giúp Meow nha. Cần chọn: ${q.want.join(' + ')}</span>`;if(ok){setTimeout(()=>{current++;if(current<G.orders.length)renderOrder();else $('#customScore').innerHTML='<span class="score">Giỏi quá iii, Meow chấm 100/100 </span>'},500)}}};renderOrder();
  } else if(G.type==='timeline'||G.type==='airport'){
    const steps=G.steps;body.innerHTML=`<div class="drag-wrap"><div><b>Các chặng:</b><div class="drag-bank" id="dragBank">${shuffle(steps).map(x=>`<button class="drag-chip" draggable="true" data-step="${x}">${x}</button>`).join('')}</div></div><div><b>Thứ tự của bạn:</b><div class="drag-slots" id="dragSlots">${steps.map((_,i)=>`<div class="drop-slot" data-slot="${i}">${i+1}</div>`).join('')}</div></div><div class="feedback" id="dragFb"></div><div class="actions"><button class="btn" id="clearDrag">Làm lại</button><button class="btn primary" id="gradeCustom">Chấm game chủ đề</button></div></div>`;
    let selectedChip=null;const chips=body.querySelectorAll('.drag-chip'),slots=body.querySelectorAll('.drop-slot');
    function place(chip,slot){if(!chip||!slot)return;const old=body.querySelector(`.drop-slot[data-value="${chip.dataset.step}"]`);if(old){old.textContent=Number(old.dataset.slot)+1;old.classList.remove('filled');delete old.dataset.value}if(slot.dataset.value){const prev=body.querySelector(`.drag-chip[data-step="${slot.dataset.value}"]`);if(prev)prev.classList.remove('used')}slot.dataset.value=chip.dataset.step;slot.textContent=chip.dataset.step;slot.classList.add('filled');chip.classList.add('used');chips.forEach(x=>x.classList.remove('selected'));selectedChip=null}
    chips.forEach(ch=>{ch.ondragstart=e=>{e.dataTransfer.setData('text/plain',ch.dataset.step)};ch.onclick=()=>{chips.forEach(x=>x.classList.remove('selected'));selectedChip=ch;ch.classList.add('selected')}});slots.forEach(sl=>{sl.ondragover=e=>e.preventDefault();sl.ondrop=e=>{e.preventDefault();const val=e.dataTransfer.getData('text/plain');place(body.querySelector(`.drag-chip[data-step="${val}"]`),sl)};sl.onclick=()=>{if(selectedChip)place(selectedChip,sl)}});
    $('#clearDrag').onclick=()=>{slots.forEach(sl=>{sl.textContent=Number(sl.dataset.slot)+1;sl.classList.remove('filled');delete sl.dataset.value});chips.forEach(ch=>ch.classList.remove('used','selected'));selectedChip=null;$('#dragFb').textContent=''};
    $('#gradeCustom').onclick=()=>{const got=[...slots].map(sl=>sl.dataset.value||'');const ok=got.join('|')===steps.join('|');$('#dragFb').innerHTML=ok?'<span class="goodtxt">Bạn làm đúng rồi, giỏi quá iii</span>':`<span class="badtxt">Làm lại giúp Meow nha. Đáp án: ${steps.join(' → ')}</span>`;$('#customScore').innerHTML=`<span class="score">${ok?'100/100':'Chưa đạt'}</span>`}
  }
}

init();
</script>
<script>
(function(){
  const boot=()=>{
    if(window.MeowTracking){
      MeowTracking.openLesson('hsk2', 14);
      MeowTracking.startAutoScoreTracking('hsk2', 14);
    }
  };
  if(window.meowUser && window.MeowTracking) boot();
  else window.addEventListener('meow-auth-ready',boot,{once:true});
})();
</script>

</body></html>
