  <script>
    window.MEOW_MOCK_TESTS={"1":{"id":"GREEN_HSK4_01_V8","title":"Meow Meow HSK4 · Đề 1","audio":"hsk4-de1-audio.mp3","questions":[{"n":1,"type":"tf","text":"这种裙子没有黑色的了。","answer":"×","transcript":"我给妹妹买了件黑色的裙子，可是妹妹不喜欢，觉得颜色太深了。我去商店想换一件别的颜色的，可售货员说这种裙子只剩下黑色的了。\n★ 这种裙子没有黑色的了。"},{"n":2,"type":"tf","text":"“我”不反对姐姐交男朋友。","answer":"√","transcript":"姐姐春节回家，带回来一个比她大十多岁的男朋友。因为年龄差得太大，父母不同意，但我支持我姐姐。\n★ “我”不反对姐姐交男朋友。"},{"n":3,"type":"tf","text":"他今天下午要上历史课。","answer":"√","transcript":"小王，你看这样行不行，明天上午十点我去找你。今天下午我有历史课。\n★ 他今天下午要上历史课。"},{"n":4,"type":"tf","text":"爸爸每天开车上下班。","answer":"×","transcript":"爸爸每天都坐地铁上下班，从来不开车，虽然会有一些不方便，但是不会堵车，这样更省时间。\n★ 爸爸每天开车上下班。"},{"n":5,"type":"tf","text":"学校要求他暑假去参加学习班。","answer":"×","transcript":"寒假的时候，为了提高我的学习成绩，妈妈给我报名参加了一个学习班，我不愿意去，因为这样就没有时间做自己的事了。\n★ 学校要求他寒假去参加学习班。"},{"n":6,"type":"tf","text":"现在的年轻人越来越不健康了。","answer":"√","transcript":"现在的年轻人每天睡得晚，起床得也晚，整天坐在电脑前，运动越来越少，身体越来越胖，健康离他们越来越远了。\n★ 现在的年轻人越来越不健康了。"},{"n":7,"type":"tf","text":"爸爸是公司职员。","answer":"×","transcript":"我爸爸开了一家公司，每天辛辛苦苦从早忙到晚，特别是最近，生意多得忙不过来，妈妈决定去帮他。\n★ 爸爸是公司职员。"},{"n":8,"type":"tf","text":"在休息室可以抽烟。","answer":"√","transcript":"先生，这儿禁止抽烟，您可以去那边的休息室。\n★ 在休息室可以抽烟。"},{"n":9,"type":"tf","text":"“我”要给爷爷买一个蛋糕。","answer":"×","transcript":"爷爷明天过生日，爸爸说他买酒，妈妈说她要做好吃的饭菜，哥哥说他要买蛋糕，我还没想好给爷爷什么礼物呢。\n★ “我”要给爷爷买一个蛋糕。"},{"n":10,"type":"tf","text":"妈妈不满意小明的成绩。","answer":"√","transcript":"这次数学考试小明考了60分，妈妈很生气，让他努力学习，下次一定要超过90分，否则就不让他看电视了。\n★ 妈妈不满意小明的成绩。"},{"n":11,"type":"mcq","options":["律师","医生","导游","科学家"],"answer":"A","transcript":"男：我的理想是当一名医生，你的理想是什么？\n女：我小时候希望当一名科学家，可是现在我想成为一名律师。\n问：女的现在的理想是做什么？"},{"n":12,"type":"mcq","options":["颜色不好看","样子不适合","太贵了","不喜欢这双鞋"],"answer":"C","transcript":"男：这双鞋的颜色和样子都非常适合你，别再选来选去的了，就买这双吧。\n女：嗯，这双确实不错，可是价格有点儿……，我再看看吧。\n问：女的为什么没买这双鞋？"},{"n":13,"type":"mcq","options":["饭馆","公司","家里","教室"],"answer":"B","transcript":"男：小张，下午会议上要用的材料准备好了吗？那可是很重要的。\n女：准备好了，您就放心吧。\n问：这段对话最可能发生在哪儿？"},{"n":14,"type":"mcq","options":["春天","夏天","秋天","冬天"],"answer":"C","transcript":"女：你们这里一年四季来旅游的人都这么多啊？\n男：我们这儿秋天的景色最美，其他三个季节人没有这么多。\n问：现在哪个季节？"},{"n":15,"type":"mcq","options":["女的很粗心","男的很生气","女的被批评了","男的做错了"],"answer":"D","transcript":"男：抱歉抱歉，是我太粗心了，不是他的错。\n女：那他也不应该是这样的态度啊！\n问：根据对话可以知道什么？"},{"n":16,"type":"mcq","options":["付款","存钱","取钱","收款"],"answer":"A","transcript":"女：请问，您用现金还是用信用卡啊？\n男：用信用卡吧……哎呀，不好意思，我忘带了，还是现金吧。\n问：男的在做什么？"},{"n":17,"type":"mcq","options":["很负责","不诚实","有礼貌","很认真"],"answer":"C","transcript":"男：你觉得我们公司新来的小丽怎么样？\n女：挺好的呀，很诚实，懂礼貌，又努力，就是有时候有点儿小马虎。\n问：女的认为小丽这个人怎么样？"},{"n":18,"type":"mcq","options":["7690","6790","6097","6709"],"answer":"B","transcript":"女：喂，王明，你知道李老师的电话号码吗？我找她有点儿事儿。\n男：知道，前几天我还给王老师打电话了呢。你记一下吧，138-8888-6790。\n问：王老师的电话号码最后四位是多少？"},{"n":19,"type":"mcq","options":["买车","找工作","租房子","买房子"],"answer":"C","transcript":"女：你找到工作了吗？\n男：工作是找到了，这几天正忙着在附近找房子呢，现在租个合适的房子太难了。\n问：男的这几天在忙什么？"},{"n":20,"type":"mcq","options":["坐火车","坐汽车","坐飞机","坐出租车"],"answer":"A","transcript":"女：我下个月要去北京出差，听说机票不太好买呢。\n男：那就坐火车吧，尤其是高铁，速度快，又舒服，多好！\n问：男的建议女的怎么去北京？"},{"n":21,"type":"mcq","options":["学生","老师","经理","服务员"],"answer":"B","transcript":"女：您的孩子最近总是不按时完成作业，希望你们下班后多关心关心孩子。\n男：好的，我回去后一定按照您说的去做，真是辛苦您了。\n问：女的可能是做什么工作的？"},{"n":22,"type":"mcq","options":["不爱学习","学习习惯很好","年龄很小","成绩一般"],"answer":"B","transcript":"男：王小明同学真是太聪明了，每次考试都考全校第一。\n女：是啊，他从小就养成了按时完成作业、课前预习和课后复习的好习惯，成绩当然好了。\n问：关于王小明，可以知道什么？"},{"n":23,"type":"mcq","options":["生病了","车坏了","起来晚了","堵车了"],"answer":"D","transcript":"女：喂，王经理，现在有点儿堵车，我可能晚十分钟到，真不好意思。\n男：哦，没关系，你直接到305房间吧，我们就在那里等你。\n问：女的为什么迟到了？"},{"n":24,"type":"mcq","options":["不用工作","睡得太少","太累了","时间还早"],"answer":"A","transcript":"女：都十点了，快点儿起床吧。是不是昨晚睡得太晚了？\n男：不是礼拜天吗，又不用上班，再让我睡会儿吧。\n问：男的为什么还不起床？"},{"n":25,"type":"mcq","options":["买东西","看新闻","玩游戏","看电影"],"answer":"A","transcript":"男：别总玩儿游戏，长时间看电脑对眼睛不好。\n女：我不是在玩儿游戏，是在网上购物呢，买完这个包我就下来。\n问：女的在做什么？"},{"n":26,"type":"mcq","options":["堵车了","有些不高兴","没参加表演","不能开车"],"answer":"B","transcript":"女：你怎么现在才来呀？\n男：没办法，路上堵车。\n女：知道会堵车，怎么不提前一点儿出发啊？\n男：一般这个时间不堵车啊，不知道今天是怎么了。\n女：别说了，快进去吧，表演马上就要开始了。\n问：女的怎么了？"},{"n":27,"type":"mcq","options":["等着应聘","准备工作","看电影","喝咖啡"],"answer":"A","transcript":"男：放松一点儿，你不要这么紧张嘛。\n女：这是我第一次参加应聘，我很想进这家公司。\n男：我相信你一定会顺利通过的。\n女：可是我还是紧张啊……什么时候能到我啊？\n男：你看你，先坐一下，喝杯咖啡，还有好几位呢。\n问：女的现在在做什么？"},{"n":28,"type":"mcq","options":["没有时间去","眼镜太旧了","不用换眼镜","眼镜不好看"],"answer":"C","transcript":"女：你下午有时间吗？我想去一趟眼镜店。\n男：眼镜怎么了，坏了还是看不清楚了？\n女：不是，我想换个好看的。\n男：你现在的眼镜就很好看啊。\n女：不好看，太旧，已经不流行了。\n问：男的是什么意思？"},{"n":29,"type":"mcq","options":["明天","今晚","不知道","现在"],"answer":"C","transcript":"女：我的电脑坏了，你能帮我看看是怎么回事吗？\n男：行，放这儿吧。我给你看看。\n女：我急着用，请问明天能不能修好？\n男：那可不好说，得看看是什么问题。你先留个电话吧，我检查以后告诉你。\n女：好的，谢谢师傅啊。\n问：电脑什么时候能修好？"},{"n":30,"type":"mcq","options":["女的很忙","女的定时间","男的写了文章","男的是老师"],"answer":"D","transcript":"男：小王啊，我这几天实在太忙了，才给你回电话。\n女：没关系，张教授，我只是想问问，您收到我发的邮件了吗？\n男：收到了，咱们约个时间谈谈你的文章怎么修改吧。\n女：我什么时候都行，您定时间吧。\n问：根据对话，可以知道什么？"},{"n":31,"type":"mcq","options":["开会","带东西","去上海","做工作"],"answer":"B","transcript":"女：听说你明天要去上海开会？\n男：是啊，要去一个星期呢。\n女：我叔叔在上海工作，你能帮我给他带点儿东西吗？\n男：当然可以，不过你最好今天下午把东西给我，明天上午我恐怕没有时间。\n女：好，我一会儿就把东西送过来。\n问：女的让男的帮她干什么？"},{"n":32,"type":"mcq","options":["商店","机场","银行","教室"],"answer":"D","transcript":"女：王明，刚才讲的语法你听明白了吗？\n男：听明白了，其实一点儿也不难。\n女：下课后也要常常练习、复习，否则很快就忘了。\n男：嗯，放心吧，我每天都会用一定的时间复习的。\n问：他们可能在哪儿？"},{"n":33,"type":"mcq","options":["借书","送手机","看比赛","打电话"],"answer":"A","transcript":"男：你昨天晚上去看比赛了吗？\n女：没有，我跟同学去图书馆借书了。\n男：我说给你打电话你怎么没接呢。\n女：我没带手机，放在房间里了。\n问：女的昨晚干什么去了？"},{"n":34,"type":"mcq","options":["不爬山了","不希望下雨","不想爬山","以后去爬山"],"answer":"B","transcript":"女：听说明天有雨。\n男：是吗？我们明天还想去爬山呢。\n女：那你们最好还是换个时间再去。\n男：我倒希望能换个时间下雨。\n问：男的是什么意思？"},{"n":35,"type":"mcq","options":["孩子要听话","怎么解决问题","男的爱发脾气","怎样教育孩子"],"answer":"D","transcript":"女：你怎么又跟孩子发脾气了？这可解决不了问题。\n男：我也知道，但是一看到他不听话，火儿就来了。\n女：教育孩子最需要的就是耐心了。\n男：这也是我最缺少的。\n问：他们在谈什么？"},{"n":36,"type":"mcq","options":["质量好","可以交朋友","价格便宜","能用信用卡"],"answer":"C","transcript":"现在越来越多的人喜欢在网上购物，因为在网上买东西不仅省时，而且省钱，吃的、喝的、玩儿的、穿的，什么东西都可以在网上买到。我认为除了男朋友以外，几乎所有的东西都能在网上买到。\n问：人们为什么喜欢在网上买东西？"},{"n":37,"type":"mcq","options":["穿的","玩的","喝的","男朋友"],"answer":"D","transcript":"现在越来越多的人喜欢在网上购     const examData = window.MEOW_MOCK_TESTS["1"];
    const userAnswers = {};

    function initExam() {
      if (!examData) return;

      document.getElementById('examTitle').textContent = examData.title;

      const audioEl = document.getElementById('examAudio');
      if (examData.audio) {
        audioEl.src = examData.audio;
      }

      const qContainer = document.getElementById('questions');
      const navContainer = document.getElementById('questionNav');
      
      let qHtml = '';
      let navHtml = '<div class="nums">';

      examData.questions.forEach((q) => {
        qHtml += `<div class="question" id="q-${q.n}">`;
        qHtml += `<div class="qhead">Câu ${q.n}</div>`;
        
        if (q.text) {
          qHtml += `<div class="qtext">${q.text}</div>`;
        }

        if (q.type === 'tf') {
          qHtml += `<div class="options tf">
            <button class="opt" onclick="selectOpt(${q.n}, '√')"><span class="tf-symbol">√</span> Đúng</button>
            <button class="opt" onclick="selectOpt(${q.n}, '×')"><span class="tf-symbol">×</span> Sai</button>
          </div>`;
        } else if (q.type === 'mcq' && q.options) {
          const labels = ['A', 'B', 'C', 'D'];
          qHtml += `<div class="options">`;
          q.options.forEach((optText, idx) => {
            const label = labels[idx];
            qHtml += `<button class="opt" onclick="selectOpt(${q.n}, '${label}')"><b>${label}.</b> ${optText}</button>`;
          });
          qHtml += `</div>`;
        }
        
        qHtml += `</div>`;

        navHtml += `<button class="num" id="nav-${q.n}" onclick="scrollToQ(${q.n})">${q.n}</button>`;
      });

      navHtml += '</div>';

      qContainer.innerHTML = qHtml;
      navContainer.innerHTML = navHtml;
      document.getElementById('progressText').textContent = `0/${examData.questions.length}`;
    }

    function selectOpt(qNum, answer) {
      userAnswers[qNum] = answer;
      
      const qBox = document.getElementById(`q-${qNum}`);
      const opts = qBox.querySelectorAll('.opt');
      opts.forEach(btn => {
        if (btn.textContent.includes(answer)) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });

      const navBtn = document.getElementById(`nav-${qNum}`);
      if (navBtn) navBtn.classList.add('answered');

      const answeredCount = Object.keys(userAnswers).length;
      document.getElementById('progressText').textContent = `${answeredCount}/${examData.questions.length}`;
    }

    function scrollToQ(qNum) {
      const el = document.getElementById(`q-${qNum}`);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initExam();
    });

    /* Tra từ điển */
    let dictionary = null;
    let dictLoaded = false;

    async function loadDictionary() {
      if (dictLoaded) return true;
      try {
        const res = await fetch("CVDICT.json");
        const data = await res.json();
        dictionary = {};
        data.forEach(item => {
          dictionary[item.traditional] = item;
          if (item.simplified !== item.traditional) {
            dictionary[item.simplified] = item;
          }
        });
        dictLoaded = true;
        return true;
      } catch (err) {
        return false;
      }
    }

    function showDictPopup(word, x, y) {
      const popup = document.getElementById("dict-popup");
      const entry = dictionary && dictionary[word];

      if (!entry) {
        document.getElementById("dict-word").textContent = word;
        document.getElementById("dict-pinyin").textContent = "";
        document.getElementById("dict-meanings").innerHTML = "<li>Không tìm thấy từ này</li>";
      } else {
        document.getElementById("dict-word").textContent = entry.traditional + (entry.simplified !== entry.traditional ? ` (${entry.simplified})` : "");
        document.getElementById("dict-pinyin").textContent = entry.pinyin;
        const ul = document.getElementById("dict-meanings");
        ul.innerHTML = "";
        (entry.meanings || []).forEach(m => {
          const li = document.createElement("li");
          li.textContent = m;
          ul.appendChild(li);
        });
      }

      popup.style.display = "block";
      popup.style.left = Math.min(x + 12, window.innerWidth - 320) + "px";
      popup.style.top = (y + 12) + "px";
    }

    function hideDictPopup() {
      document.getElementById("dict-popup").style.display = "none";
    }

    async function enableDictionaryLookup() {
      const ok = await loadDictionary();
      if (!ok) return;

      document.addEventListener("mouseup", handleDictSelection);
    }

    function handleDictSelection(e) {
      setTimeout(() => {
        const selection = window.getSelection();
        const text = selection ? selection.toString().trim() : "";
        if (!text || !/[\u4e00-\u9fff]/.test(text)) return;
        showDictPopup(text, e.pageX, e.pageY);
      }, 10);
    }

    document.addEventListener("click", function(e) {
      if (!e.target.closest("#dict-popup")) {
        hideDictPopup();
      }
    });

    enableDictionaryLookup();
  </script>
