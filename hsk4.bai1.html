<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简单的爱情 · Ôn tập HSK4 — Bài 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF5EE;
    --paper:#FFFFFF;
    --maroon:#7A2438;
    --maroon-dark:#4F1622;
    --maroon-soft:#9C4157;
    --pink:#F4D9DE;
    --pink-deep:#E9B7C2;
    --gold:#AD7A2C;
    --ink:#2E2320;
    --ink-soft:#6B5B54;
    --green:#3E7A4E;
    --green-bg:#E7F3E9;
    --red:#B23A32;
    --red-bg:#FBEAE8;
    --line:#E7DACB;
    --radius:16px;
    --shadow: 0 10px 30px -12px rgba(79,22,34,0.25);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Be Vietnam Pro', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .hanzi{font-family:'Noto Serif SC','Noto Sans SC',serif;}
  .filmstrip{
    height:14px;
    background:
      repeating-linear-gradient(90deg, var(--maroon-dark) 0 10px, transparent 10px 22px);
    background-color:var(--maroon);
    position:relative;
  }
  .filmstrip::before,.filmstrip::after{
    content:"";
    position:absolute; top:3px; height:8px; width:100%;
    background-image: repeating-linear-gradient(90deg, var(--bg) 0 6px, transparent 6px 22px);
  }
  .filmstrip::after{ top:auto; bottom:3px; }

  header.hero{
    background: radial-gradient(120% 160% at 15% 0%, var(--maroon-soft) 0%, var(--maroon) 45%, var(--maroon-dark) 100%);
    color:#fff;
    padding: 46px 20px 34px;
    text-align:center;
    position:relative;
  }
  header.hero .eyebrow{
    letter-spacing:.22em; text-transform:uppercase; font-size:12px; font-weight:600;
    color:var(--pink-deep); margin-bottom:10px;
  }
  header.hero .nav-link{
    position:absolute; top:18px; right:22px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.4);
    padding:6px 14px; border-radius:999px; font-size:13px; color:#fff; text-decoration:none;
  }
  header.hero .nav-link:hover{ background:rgba(255,255,255,.24); }
  header.hero h1{
    font-family:'Noto Serif SC',serif;
    font-weight:900; font-size:clamp(34px,6vw,54px);
    margin: 4px 0 8px;
    text-shadow:0 2px 18px rgba(0,0,0,.25);
  }
  header.hero p.sub{
    font-size:17px; color:#F6E4E8; max-width:640px; margin:0 auto; opacity:.95;
  }
  header.hero .badges{
    margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }
  header.hero .badges span{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.35);
    padding:6px 14px; border-radius:999px; font-size:13px;
  }

  nav.tabs{
    position:sticky; top:0; z-index:50;
    background:rgba(251,245,238,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .tabs-inner{
    max-width:1080px; margin:0 auto;
    display:flex; gap:6px; overflow-x:auto; padding:10px 14px;
    scrollbar-width:thin;
  }
  .tab-btn{
    flex:0 0 auto;
    border:none; background:transparent; cursor:pointer;
    padding:10px 16px; border-radius:999px; font-weight:600; font-size:14.5px;
    color:var(--ink-soft); white-space:nowrap;
    transition:.18s;
  }
  .tab-btn:hover{ background:var(--pink); color:var(--maroon-dark); }
  .tab-btn.active{ background:var(--maroon); color:#fff; }

  main{ max-width:1080px; margin:0 auto; padding: 28px 16px 80px; }
  .panel{ display:none; animation:fade .35s ease; }
  .panel.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .lesson-head{
    display:flex; align-items:center; gap:16px; margin-bottom:22px;
  }
  .seal{
    flex:0 0 auto; width:58px; height:58px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--maroon-soft), var(--maroon-dark));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif SC',serif; font-weight:900; font-size:22px;
    box-shadow: 0 6px 14px -4px rgba(79,22,34,.5), inset 0 0 0 3px rgba(255,255,255,.18);
    border:2px solid var(--gold);
  }
  .lesson-head h2{
    margin:0; font-family:'Noto Serif SC',serif; font-size:26px; color:var(--maroon-dark);
  }
  .lesson-head p{ margin:2px 0 0; color:var(--ink-soft); font-size:14.5px; }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:22px; box-shadow:var(--shadow);
  }
  .card h3{
    margin:0 0 14px; font-size:18px; color:var(--maroon-dark);
    display:flex; align-items:center; gap:8px;
  }
  .card h3 .dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); display:inline-block;}

  details.dialogue{
    background:var(--pink); border-radius:12px; padding:4px 16px; margin-bottom:22px;
    border:1px solid var(--pink-deep);
  }
  details.dialogue summary{ cursor:pointer; padding:12px 0; font-weight:700; color:var(--maroon-dark); }
  details.dialogue pre{
    white-space:pre-wrap; font-family:'Noto Sans SC','Be Vietnam Pro',sans-serif;
    font-size:15px; line-height:1.9; color:var(--ink); padding-bottom:14px; margin:0;
  }

  /* Flashcards */
  .fc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .flip-card{ perspective:1000px; height:120px; cursor:pointer; }
  .flip-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-front,.flip-back{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;
  }
  .flip-front{ background:linear-gradient(160deg,#fff,var(--pink)); border:1px solid var(--pink-deep); }
  .flip-front .hz{ font-family:'Noto Serif SC',serif; font-weight:700; font-size:26px; color:var(--maroon-dark); }
  .flip-front .py{ color:var(--gold); font-size:13px; margin-top:4px; font-weight:600; }
  .flip-back{ background:var(--maroon); color:#fff; transform:rotateY(180deg); }
  .flip-back .mn{ font-weight:700; font-size:14.5px; }
  .flip-back .vd{ font-size:11.5px; opacity:.85; margin-top:6px; font-family:'Noto Sans SC',sans-serif; }
  .fc-hint{ font-size:13px; color:var(--ink-soft); margin:-8px 0 16px; }

  /* Grammar cards */
  .g-item{ border-left:3px solid var(--gold); padding:10px 0 10px 16px; margin-bottom:16px; }
  .g-item:last-child{ margin-bottom:0; }
  .g-item h4{ margin:0 0 6px; font-family:'Noto Serif SC',serif; color:var(--maroon-dark); font-size:17px; }
  .g-item p{ margin:0 0 8px; font-size:14.5px; color:var(--ink); }
  .g-item ul{ margin:0; padding-left:18px; }
  .g-item li{ font-size:14px; color:var(--ink-soft); margin-bottom:3px; font-family:'Noto Sans SC','Be Vietnam Pro',sans-serif; }

  /* Quiz */
  .quiz-score{ display:inline-block; background:var(--pink); color:var(--maroon-dark); font-weight:700;
    padding:6px 14px; border-radius:999px; margin-bottom:16px; font-size:14px; }
  .quiz-score .score-val{ font-size:15px; }
  .q-box{ margin-bottom:18px; padding-bottom:16px; border-bottom:1px dashed var(--line); }
  .q-box:last-child{ border-bottom:none; }
  .q-text{ font-size:15px; margin-bottom:10px; font-weight:600; }
  .q-num{ color:var(--gold); }
  .opt-wrap{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; }
  .opt-btn{
    text-align:left; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:14px; font-family:inherit; color:var(--ink);
    transition:.15s;
  }
  .opt-btn:hover:not(:disabled){ border-color:var(--maroon-soft); background:var(--pink); }
  .opt-btn.correct{ background:var(--green-bg); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt-btn.wrong{ background:var(--red-bg); border-color:var(--red); color:var(--red); font-weight:700; }
  .opt-btn:disabled{ cursor:default; opacity:.85; }
  .q-note{ margin-top:8px; font-size:13px; color:var(--ink-soft); background:#FAF3EA; padding:8px 10px; border-radius:8px; }

  .tf-wrap{ display:flex; gap:8px; }
  .tf-btn{
    padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:#fff;
    cursor:pointer; font-weight:700; font-size:13.5px;
  }
  .tf-btn.correct{ background:var(--green-bg); border-color:var(--green); color:var(--green); }
  .tf-btn.wrong{ background:var(--red-bg); border-color:var(--red); color:var(--red); }
  .tf-btn:disabled{ cursor:default; }

  .btn-main{
    background:var(--maroon); color:#fff; border:none; padding:10px 20px; border-radius:999px;
    font-weight:700; cursor:pointer; font-size:14px; box-shadow:0 6px 14px -6px rgba(79,22,34,.6);
  }
  .btn-main:hover{ background:var(--maroon-dark); }
  .btn-row{ margin-bottom:16px; }

  /* Matching game */
  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .match-col{ display:flex; flex-direction:column; gap:8px; }
  .match-btn{
    padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer;
    text-align:center; font-size:14px; font-family:inherit; color:var(--ink);
  }
  .match-btn .py-sm{ display:block; font-size:11px; color:var(--gold); font-weight:600; margin-top:2px; }
  .match-btn.selected{ border-color:var(--maroon); background:var(--pink); }
  .match-btn.matched{ background:var(--green-bg); border-color:var(--green); color:var(--green); cursor:default; }
  .match-btn.shake{ animation:shake .35s; border-color:var(--red); }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .match-done{ grid-column:1/-1; text-align:center; font-weight:700; color:var(--green); margin-top:10px; }

  /* Cloze */
  .cloze-passage{
    font-family:'Noto Sans SC','Be Vietnam Pro',sans-serif; font-size:16px; line-height:2.1;
    background:#FAF3EA; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px;
  }
  .blank{ display:inline-block; min-width:64px; text-align:center; padding:1px 8px; border-radius:6px;
    border-bottom:2px solid var(--gold); font-weight:700; color:var(--gold); }
  .blank.correct{ color:var(--green); border-color:var(--green); }
  .blank.wrong{ color:var(--red); border-color:var(--red); }
  .cloze-q{ margin-bottom:14px; }
  .cloze-q .lbl{ font-size:13.5px; font-weight:700; color:var(--maroon-dark); margin-bottom:6px; }
  .cloze-opts{ display:flex; gap:8px; flex-wrap:wrap; }
  .cloze-opts button{
    padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13.5px;
  }
  .cloze-opts button.correct{ background:var(--green-bg); border-color:var(--green); color:var(--green); font-weight:700;}
  .cloze-opts button.wrong{ background:var(--red-bg); border-color:var(--red); color:var(--red); font-weight:700;}

  .intro-text{ color:var(--ink-soft); font-size:14.5px; margin-bottom:18px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media(max-width:720px){
    .grid2{ grid-template-columns:1fr; }
    .match-wrap{ grid-template-columns:1fr; }
  }
  footer{ text-align:center; padding:26px; color:var(--ink-soft); font-size:13px; }
</style>
</head>

/* ============ HELPERS ============ */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function renderFlashcards(container, vocab){
  container.innerHTML='';
  vocab.forEach(v=>{
    const card=el('div','flip-card');
    card.innerHTML=`<div class="flip-inner">
      <div class="flip-front"><div class="hz hanzi">${v.h}</div><div class="py">${v.p}</div></div>
      <div class="flip-back"><div class="mn">${v.m}</div><div class="vd hanzi">${v.vd||''}</div></div>
    </div>`;
    card.addEventListener('click',()=>card.classList.toggle('flipped'));
    container.appendChild(card);
  });
}

function buildVocabMCQ(vocabList,pool,n){
  const chosen=shuffle(vocabList).slice(0,n||vocabList.length);
  return chosen.map(v=>{
    const distract=shuffle(pool.filter(x=>x.h!==v.h)).slice(0,3).map(x=>x.m);
    const options=shuffle([v.m,...distract]);
    return {q:`“<span class="hanzi">${v.h}</span> (${v.p})” có nghĩa là gì?`, options, answer:options.indexOf(v.m)};
  });
}

function renderMCQuiz(container, questions){
  container.innerHTML='';
  let score=0;
  const scoreBox=el('div','quiz-score',`Điểm: <span class="score-val">0</span>/${questions.length}`);
  container.appendChild(scoreBox);
  questions.forEach((q,qi)=>{
    const qBox=el('div','q-box');
    qBox.innerHTML=`<div class="q-text"><span class="q-num">Câu ${qi+1}.</span> ${q.q}</div>`;
    const optWrap=el('div','opt-wrap');
    q.options.forEach((opt,oi)=>{
      const b=el('button','opt-btn',opt);
      b.addEventListener('click',()=>{
        if(qBox.classList.contains('answered')) return;
        qBox.classList.add('answered');
        [...optWrap.children].forEach((btn,i)=>{
          btn.disabled=true;
          if(i===q.answer) btn.classList.add('correct');
          else if(i===oi) btn.classList.add('wrong');
        });
        if(oi===q.answer){ score++; scoreBox.querySelector('.score-val').textContent=score; }
        if(q.note) qBox.appendChild(el('div','q-note','💡 '+q.note));
      });
      optWrap.appendChild(b);
    });
    qBox.appendChild(optWrap);
    container.appendChild(qBox);
  });
}

function renderTF(container, items){
  container.innerHTML='';
  let score=0;
  const scoreBox=el('div','quiz-score',`Điểm: <span class="score-val">0</span>/${items.length}`);
  container.appendChild(scoreBox);
  items.forEach((it,ii)=>{
    const qBox=el('div','q-box');
    qBox.innerHTML=`<div class="q-text hanzi"><span class="q-num" style="font-family:'Be Vietnam Pro',sans-serif;">Câu ${ii+1}.</span> ${it.t}</div>`;
    const wrap=el('div','tf-wrap');
    ['Đúng','Sai'].forEach((lbl,oi)=>{
      const val = oi===0;
      const b=el('button','tf-btn',lbl);
      b.addEventListener('click',()=>{
        if(qBox.classList.contains('answered')) return;
        qBox.classList.add('answered');
        [...wrap.children].forEach((btn,i)=>{
          btn.disabled=true;
          const bval = i===0;
          if(bval===it.a) btn.classList.add('correct');
          else if(bval===val && val!==it.a) btn.classList.add('wrong');
        });
        if(val===it.a) { score++; scoreBox.querySelector('.score-val').textContent=score; }
      });
      wrap.appendChild(b);
    });
    qBox.appendChild(wrap);
    container.appendChild(qBox);
  });
}

function renderMatching(container, vocabList){
  container.innerHTML='';
  const left=shuffle(vocabList);
  const right=shuffle(vocabList);
  let selectedLeft=null, matchedCount=0;
  const wrap=el('div','match-wrap');
  const colL=el('div','match-col');
  const colR=el('div','match-col');
  left.forEach(item=>{
    const b=el('button','match-btn',`<span class="hanzi" style="font-size:18px;">${item.h}</span><span class="py-sm">${item.p}</span>`);
    b.dataset.key=item.h;
    b.addEventListener('click',()=>{
      if(b.classList.contains('matched')) return;
      [...colL.children].forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected'); selectedLeft=b;
    });
    colL.appendChild(b);
  });
  right.forEach(item=>{
    const b=el('button','match-btn',item.m);
    b.dataset.key=item.h;
    b.addEventListener('click',()=>{
      if(b.classList.contains('matched')||!selectedLeft) return;
      if(b.dataset.key===selectedLeft.dataset.key){
        b.classList.add('matched'); selectedLeft.classList.add('matched');
        b.classList.remove('selected'); selectedLeft.classList.remove('selected');
        selectedLeft=null; matchedCount++;
        if(matchedCount===left.length) container.appendChild(el('div','match-done','🎉 Hoàn thành! Bạn đã nối đúng tất cả.'));
      } else {
        [b,selectedLeft].forEach(x=>{ x.classList.add('shake'); setTimeout(()=>x.classList.remove('shake'),380); });
      }
    });
    colR.appendChild(b);
  });
  wrap.appendChild(colL); wrap.appendChild(colR);
  container.appendChild(wrap);
}

function renderCloze(container, clozeItem){
  container.innerHTML='';
  const title=el('h4','',clozeItem.title);
  title.style.margin='0 0 10px'; title.style.color='var(--maroon-dark)';
  container.appendChild(title);
  let html=clozeItem.text.replace(/\{\{(\d+)\}\}/g,(m,id)=>`<span class="blank hanzi" id="blank-${clozeItem._uid}-${id}">＿＿＿</span>`);
  const passage=el('div','cloze-passage hanzi', html);
  container.appendChild(passage);
  clozeItem.blanks.forEach(bl=>{
    const qDiv=el('div','cloze-q');
    qDiv.appendChild(el('div','lbl',`Chỗ trống (${bl.id}):`));
    const optWrap=el('div','cloze-opts');
    shuffle(bl.options).forEach(opt=>{
      const btn=el('button','',opt);
      btn.classList.add('hanzi');
      btn.addEventListener('click',()=>{
        if(qDiv.classList.contains('done')) return;
        qDiv.classList.add('done');
        const span=document.getElementById(`blank-${clozeItem._uid}-${bl.id}`);
        [...optWrap.children].forEach(b=>b.disabled=true);
        if(opt===bl.answer){
          btn.classList.add('correct'); span.textContent=bl.answer; span.classList.add('correct');
        } else {
          btn.classList.add('wrong'); span.textContent=bl.answer; span.classList.add('wrong');
          [...optWrap.children].forEach(b=>{ if(b.textContent===bl.answer) b.classList.add('correct'); });
        }
      });
      optWrap.appendChild(btn);
    });
    qDiv.appendChild(optWrap);
    container.appendChild(qDiv);
  });
}

const main=document.getElementById('mainContent');

TABS.forEach((t,i)=>{
  const b=el('button','tab-btn'+(i===0?' active':''), t.label);
  b.dataset.tab=t.id;
  b.addEventListener('click',()=>switchTab(t.id));
  tabBar.appendChild(b);
});

function buildPhanPanel(pid){
  const panel=el('section','panel',``);
  panel.id='panel-'+pid;
  const num = {p1:'一',p2:'二',p3:'三',p4:'四',p5:'五'}[pid];
  panel.innerHTML=`
    <div class="lesson-head">
      <div class="seal hanzi">${num}</div>
      <div><h2 class="hanzi">${LESSON_TITLE[pid]}</h2><p>Từ vựng · Ngữ pháp · Đọc hiểu — Phần ${pid.slice(1)}</p></div>
    </div>
    <details class="dialogue"><summary>📜 Xem lại đoạn hội thoại / đoạn văn</summary><pre class="hanzi"></pre></details>
    <div class="card">
      <h3><span class="dot"></span>Từ vựng mới</h3>
      <p class="fc-hint">Nhấn vào thẻ để lật xem nghĩa.</p>
      <div class="fc-grid"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>Trắc nghiệm từ vựng</h3>
      <div class="btn-row"><button class="btn-main regen">🔄 Làm lại</button></div>
      <div class="quiz-mount"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>Điểm ngữ pháp</h3>
      <div class="g-mount"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>Bài tập ngữ pháp</h3>
      <div class="g-quiz-mount"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>Đọc hiểu — Đúng hay Sai</h3>
      <div class="tf-mount"></div>
    </div>
  `;
  panel.querySelector('pre').textContent=READING[pid].passage;
  renderFlashcards(panel.querySelector('.fc-grid'), VOCAB[pid]);

  const quizMount=panel.querySelector('.quiz-mount');
  const regen=()=>renderMCQuiz(quizMount, buildVocabMCQ(VOCAB[pid], ALL_VOCAB));
  regen();
  panel.querySelector('.regen').addEventListener('click',regen);

  const gMount=panel.querySelector('.g-mount');
  GRAMMAR[pid].forEach(g=>{
    const item=el('div','g-item');
    item.innerHTML=`<h4>${g.t}</h4><p>${g.e}</p><ul>${g.ex.map(x=>`<li class="hanzi">${x}</li>`).join('')}</ul>`;
    gMount.appendChild(item);
  });

  renderMCQuiz(panel.querySelector('.g-quiz-mount'), GRAMMAR_QUIZ[pid]);
  renderTF(panel.querySelector('.tf-mount'), READING[pid].items);

  return panel;
}

function buildVanDungPanel(){
  const panel=el('section','panel',``);
  panel.id='panel-vd';
  panel.innerHTML=`
    <div class="lesson-head">
      <div class="seal hanzi">★</div>
      <div><h2 class="hanzi">综合练习</h2><p>Vận dụng — ôn tập tổng hợp toàn bộ 32 từ vựng của Bài 1</p></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>Ôn nhanh toàn bộ từ vựng</h3>
      <p class="fc-hint">Nhấn vào thẻ để lật xem nghĩa. (Gồm cả 5 phần)</p>
      <div class="fc-grid-all"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>Trắc nghiệm tổng hợp (20 câu ngẫu nhiên)</h3>
      <div class="btn-row"><button class="btn-main regen-all">🔄 Làm lại</button></div>
      <div class="quiz-all-mount"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>Trò chơi nối từ</h3>
      <p class="fc-hint">Chọn 1 từ Hán tự bên trái rồi chọn nghĩa tương ứng bên phải.</p>
      <div class="btn-row"><button class="btn-main regen-match">🔀 Đổi bộ từ khác</button></div>
      <div class="match-mount"></div>
    </div>
  `;
  renderFlashcards(panel.querySelector('.fc-grid-all'), ALL_VOCAB);

  const quizAll=panel.querySelector('.quiz-all-mount');
  const regenAll=()=>renderMCQuiz(quizAll, buildVocabMCQ(ALL_VOCAB, ALL_VOCAB, 20));
  regenAll();
  panel.querySelector('.regen-all').addEventListener('click',regenAll);

  const matchMount=panel.querySelector('.match-mount');
  const regenMatch=()=>renderMatching(matchMount, shuffle(ALL_VOCAB).slice(0,8));
  regenMatch();
  panel.querySelector('.regen-match').addEventListener('click',regenMatch);

  return panel;
}

function buildNangCaoPanel(){
  const panel=el('section','panel',``);
  panel.id='panel-nc';
  panel.innerHTML=`
    <div class="lesson-head">
      <div class="seal hanzi">✦</div>
      <div><h2 class="hanzi">提高练习</h2><p>Nâng cao — phân biệt từ dễ nhầm, chọn câu đúng &amp; đọc hiểu điền từ</p></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>1. Phân biệt từ dễ nhầm</h3>
      <p class="fc-hint">适合/合适 · 刚/刚才 · 不仅…也/虽然…但是 · 即使…也/如果…就</p>
      <div class="confusable-mount"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>2. Chọn câu đúng ngữ pháp</h3>
      <div class="sentence-mount"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>3. Đọc hiểu — điền từ vào đoạn văn</h3>
      <div class="cloze1-mount"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>4. Đọc hiểu — điền từ vào đoạn văn (2)</h3>
      <div class="cloze2-mount"></div>
    </div>
  `;
  renderMCQuiz(panel.querySelector('.confusable-mount'), CONFUSABLE);
  renderMCQuiz(panel.querySelector('.sentence-mount'), SENTENCE_MC);
  CLOZE[0]._uid='a'; CLOZE[1]._uid='b';
  renderCloze(panel.querySelector('.cloze1-mount'), CLOZE[0]);
  renderCloze(panel.querySelector('.cloze2-mount'), CLOZE[1]);
  return panel;
}

['p1','p2','p3','p4','p5'].forEach(pid=> main.appendChild(buildPhanPanel(pid)) );
main.appendChild(buildVanDungPanel());
main.appendChild(buildNangCaoPanel());
document.getElementById('panel-p1').classList.add('active');

function switchTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
</body>
