<script>const DATA={"title":"简单的爱情","vi":"Tình yêu đơn giản","theme":"","vocab":[["法律","fǎlǜ","pháp luật, luật"],["俩","liǎ","hai (người/vật, khẩu ngữ)"],["印象","yìnxiàng","ấn tượng"],["深","shēn","sâu, sâu sắc"],["熟悉","shúxī","quen thuộc, hiểu rõ"],["不仅","bùjǐn","không những"],["性格","xìnggé","tính cách"],["最好","zuìhǎo","tốt nhất; nên"],["从来","cónglái","từ trước đến nay"],["游戏","yóuxì","trò chơi"],["开玩笑","kāi wánxiào","nói đùa"],["幸福","xìngfú","hạnh phúc"],["适合","shìhé","phù hợp với"],["共同","gòngtóng","chung, cùng"],["接受","jiēshòu","chấp nhận"],["缺点","quēdiǎn","khuyết điểm"],["够","gòu","đủ"],["浪漫","làngmàn","lãng mạn"],["刚","gāng","vừa, vừa mới"],["生活","shēnghuó","cuộc sống; sống"],["即使","jíshǐ","cho dù, ngay cả khi"],["星星","xīngxing","ngôi sao"],["爱情","àiqíng","tình yêu"],["羡慕","xiànmù","ngưỡng mộ, ghen tị"],["感动","gǎndòng","cảm động, làm xúc động"],["亮","liàng","sáng; chiếu sáng"],["加班","jiābān","tăng ca, làm thêm giờ"],["互相","hùxiāng","lẫn nhau"],["原因","yuányīn","nguyên nhân"],["自然","zìrán","tự nhiên; đương nhiên"],["脾气","píqi","tính khí"],["幽默","yōumò","hóm hỉnh"],["吸引","xīyǐn","thu hút"]],"grammar":[["俩","俩 thường tương đương 两个 trong khẩu ngữ, không thêm 个 sau 俩.","他们俩是好朋友。"],["深","Ngoài nghĩa “sâu”, 深 còn dùng cho mức độ ấn tượng/cảm xúc.","那个人给我的印象很深。"],["不仅……也／还／而且……","Không những… mà còn…; vị trí 不仅 phụ thuộc việc hai vế có cùng chủ ngữ hay không.","他不仅很幽默，而且性格也很好。"],["从来","Thường đi với phủ định để nói “từ trước đến nay chưa/không…”.","我从来没迟到过。"],["最好","Dùng để đưa ra lời khuyên: tốt nhất/nên…","两个人在一起，最好能互相理解。"],["适合 / 合适","适合 là động từ “phù hợp với”; 合适 là tính từ “thích hợp”.","这件衣服适合你。 / 这件衣服很合适。"],["……吧？","Dùng ở cuối câu để suy đoán hoặc hỏi xác nhận.","你是在开玩笑吧？"],["刚 / 刚才","刚 là phó từ “vừa mới”; 刚才 là danh từ thời gian “lúc nãy”.","我刚到家。 / 刚才谁给我打电话了？"],["即使……也……","Cho dù điều kiện có thay đổi thì kết quả vẫn không đổi.","即使星期天，他也要加班。"],["互相","Đặt trước động từ để diễn tả hành động qua lại giữa hai bên.","两个人应该互相帮助、互相理解。"],["（在）……上","Chỉ phương diện/lĩnh vực: về mặt…, ở phương diện…","他们在性格上很不一样。"]],"fills":[{"s":"他们____认识很多年了，关系一直很好。","a":"俩","o":["俩","深","够","亮"]},{"s":"第一次见面时，她给我的____很深。","a":"印象","o":["印象","原因","法律","星星"]},{"s":"他____工作认真，而且性格也很幽默。","a":"不仅","o":["不仅","从来","即使","最好"]},{"s":"我____没有因为一点儿小事跟她生气过。","a":"从来","o":["从来","刚","自然","共同"]},{"s":"两个人一起生活，____有一些共同的兴趣。","a":"最好","o":["最好","够","亮","熟悉"]},{"s":"这份工作不太____他，因为他不喜欢经常出差。","a":"适合","o":["适合","接受","吸引","生活"]},{"s":"____周末要加班，他____会抽时间陪家人吃饭。","a":"即使 / 也","o":["即使 / 也","不仅 / 而且","从来 / 没","最好 / 吧"]},{"s":"相处久了以后，我们学会了____理解，也更能接受对方的缺点。","a":"互相","o":["互相","自然","共同","刚"]}],"grammarQuiz":[{"q":"Câu nào dùng 俩 đúng?","o":["他们俩是大学同学。","他们俩个是大学同学。","他们俩个人个是同学。","俩他们是同学。"],"a":0,"e":"俩 không đi với 个."},{"q":"Điền: 她____会做饭，而且很会照顾人。","o":["不仅","从来","最好","刚"],"a":0,"e":"不仅……而且……"},{"q":"Câu nào diễn tả “từ trước đến nay tôi chưa nói dối anh ấy”?","o":["我从来没对他说过谎。","我从来说过没谎。","我刚没从来对他说谎。","我最好从来谎。"],"a":0,"e":"从来 thường đi với phủ định."},{"q":"Chọn câu dùng 最好 như lời khuyên.","o":["你最好先了解对方的性格。","你最好了昨天。","最好他很浪漫。","你是最好吧。"],"a":0,"e":"最好 + động từ/cụm động từ."},{"q":"Điền: ____工作再忙，他____会记得给家里打电话。","o":["即使 / 也","不仅 / 而且","从来 / 没","刚 / 才"],"a":0,"e":"即使……也……"},{"q":"“在性格上” có nghĩa gần nhất là…","o":["về phương diện tính cách","ở trên một người","sau khi tính cách thay đổi","chỉ nói về địa điểm"],"a":0,"e":"（在）……上 có thể chỉ phương diện."}],"apply":["Viết hội thoại 8–10 lượt: Hai người bạn nói về mẫu người yêu/vợ/chồng phù hợp. Dùng ít nhất 6 từ: 性格、幽默、共同、浪漫、适合、接受、缺点、互相、幸福、吸引。","Viết 80–100 chữ: 你觉得什么是“简单的爱情”？ Bắt buộc dùng 不仅……而且……, 即使……也…… và ít nhất 5 từ mới Bài 1.","Viết 60–80 chữ: Hai người có tính cách khác nhau thì nên làm gì để sống hạnh phúc? Dùng 互相、最好、在……上 và ít nhất 4 từ mới."],"advanced":[{"q":"Sửa lỗi: 他们俩个人都很幽默。","hint":"俩 đã bao hàm 两个, không thêm 个.","sample":"他们俩都很幽默。"},{"q":"Viết lại bằng 不仅……而且……: 他很认真。他也很幽默。","hint":"Cùng chủ ngữ → 不仅 đặt sau chủ ngữ.","sample":"他不仅很认真，而且很幽默。"},{"q":"Viết 60–80 chữ nêu một hành động “lãng mạn đơn giản” trong đời sống hằng ngày. Dùng 即使……也……、互相、感动、幸福.","hint":"Tập trung vào hành động nhỏ nhưng thể hiện quan tâm và thấu hiểu.","sample":"开放题：重点检查结构、词汇和内容是否完整。"}],"summary":"Bài 1 xoay quanh tình yêu, tính cách, sự phù hợp, điểm mạnh/khuyết điểm, sự lãng mạn và cách hai người cùng xây dựng cuộc sống hạnh phúc."};const ADV_DATA={"mcq":[{"q":"第一次见面时，他说话很幽默，给我的____很深。","o":["印象","法律","星星","原因"],"a":0,"e":"“印象很深” là collocation trọng tâm."},{"q":"两个人一起生活，____能有共同的兴趣和爱好。","o":["最好","刚","从来","够"],"a":0,"e":"最好 dùng để đưa ra lời khuyên."},{"q":"她____工作认真，____很会照顾家人。","o":["不仅 / 而且","即使 / 也","从来 / 没","刚 / 才"],"a":0,"e":"不仅……而且…… bổ sung ưu điểm thứ hai."},{"q":"____周末要加班，他____会抽时间陪家人吃饭。","o":["即使 / 也","不仅 / 而且","最好 / 吧","从来 / 没"],"a":0,"e":"即使……也…… = cho dù… vẫn…"},{"q":"长期生活在一起，两个人应该____理解和帮助。","o":["互相","自然","共同","适合"],"a":0,"e":"互相 + động từ diễn tả hành động qua lại."}],"reorder":[{"parts":["他们俩","是在","一次志愿活动中","认识的"],"answer":"他们俩是在一次志愿活动中认识的","e":"俩 đứng sau đại từ/chủ ngữ, không thêm 个."},{"parts":["她","不仅很幽默","而且","性格","也很好"],"answer":"她不仅很幽默而且性格也很好","e":"不仅……而且…… nối hai đặc điểm tích cực."},{"parts":["我","从来没有","因为小事","跟他","生过气"],"answer":"我从来没有因为小事跟他生过气","e":"从来没有/没 + động từ."},{"parts":["两个人","最好","学会","互相理解","和接受"],"answer":"两个人最好学会互相理解和接受","e":"最好 + VP; 互相 đứng trước động từ."},{"parts":["即使","工作很忙","他","也会","陪家人"],"answer":"即使工作很忙他也会陪家人","e":"即使……也……结构。"}],"sequence":[{"q":"Sắp xếp quá trình xây dựng một mối quan hệ lành mạnh:","items":["A. 先了解对方的性格","B. 接受彼此的一些缺点","C. 在生活中互相理解和帮助"],"o":["A → B → C","C → A → B","B → A → C","A → C → B"],"a":0,"e":"了解 → 接受 → 在长期生活中互相支持。"},{"q":"Một người muốn xin lỗi sau khi tranh cãi, thứ tự hợp lý là:","items":["A. 先冷静下来","B. 说明自己生气的原因","C. 听对方解释并互相理解"],"o":["A → B → C","B → C → A","C → A → B","A → C → B"],"a":0,"e":"先冷静，再说明原因，最后沟通理解。"},{"q":"Sắp xếp tình huống “关心伴侣”:","items":["A. 发现对方最近常常加班","B. 问他是不是太累","C. 主动准备晚饭并陪他聊天"],"o":["A → B → C","C → B → A","B → A → C","A → C → B"],"a":0,"e":"先观察，再询问，最后行动。"}],"error":[{"q ype":"hanzi_length","label":"Độ dài 60–80 chữ Hán","weight":20,"min":60,"max":80},{"type":"keywords","label":"Có 互相、最好","weight":25,"words":["互相","最好"],"min":2},{"type":"combo","label":"Dùng cấu trúc 在……上","weight":20,"groups":[["在","上"]]},{"type":"vocab_hits","label":"Dùng ≥4 từ mới Bài 1","weight":25,"min":4},{"type":"punctuation","label":"Có ít nhất 3 câu/ý","weight":10,"min":3}]}],"advanced":[{"criteria":[{"type":"forbidden","label":"Không dùng 俩个人","weight":50,"words":["俩个人"]},{"type":"keywords","label":"Giữ từ 俩","weight":50,"words":["俩"],"min":1}]},{"criteria":[{"type":"combo","label":"Dùng 不仅……而且……","weight":60,"groups":[["不仅","而且"]]},{"type":"keywords","label":"Giữ ý 认真、幽默","weight":40,"words":["认真","幽默"],"min":2}]},{"criteria":[{"type":"hanzi_length","label":"60–80 chữ Hán","weight":20,"min":60,"max":80},{"type":"combo","label":"即使……也……","weight":25,"groups":[["即使","也"]]},{"type":"keywords","label":"Dùng 互相、感动、幸福","weight":35,"words":["互相","感动","幸福"],"min":3},{"type":"punctuation","label":"≥3 câu/ý","weight":20,"min":3}]}]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const state={tab:'flash',flashIndex:0,flashMask:false,quiz:[],quizAns:{},fillAns:{},grammarAns:{},advChoice:{},done:0};
const tabs=[["flash", "Từ vựng"], ["quiz", "Trắc nghiệm"], ["fill", "Điền từ"], ["grammar", "Ngữ pháp"], ["apply", "Vận dụng"], ["advanced", "Nâng cao"]];
const lesson="1";
const L=DATA;
function shuffleStaticQuestion(q){
  if(!q || !Array.isArray(q.o) || !q.o.length) return;
  const numericAnswer = typeof q.a === 'number';
  const correct = numericAnswer ? q.o[q.a] : q.a;
  q.o = shuffle(q.o);
  if(numericAnswer) q.a = q.o.indexOf(correct);
}

function randomizeSequenceQuestion(q){
  if(!q || !Array.isArray(q.items) || q.items.length < 2 || !Array.isArray(q.o) || typeof q.a !== 'number') return;

  // Lưu nhãn cũ (A/B/C...) và phần nội dung thực tế.
  const original = q.items.map((item, index) => {
    const m = String(item).match(/^\s*([A-Z])\.\s*(.*)$/);
    return {
      oldLabel: m ? m[1] : String.fromCharCode(65 + index),
      text: m ? m[2] : String(item)
    };
  });

  const correctOriginal = String(q.o[q.a] || '');
  const letters = original.map(x => x.oldLabel);

  // Xáo các mệnh đề; tránh để thứ tự đúng vẫn rơi vào A → B → C.
  let shuffledItems, mapping, transformedCorrect;
  let attempts = 0;

  do {
    shuffledItems = shuffle(original);
    mapping = {};
    shuffledItems.forEach((item, newIndex) => {
      mapping[item.oldLabel] = String.fromCharCode(65 + newIndex);
    });

    transformedCorrect = correctOriginal.replace(/[A-Z]/g, ch => mapping[ch] || ch);
    attempts++;
  } while (
    normalizeSequenceText(transformedCorrect) === 'ABC' &&
    attempts < 20
  );

  // Gắn lại nhãn A/B/C theo thứ tự HIỂN THỊ mới.
  q.items = shuffledItems.map((item, newIndex) =>
    `${String.fromCharCode(65 + newIndex)}. ${item.text}`
  );

  // Đổi toàn bộ phương án A→B→C... sang hệ nhãn mới.
  q.o = q.o.map(option =>
    String(option).replace(/[A-Z]/g, ch => mapping[ch] || ch)
  );
}

function normalizeSequenceText(s){
  return String(s || '').replace(/[^A-Z]/g, '');
}

function randomizeStaticAnswers(){
  (L.fills || []).forEach(shuffleStaticQuestion);
  (L.grammarQuiz || []).forEach(shuffleStaticQuestion);

  if(typeof ADV_DATA !== 'undefined' && ADV_DATA){
    (ADV_DATA.mcq || []).forEach(shuffleStaticQuestion);

    // Phần ③ Sắp xếp trình tự:
    // 1) xáo chính các mệnh đề A/B/C,
    // 2) đổi đáp án đúng tương ứng,
    // 3) tiếp tục xáo vị trí 4 lựa chọn.
    (ADV_DATA.sequence || []).forEach(q => {
      randomizeSequenceQuestion(q);
      shuffleStaticQuestion(q);
    });

    (ADV_DATA.error || []).forEach(shuffleStaticQuestion);
    (ADV_DATA.reading || []).forEach(r => (r.qs || []).forEach(shuffleStaticQuestion));
  }
}
randomizeStaticAnswers();

function intro(title,sub,actions=''){return `<div class="section-intro"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${actions}</div></div>`}

function makeVocabQuiz(vocab,n=10){return shuffle(vocab.map((v,i)=>({v,i}))).slice(0,n).map(({v,i})=>{const reverse=Math.random()<.45;const pool=shuffle(vocab.filter((_,j)=>j!==i)).slice(0,3);const options=shuffle([v,...pool]);return reverse?{q:`Chọn từ Hán đúng với nghĩa: “${v[2]}”`,options:options.map(x=>x[0]),ans:options.findIndex(x=>x[0]===v[0]),exp:`${v[0]} · ${v[1]} = ${v[2]}`}:{q:`${v[0]} · ${v[1]} có nghĩa là gì?`,options:options.map(x=>x[2]),ans:options.findIndex(x=>x[0]===v[0]),exp:`${v[0]} = ${v[2]}`}})}

function renderBankQuiz(c,items,bagName,title,sub){const bag=state[bagName];c.innerHTML=intro(title,sub,'<button class="btn" id="resetBank">Làm lại</button><button class="btn primary" id="checkBank">Chấm điểm</button>')+'<div class="quiz-grid" id="bankgrid"></div><div id="bankscore" style="margin-top:14px"></div>';const g=$('#bankgrid');items.forEach((q,qi)=>{const card=el('div','qcard');card.innerHTML=`<div class="qtitle">${qi+1}. ${q.q||q.s}</div><div class="opts"></div><div class="feedback"></div>`;q.o.forEach((o,oi)=>{const val=typeof q.a==='number'?oi:o;const b=el('button','opt'+(bag[qi]===val?' selected':''),o);b.onclick=()=>{bag[qi]=val;renderBankQuiz(c,items,bagName,title,sub)};card.querySelector('.opts').appendChild(b)});g.appendChild(card)});$('#resetBank').onclick=()=>{state[bagName]={};renderBankQuiz(c,items,bagName,title,sub)};$('#checkBank').onclick=()=>{let score=0;items.forEach((q,qi)=>{const card=g.children[qi],btns=card.querySelectorAll('.opt'),ansVal=q.a,chosen=bag[qi],ansIndex=typeof ansVal==='number'?ansVal:q.o.indexOf(ansVal),chosenIndex=typeof chosen==='number'&&typeof ansVal==='number'?chosen:q.o.indexOf(chosen);btns[ansIndex]?.classList.add('good');if(chosen!==undefined&&chosen!==ansVal)btns[chosenIndex]?.classList.add('bad');const ok=chosen===ansVal;if(ok)score++;card.querySelector('.feedback').textContent=ok?'✓ Đúng':`✗ Đáp án: ${typeof ansVal==='number'?q.o[ansVal]:ansVal}`;bump(ok)});$('#bankscore').innerHTML=`<div class="score">Kết quả: ${score}/${items.length}</div>`}}

function renderGrammarQuiz(c){const items=L.grammarQuiz;c.innerHTML=intro('Kiểm tra ngữ pháp','Chọn đáp án phù hợp.','<button class="btn" id="resetG">Làm lại</button><button class="btn primary" id="checkG">Chấm điểm</button>')+'<div class="quiz-grid" id="gg"></div><div id="gs"></div>';const g=$('#gg');items.forEach((q,qi)=>{const card=el('div','qcard');card.innerHTML=`<div class="qtitle">${qi+1}. ${q.q}</div><div class="opts"></div><div class="feedback"></div>`;q.o.forEach((o,oi)=>{const b=el('button','opt'+(state.grammarAns[qi]===oi?' selected':''),o);b.onclick=()=>{state.grammarAns[qi]=oi;renderGrammarQuiz(c)};card.querySelector('.opts').appendChild(b)});g.appendChild(card)});$('#resetG').onclick=()=>{state.grammarAns={};renderGrammarQuiz(c)};$('#checkG').onclick=()=>{let s=0;items.forEach((q,qi)=>{const card=g.children[qi],bs=card.querySelectorAll('.opt'),ch=state.grammarAns[qi];bs[q.a]?.classList.add('good');if(ch!==undefined&&ch!==q.a)bs[ch]?.classList.add('bad');const ok=ch===q.a;if(ok)s++;card.querySelector('.feedback').textContent=(ok?'✓ ':'✗ ')+q.e;bump(ok)});$('#gs').innerHTML=`<div class="score" style="margin-top:14px">Kết quả: ${s}/${items.length}</div>`}}
function taskKey(type,i){return `hsk4_bai${lesson}_${type}_${i}`}
function cleanText(t){return (t||'').replace(/\r/g,'').trim()}
function countHanzi(t){return (t.match(/[\u3400-\u9fff]/g)||[]).length}
function countLines(t){return t.split(/\n+/).map(x=>x.trim()).filter(Boolean).length}
function countSentences(t){const p=(t.match(/[。！？!?；;]/g)||[]).length;return Math.max(p,countLines(t))}
function timeMarkers(t){return (t.match(/(?:\d{1,2}[:：点时]|上午|下午|早上|晚上|中午|星期|周[一二三四五六日天]|今天|明天|后天)/g)||[]).length}
function numberMarkers(t){return (t.match(/\d+(?:\.\d+)?|[一二两三四五六七八九十百千万]+块?/g)||[]).length}
function discountCount(t){const a=t.match(/\d+(?:\.\d+)?折|[一二三四五六七八九十]+折|百分之\s*\d+/g)||[];return new Set(a).size}
function evalCriterion(c,t){let ratio=0,detail='';const han=countHanzi(t);if(c.type==='hanzi_length'){if(han>=c.min&&han<=c.max)ratio=1;else if(han>0){const dist=han<c.min?c.min-han:han-c.max;ratio=Math.max(0,1-dist/Math.max(20,c.max-c.min+20))}detail=`${han} chữ Hán`}
else if(c.type==='hanzi_min'){ratio=Math.min(1,han/c.min);detail=`${han}/${c.min} chữ Hán`}
else if(c.type==='line_count'){const n=countLines(t);ratio=n>=c.min&&(!c.max||n<=c.max)?1:Math.min(1,n/c.min);if(c.max&&n>c.max)ratio=Math.max(.7,1-(n-c.max)*.08);detail=`${n} lượt/dòng`}
else if(c.type==='sentence_count'){const n=countSentences(t);ratio=n>=c.min&&(!c.max||n<=c.max)?1:Math.min(1,n/c.min);if(c.max&&n>c.max)ratio=Math.max(.75,1-(n-c.max)*.05);detail=`${n} câu/ý`}
else if(c.type==='punctuation'){const n=countSentences(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} câu/ý`}
else if(c.type==='keywords'){const base=c.words||[];const hits=base.filter(w=>t.includes(w));let extra=0;if(c.anyWords&&c.anyWords.some(w=>t.includes(w)))extra=1;const need=c.min||base.length;const got=hits.length+extra;ratio=Math.min(1,got/need);const miss=base.filter(w=>!t.includes(w));detail=`đạt ${got}/${need}${miss.length?' · thiếu: '+miss.slice(0,5).join('、'):''}${c.anyWords&&!extra?' · cần một trong: '+c.anyWords.join('/') : ''}`}
else if(c.type==='vocab_hits'){const words=L.vocab.map(x=>x[0]);const hits=words.filter(w=>t.includes(w));ratio=Math.min(1,hits.length/c.min);detail=`${hits.length}/${c.min} từ: ${hits.slice(0,8).join('、')||'chưa có'}`}
else if(c.type==='combo'){const ok=(c.groups||[]).some(g=>g.every(w=>t.includes(w)));ratio=ok?1:0;detail=ok?'đã dùng':'chưa thấy cấu trúc yêu cầu'}
else if(c.type==='forbidden'){const bad=(c.words||[]).filter(w=>t.includes(w));ratio=bad.length?0:1;detail=bad.length?'còn lỗi: '+bad.join('、'):'không còn lỗi mục tiêu'}
else if(c.type==='time_markers'){const n=timeMarkers(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} mốc thời gian`}
else if(c.type==='number_markers'){const n=numberMarkers(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} số/giá`}
else if(c.type==='discount_count'){const n=discountCount(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} mức ưu đãi`}
else if(c.type==='speaker_lines'){const n=t.split(/\n+/).filter(x=>/[：:]/.test(x)).length;ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} dòng có người nói`}
return {ratio:Math.max(0,Math.min(1,ratio)),detail}}
function gradeText(text,rule){text=cleanText(text);if(!text)return {score:0,rows:[{label:'Chưa có bài làm',weight:100,ratio:0,detail:'Hãy nhập câu trả lời trước.'}]};let total=0;const rows=(rule.criteria||[]).map(c=>{const r=evalCriterion(c,text);const pts=r.ratio*c.weight;total+=pts;return {...c,...r,pts}});return {score:Math.round(total),rows}}
function gradeBlockHTML(res){const verdict=res.score>=85?'Rất tốt':res.score>=70?'Đạt':res.score>=50?'Cần bổ sung':'Chưa đạt';return `<div class="grade-head"><div><b>Chấm tự động theo rubric</b><div style="font-size:12px;color:var(--muted)">${verdict}</div></div><div class="grade-big">${res.score}/100</div></div>`+res.rows.map(r=>`<div class="criterion ${r.ratio>=.99?'good':r.ratio>=.55?'partial':'bad'}"><span>${r.label}<br><small>${r.detail||''}</small></span><b>${Math.round(r.pts||0)}/${r.weight}</b></div>`).join('')+`<div class="grade-note">Điểm này do trình duyệt chấm theo tiêu chí có thể đo được (độ dài, từ khóa, cấu trúc, hình thức). Nó không đánh giá đầy đủ độ tự nhiên, lập luận hay lỗi ngữ pháp tinh tế như giáo viên/AI.</div>`}

function gradeChoiceQuestion(q,key){const chosen=state.advChoice[key];const card=document.querySelector(`[data-cardkey="${key}"]`);const opts=card?card.querySelectorAll('.adv-opt'):[];opts.forEach(x=>x.classList.remove('good','bad'));if(opts[q.a])opts[q.a].classList.add('good');if(chosen!==undefined&&chosen!==q.a&&opts[chosen])opts[chosen].classList.add('bad');const ok=chosen===q.a;card?.classList.remove('unanswered','correct','incorrect');card?.classList.add(chosen===undefined?'unanswered':ok?'correct':'incorrect');const fb=card?.querySelector('.adv-feedback');if(fb){fb.classList.add('show');fb.innerHTML=chosen===undefined?`⚠ Chưa chọn đáp án. Đáp án đúng: <b>${String.fromCharCode(65+q.a)}</b>. ${q.e}`:`${ok?'✓ Đúng':'✗ Chưa đúng'} · Đáp án: <b>${String.fromCharCode(65+q.a)}</b>. ${q.e}`};return ok?1:0}
function gradeAdvanced(c){const A=ADV_DATA;let correct=0,total=0;A.mcq.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`mcq-${i}`)});A.reorder.forEach((q,i)=>{total++;const card=document.querySelector(`#adv-reorder-${i}`),ans=card.querySelector('.order-answer'),txt=[...ans.querySelectorAll('.word-chip')].map(x=>x.textContent).join('');const ok=normalizeAdv(txt)===normalizeAdv(q.answer);ans.classList.remove('good','bad');ans.classList.add(ok?'good':'bad');card.classList.remove('unanswered','correct','incorrect');card.classList.add(!txt?'unanswered':ok?'correct':'incorrect');const fb=card.querySelector('.adv-feedback');fb.classList.add('show');fb.innerHTML=!txt?`⚠ Chưa sắp xếp. Đáp án: <b>${q.answer}。</b> ${q.e}`:`${ok?'✓ Đúng':'✗ Chưa đúng'} · Đáp án: <b>${q.answer}。</b> ${q.e}`;if(ok)correct++});A.sequence.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`sequence-${i}`)});A.error.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`error-${i}`)});A.reading.forEach((r,ri)=>r.qs.forEach((q,qi)=>{total++;correct+=gradeChoiceQuestion(q,`reading-${ri}-${qi}`)}));const score=Math.round(correct/total*100),verdict=score>=90?'Xuất sắc':score>=80?'Rất tốt':score>=70?'Đạt':score>=50?'Cần ôn thêm':'Nên làm lại';$('#advScore').textContent=`${score}/100 · ${correct}/${total} câu đúng · ${verdict}`;bump(true);toast(`Bài nâng cao: ${score}/100`)}

function renderOpenTasks(c,type){const arr=L[type];const rules=RULES[type];const isAdv=type==='advanced';c.innerHTML=intro(isAdv?'Bài nâng cao':'Bài vận dụng',isAdv?'Sửa lỗi, viết lại và case nâng cao. Có chấm tự động theo rubric.':'Bài viết/hội thoại có nút Chấm bài. Điểm là điểm luyện tập tự động, không phải điểm giáo viên.','<button class="btn" onclick="window.print()">In phần này</button><button class="btn primary" id="gradeAll">Chấm toàn bộ</button>')+`<div class="overall"></div><div class="task-list" id="tasks"></div><div id="overallScore" style="margin-top:14px"></div>`;const w=$('#tasks');arr.forEach((item,i)=>{const q=typeof item==='string'?item:item.q;const t=el('div','task');t.innerHTML=`<h3>${i+1}. ${q}</h3><textarea placeholder="Nhập câu trả lời bằng tiếng Trung..."></textarea><div class="actions" style="margin-top:9px"><button class="btn save">Lưu</button><button class="btn primary grade">Chấm bài</button>${isAdv?'<button class="btn soft hintbtn">Gợi ý / đáp án mẫu</button>':''}</div><div class="grader"></div>${isAdv?`<div class="hintbox"><b>Gợi ý:</b> ${item.hint}<br><b>Mẫu:</b> ${item.sample}</div>`:''}`;const ta=t.querySelector('textarea');ta.value=localStorage.getItem(taskKey(type,i))||'';t.querySelector('.save').onclick=()=>{localStorage.setItem(taskKey(type,i),ta.value);toast('Đã lưu bài trên trình duyệt')};t.querySelector('.grade').onclick=()=>{localStorage.setItem(taskKey(type,i),ta.value);const res=gradeText(ta.value,rules[i]);const box=t.querySelector('.grader');box.innerHTML=gradeBlockHTML(res);box.classList.add('show');bump(true)};if(isAdv)t.querySelector('.hintbtn').onclick=()=>t.querySelector('.hintbox').classList.toggle('show');w.appendChild(t)});$('#gradeAll').onclick=()=>{let sum=0,n=0;[...w.children].forEach((t,i)=>{const ta=t.querySelector('textarea'),res=gradeText(ta.value,rules[i]);localStorage.setItem(taskKey(type,i),ta.value);const box=t.querySelector('.grader');box.innerHTML=gradeBlockHTML(res);box.classList.add('show');sum+=res.score;n++});$('#overallScore').innerHTML=`<div class="score">Điểm trung bình phần ${isAdv?'Nâng cao':'Vận dụng'}: ${Math.round(sum/n)}/100</div>`;bump(true)}}
init();
</script></body></html>
