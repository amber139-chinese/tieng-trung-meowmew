<script>const DATA={"title":"生活的味道","vi":"Mùi vị của cuộc sống","theme":"Đời sống · thuê nhà · giao tiếp · văn hóa","vocab":[["学期","xuéqī","học kỳ"],["出生","chūshēng","ra đời, sinh ra"],["性别","xìngbié","giới tính"],["道歉","dàoqiàn","xin lỗi"],["打印","dǎyìn","in"],["复印","fùyìn","photocopy, sao chụp"],["饺子","jiǎozi","bánh chẻo"],["刀","dāo","dao"],["破","pò","rách, vỡ, bị hỏng"],["脱","tuō","cởi"],["理发","lǐfà","cắt tóc"],["包子","bāozi","bánh bao"],["零钱","língqián","tiền lẻ"],["打招呼","dǎzhāohu","chào hỏi"],["戴","dài","đeo, đội"],["眼镜","yǎnjìng","kính mắt"],["舞蹈","wǔdǎo","điệu múa"],["国籍","guójí","quốc tịch"],["抬","tái","giơ, nâng lên"],["胳膊","gēbo","cánh tay"],["转","zhuǎn","quay, xoay"],["租","zū","thuê, cho thuê"],["吵","chǎo","ồn ào, cãi"],["厨房","chúfáng","bếp"],["房东","fángdōng","chủ nhà"],["占线","zhànxiàn","máy bận, đường dây bận"],["功夫","gōngfu","võ thuật, công phu"],["乒乓球","pīngpāngqiú","bóng bàn"],["羽毛球","yǔmáoqiú","cầu lông"],["场","chǎng","lượng từ trận/sân"],["禁止","jìnzhǐ","cấm"],["座位","zuòwèi","chỗ ngồi"]],"grammar":[["疑问代词表示任指","<div class=\"g-lead\">Đại từ nghi vấn có thể không phải câu hỏi mà mang nghĩa “bất kỳ/ai cũng…”.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Mẫu: 谁都…… / 什么都…… / 哪儿也…… / 怎么都……</div><div>• Thường kết hợp 都 hoặc 也.</div><div>• Trong phủ định: 谁也不…… = không ai…</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>谁都可以参加这个活动。</b><span>Ai cũng có thể tham gia hoạt động này.</span></div><div class=\"g-line\"><b>我什么都想尝一尝。</b><span>Tôi món gì cũng muốn thử.</span></div><div class=\"g-line\"><b>周末我哪儿也不想去。</b><span>Cuối tuần tôi không muốn đi đâu cả.</span></div></div>"],["上（趋向/结果补语）","<div class=\"g-lead\">上 sau động từ có nhiều nghĩa mở rộng tùy động từ.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Ví dụ: 穿上、关上、戴上 = gắn/đóng lên; 爱上 = bắt đầu yêu; 考上 = thi đỗ vào.</div><div>• Nghĩa không còn đơn thuần là “đi lên”.</div><div>• Cần học theo cụm động từ cố định.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>天气冷了，快穿上外套。</b><span>Trời lạnh rồi, mau mặc áo khoác vào.</span></div><div class=\"g-line\"><b>请把门关上。</b><span>Hãy đóng cửa lại.</span></div><div class=\"g-line\"><b>他终于考上了理想的大学。</b><span>Cuối cùng anh ấy thi đỗ trường đại học mơ ước.</span></div></div>"],["出来","<div class=\"g-lead\">出来 sau động từ có thể là chuyển động ra ngoài hoặc kết quả trở nên nhận biết được.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Nghĩa không gian: 走出来、拿出来.</div><div>• Nghĩa nhận biết: 看出来、听出来、认出来.</div><div>• Nghĩa tạo ra: 想出来、说出来.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>我一眼就认出来他了。</b><span>Tôi nhận ra anh ấy ngay lập tức.</span></div><div class=\"g-line\"><b>你能看出来这两张照片有什么不同吗？</b><span>Bạn nhìn ra hai bức ảnh khác gì nhau không?</span></div><div class=\"g-line\"><b>我们终于想出来一个办法。</b><span>Cuối cùng chúng tôi nghĩ ra một cách.</span></div></div>"],["总的来说","<div class=\"g-lead\">总的来说 = nói chung/tổng thể mà nói, dùng khi tóm tắt nhiều khía cạnh.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Thường đứng đầu câu kết luận.</div><div>• Sau đó là đánh giá tổng hợp, có thể có 还是/比较…</div><div>• Trang trọng và rõ cấu trúc hơn 总之 trong một số ngữ cảnh.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>总的来说，这个房子很适合我们。</b><span>Nói chung căn nhà này phù hợp với chúng tôi.</span></div><div class=\"g-line\"><b>总的来说，这次活动很成功。</b><span>Nhìn chung hoạt động này thành công.</span></div><div class=\"g-line\"><b>总的来说，生活习惯需要慢慢适应。</b><span>Nói chung thói quen sinh hoạt cần dần thích nghi.</span></div></div>"],["在于","<div class=\"g-lead\">在于 = nằm ở/chính ở, dùng để nêu yếu tố quyết định.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Mẫu: 关键/原因/问题 + 在于 + N/V.</div><div>• Không phải 在 + địa điểm.</div><div>• Thường dùng trong lập luận và kết luận.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>成功的关键在于坚持。</b><span>Chìa khóa thành công nằm ở sự kiên trì.</span></div><div class=\"g-line\"><b>问题不在于钱，而在于时间。</b><span>Vấn đề không nằm ở tiền mà ở thời gian.</span></div><div class=\"g-line\"><b>生活的味道在于认真体验。</b><span>Hương vị cuộc sống nằm ở việc trải nghiệm nghiêm túc.</span></div></div>"]],"fills":[{"s":"Chọn từ phù hợp với nghĩa “học kỳ”: ____。","a":"学期","o":["打招呼","胳膊","刀","学期"]},{"s":"Chọn từ phù hợp với nghĩa “ra đời, sinh ra”: ____。","a":"出生","o":["转","戴","破","出生"]},{"s":"Chọn từ phù hợp với nghĩa “giới tính”: ____。","a":"性别","o":["眼镜","脱","租","性别"]},{"s":"Chọn từ phù hợp với nghĩa “xin lỗi”: ____。","a":"道歉","o":["舞蹈","道歉","吵","理发"]},{"s":"Chọn từ phù hợp với nghĩa “in”: ____。","a":"打印","o":["国籍","打印","包子","厨房"]},{"s":"Chọn từ phù hợp với nghĩa “photocopy, sao chụp”: ____。","a":"复印","o":["零钱","房东","抬","复印"]},{"s":"Chọn từ phù hợp với nghĩa “bánh chẻo”: ____。","a":"饺子","o":["胳膊","饺子","占线","打招呼"]},{"s":"Chọn từ phù hợp với nghĩa “dao”: ____。","a":"刀","o":["转","功夫","刀","戴"]},{"s":"Chọn từ phù hợp với nghĩa “rách, vỡ, bị hỏng”: ____。","a":"破","o":["破","乒乓球","租","眼镜"]},{"s":"Chọn từ phù hợp với nghĩa “cởi”: ____。","a":"脱","o":["舞蹈","羽毛球","脱","吵"]}],"grammarQuiz":[{"q":"这个活动____都可以参加。","o":["谁","上","出来","在于"],"a":0,"e":"疑问代词表示任指: dùng 谁/什么/哪/怎么… với 都/也 để chỉ bất kỳ."},{"q":"天气冷了，快穿____外套。","o":["上","出来","在于","总的来说"],"a":0,"e":"上（趋向/结果补语）: sau động từ biểu thị gắn lên, đóng lại, đạt được hoặc bắt đầu quan hệ/trạng thái."},{"q":"我终于想____一个好办法。","o":["出来","上","在于","谁"],"a":0,"e":"出来: bổ ngữ xu hướng “ra” và nghĩa mở rộng nhận ra/bộc lộ."},{"q":"____，这个房子虽然有点儿小，但是很方便。","o":["总的来说","出来","上","在于"],"a":0,"e":"总的来说: mở đầu kết luận/tổng quát hóa."},{"q":"成功的关键____坚持。","o":["在于","出来","上","谁"],"a":0,"e":"在于: chỉ mấu chốt/nguyên nhân nằm ở đâu."}],"apply":["Viết 100–120 chữ: 介绍你现在住的地方以及你喜欢/不喜欢的地方。Dùng 租、房东、厨房、吵、总的来说.","Viết 100–130 chữ: 写一次你和别人发生误会后解决问题的经历。Dùng 道歉、打招呼、出来、在于、谁都/什么都.","Viết 110–140 chữ: 你觉得‘生活的味道’是什么？结合饮食、运动或朋友谈谈。Dùng 饺子/包子、场、座位、上、出来."],"advanced":[{"q":"Viết 3 câu riêng, lần lượt dùng 疑问代词表示任指、上（趋向/结果补语）、出来.","hint":"Mỗi câu cần thể hiện đúng chức năng ngữ ph function shuffleStaticQuestion(q){
  if(!q || !Array.isArray(q.o) || !q.o.length) return;
  const numericAnswer = typeof q.a === 'number';
  const correct = numericAnswer ? q.o[q.a] : q.a;
  q.o = shuffle(q.o);
  if(numericAnswer) q.a = q.o.indexOf(correct);
}

function randomizeSequenceQuestion(q){
  if(!q || !Array.isArray(q.items) || q.items.length < 2 || !Array.isArray(q.o) || typeof q.a !== 'number') return;

  // Lưu nhãn cũ (A/B/C...) và phần nội dung thực tế.
  const original = q.items.map((item, index) => {
    const m = String(item).match(/^\s*([A-Z])\.\s*(.*)$/);
    return {
      oldLabel: m ? m[1] : String.fromCharCode(65 + index),
      text: m ? m[2] : String(item)
    };
  });

  const correctOriginal = String(q.o[q.a] || '');
  const letters = original.map(x => x.oldLabel);

  // Xáo các mệnh đề; tránh để thứ tự đúng vẫn rơi vào A → B → C.
  let shuffledItems, mapping, transformedCorrect;
  let attempts = 0;

  do {
    shuffledItems = shuffle(original);
    mapping = {};
    shuffledItems.forEach((item, newIndex) => {
      mapping[item.oldLabel] = String.fromCharCode(65 + newIndex);
    });

    transformedCorrect = correctOriginal.replace(/[A-Z]/g, ch => mapping[ch] || ch);
    attempts++;
  } while (
    normalizeSequenceText(transformedCorrect) === 'ABC' &&
    attempts < 20
  );

  // Gắn lại nhãn A/B/C theo thứ tự HIỂN THỊ mới.
  q.items = shuffledItems.map((item, newIndex) =>
    `${String.fromCharCode(65 + newIndex)}. ${item.text}`
  );

  // Đổi toàn bộ phương án A→B→C... sang hệ nhãn mới.
  q.o = q.o.map(option =>
    String(option).replace(/[A-Z]/g, ch => mapping[ch] || ch)
  );
}

function normalizeSequenceText(s){
  return String(s || '').replace(/[^A-Z]/g, '');
}

function randomizeStaticAnswers(){
  (L.fills || []).forEach(shuffleStaticQuestion);
  (L.grammarQuiz || []).forEach(shuffleStaticQuestion);

  if(typeof ADV_DATA !== 'undefined' && ADV_DATA){
    (ADV_DATA.mcq || []).forEach(shuffleStaticQuestion);

    // Phần ③ Sắp xếp trình tự:
    // 1) xáo chính các mệnh đề A/B/C,
    // 2) đổi đáp án đúng tương ứng,
    // 3) tiếp tục xáo vị trí 4 lựa chọn.
    (ADV_DATA.sequence || []).forEach(q => {
      randomizeSequenceQuestion(q);
      shuffleStaticQuestion(q);
    });

    (ADV_DATA.error || []).forEach(shuffleStaticQuestion);
    (ADV_DATA.reading || []).forEach(r => (r.qs || []).forEach(shuffleStaticQuestion));
  }
}
randomizeStaticAnswers();

function cleanText(t){return (t||'').replace(/\r/g,'').trim()}
function countHanzi(t){return (t.match(/[\u3400-\u9fff]/g)||[]).length}
function countLines(t){return t.split(/\n+/).map(x=>x.trim()).filter(Boolean).length}
function countSentences(t){const p=(t.match(/[。！？!?；;]/g)||[]).length;return Math.max(p,countLines(t))}
function timeMarkers(t){return (t.match(/(?:\d{1,2}[:：点时]|上午|下午|早上|晚上|中午|星期|周[一二三四五六日天]|今天|明天|后天)/g)||[]).length}
function numberMarkers(t){return (t.match(/\d+(?:\.\d+)?|[一二两三四五六七八九十百千万]+块?/g)||[]).length}
function discountCount(t){const a=t.match(/\d+(?:\.\d+)?折|[一二三四五六七八九十]+折|百分之\s*\d+/g)||[];return new Set(a).size}
function evalCriterion(c,t){let ratio=0,detail='';const han=countHanzi(t);if(c.type==='hanzi_length'){if(han>=c.min&&han<=c.max)ratio=1;else if(han>0){const dist=han<c.min?c.min-han:han-c.max;ratio=Math.max(0,1-dist/Math.max(20,c.max-c.min+20))}detail=`${han} chữ Hán`}
else if(c.type==='hanzi_min'){ratio=Math.min(1,han/c.min);detail=`${han}/${c.min} chữ Hán`}
else if(c.type==='line_count'){const n=countLines(t);ratio=n>=c.min&&(!c.max||n<=c.max)?1:Math.min(1,n/c.min);if(c.max&&n>c.max)ratio=Math.max(.7,1-(n-c.max)*.08);detail=`${n} lượt/dòng`}
else if(c.type==='sentence_count'){const n=countSentences(t);ratio=n>=c.min&&(!c.max||n<=c.max)?1:Math.min(1,n/c.min);if(c.max&&n>c.max)ratio=Math.max(.75,1-(n-c.max)*.05);detail=`${n} câu/ý`}
else if(c.type==='punctuation'){const n=countSentences(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} câu/ý`}
else if(c.type==='keywords'){const base=c.words||[];const hits=base.filter(w=>t.includes(w));let extra=0;if(c.anyWords&&c.anyWords.some(w=>t.includes(w)))extra=1;const need=c.min||base.length;const got=hits.length+extra;ratio=Math.min(1,got/need);const miss=base.filter(w=>!t.includes(w));detail=`đạt ${got}/${need}${miss.length?' · thiếu: '+miss.slice(0,5).join('、'):''}${c.anyWords&&!extra?' · cần một trong: '+c.anyWords.join('/') : ''}`}
else if(c.type==='vocab_hits'){const words=L.vocab.map(x=>x[0]);const hits=words.filter(w=>t.includes(w));ratio=Math.min(1,hits.length/c.min);detail=`${hits.length}/${c.min} từ: ${hits.slice(0,8).join('、')||'chưa có'}`}
else if(c.type==='combo'){const ok=(c.groups||[]).some(g=>g.every(w=>t.includes(w)));ratio=ok?1:0;detail=ok?'đã dùng':'chưa thấy cấu trúc yêu cầu'}
else if(c.type==='forbidden'){const bad=(c.words||[]).filter(w=>t.includes(w));ratio=bad.length?0:1;detail=bad.length?'còn lỗi: '+bad.join('、'):'không còn lỗi mục tiêu'}
else if(c.type==='time_markers'){const n=timeMarkers(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} mốc thời gian`}
else if(c.type==='number_markers'){const n=numberMarkers(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} số/giá`}
else if(c.type==='discount_count'){const n=discountCount(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} mức ưu đãi`}
else if(c.type==='speaker_lines'){const n=t.split(/\n+/).filter(x=>/[：:]/.test(x)).length;ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} dòng có người nói`}

html+=`<section class="adv-section"><div class="adv-section-head"><div><h3>⑤ Đọc hiểu mini</h3><div class="desc">Đọc đoạn ngắn mới, sau đó trả lời 3 câu.</div></div><div class="adv-num">15đ</div></div>`;A.reading.forEach((r,ri)=>{html+=`<div class="reading-text">${r.text}</div>`;r.qs.forEach((q,qi)=>{const key=`reading-${ri}-${qi}`;html+=`<div class="adv-card" data-cardkey="${key}"><div class="adv-q">${n++}. ${q.q}</div>${advChoiceHTML(q,key)}</div>`})});html+=`</section></div><div class="adv-scorebar"><div><div class="scoretxt" id="advScore">Chưa chấm · 20 câu / 100 điểm</div><div style="font-size:12px;color:var(--muted)">Đáp án và giải thích hiện sau khi chấm.</div></div><div class="actions"><button class="btn" id="resetAdv2">Làm lại</button><button class="btn primary" id="gradeAdv2">Chấm toàn bộ</button></div></div>`;c.innerHTML=html;bindAdvOptions();bindOrderCards();$('#resetAdv').onclick=$('#resetAdv2').onclick=()=>{state.advChoice={};renderAdvanced(c);toast('Đã làm mới bài nâng cao')};$('#gradeAdv').onclick=$('#gradeAdv2').onclick=()=>gradeAdvanced(c)}
function gradeChoiceQuestion(q,key){const chosen=state.advChoice[key];const card=document.querySelector(`[data-cardkey="${key}"]`);const opts=card?card.querySelectorAll('.adv-opt'):[];opts.forEach(x=>x.classList.remove('good','bad'));if(opts[q.a])opts[q.a].classList.add('good');if(chosen!==undefined&&chosen!==q.a&&opts[chosen])opts[chosen].classList.add('bad');const ok=chosen===q.a;card?.classList.remove('unanswered','correct','incorrect');card?.classList.add(chosen===undefined?'unanswered':ok?'correct':'incorrect');const fb=card?.querySelector('.adv-feedback');if(fb){fb.classList.add('show');fb.innerHTML=chosen===undefined?`⚠ Chưa chọn đáp án. Đáp án đúng: <b>${String.fromCharCode(65+q.a)}</b>. ${q.e}`:`${ok?'✓ Đúng':'✗ Chưa đúng'} · Đáp án: <b>${String.fromCharCode(65+q.a)}</b>. ${q.e}`};return ok?1:0}
function gradeAdvanced(c){const A=ADV_DATA;let correct=0,total=0;A.mcq.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`mcq-${i}`)});A.reorder.forEach((q,i)=>{total++;const card=document.querySelector(`#adv-reorder-${i}`),ans=card.querySelector('.order-answer'),txt=[...ans.querySelectorAll('.word-chip')].map(x=>x.textContent).join('');const ok=normalizeAdv(txt)===normalizeAdv(q.answer);ans.classList.remove('good','bad');ans.classList.add(ok?'good':'bad');card.classList.remove('unanswered','correct','incorrect');card.classList.add(!txt?'unanswered':ok?'correct':'incorrect');const fb=card.querySelector('.adv-feedback');fb.classList.add('show');fb.innerHTML=!txt?`⚠ Chưa sắp xếp. Đáp án: <b>${q.answer}。</b> ${q.e}`:`${ok?'✓ Đúng':'✗ Chưa đúng'} · Đáp án: <b>${q.answer}。</b> ${q.e}`;if(ok)correct++});A.sequence.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`sequence-${i}`)});A.error.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`error-${i}`)});A.reading.forEach((r,ri)=>r.qs.forEach((q,qi)=>{total++;correct+=gradeChoiceQuestion(q,`reading-${ri}-${qi}`)}));const score=Math.round(correct/total*100),verdict=score>=90?'Xuất sắc':score>=80?'Rất tốt':score>=70?'Đạt':score>=50?'Cần ôn thêm':'Nên làm lại';$('#advScore').textContent=`${score}/100 · ${correct}/${total} câu đúng · ${verdict}`;bump(true);toast(`Bài nâng cao: ${score}/100`)}

function renderOpenTasks(c,type){
  const arr=L[type];
  const rules=RULES[type];
  const isAdv=type==='advanced';

  if(!isAdv){
    c.innerHTML=intro(
      'Bài vận dụng · AI chấm bài',
      '',
      '<button class="btn" onclick="window.print()">In phần này</button>'
    )+`<div class="task-list" id="tasks"></div>`;

    const w=$('#tasks');
    arr.forEach((item,i)=>{
      const q=typeof item==='string'?item:item.q;
      const t=el('div','task');
      t.setAttribute('data-ai-writing','');
      t.innerHTML=`<h3>${i+1}. ${q}</h3>
        <textarea class="writing-answer" placeholder="Nhập bài viết bằng tiếng Trung..."></textarea>
        <div class="actions" style="margin-top:9px">
          <button class="btn save">Lưu</button>
          <button class="btn primary ai-grade-btn">Gửi AI chấm bài</button>
        </div>
        <div class="ai-result"></div>`;
      const ta=t.querySelector('textarea');
      ta.value=localStorage.getItem(taskKey(type,i))||'';
      t.querySelector('.save').onclick=()=>{
        localStorage.setItem(taskKey(type,i),ta.value);
        toast('Đã lưu bài trên trình duyệt');
      };
      w.appendChild(t);
    });
    return;
  }

  c.innerHTML=intro(
    'Bài nâng cao',
    'Sửa lỗi, viết lại và case nâng cao. Phần này vẫn giữ chấm tự động theo rubric nội bộ của bài học.',
    '<button class="btn" onclick="window.print()">In phần này</button><button class="btn primary" id="gradeAll">Chấm toàn bộ</button>'
  )+`<div class="overall"></div><div class="task-list" id="tasks"></div><div id="overallScore" style="margin-top:14px"></div>`;

  const w=$('#tasks');
  arr.forEach((item,i)=>{
    const q=typeof item==='string'?item:item.q;
    const t=el('div','task');
    t.innerHTML=`<h3>${i+1}. ${q}</h3><textarea placeholder="Nhập câu trả lời bằng tiếng Trung..."></textarea><div class="actions" style="margin-top:9px"><button class="btn save">Lưu</button><button class="btn primary grade">Chấm bài</button><button class="btn soft hintbtn">Gợi ý / đáp án mẫu</button></div><div class="grader"></div><div class="hintbox"><b>Gợi ý:</b> ${item.hint}<br><b>Mẫu:</b> ${item.sample}</div>`;
    const ta=t.querySelector('textarea');
    ta.value=localStorage.getItem(taskKey(type,i))||'';
    t.querySelector('.save').onclick=()=>{
      localStorage.setItem(taskKey(type,i),ta.value);
      toast('Đã lưu bài trên trình duyệt');
    };
    t.querySelector('.grade').onclick=()=>{
      localStorage.setItem(taskKey(type,i),ta.value);
      const res=gradeText(ta.value,rules[i]);
      const box=t.querySelector('.grader');
      box.innerHTML=gradeBlockHTML(res);
      box.classList.add('show');
      bump(true);
    };
    t.querySelector('.hintbtn').onclick=()=>t.querySelector('.hintbox').classList.toggle('show');
    w.appendChild(t);
  });

  $('#gradeAll').onclick=()=>{
    let sum=0,n=0;
    [...w.children].forEach((t,i)=>{
      const ta=t.querySelector('textarea'),res=gradeText(ta.value,rules[i]);
      localStorage.setItem(taskKey(type,i),ta.value);
      const box=t.querySelector('.grader');
      box.innerHTML=gradeBlockHTML(res);
      box.classList.add('show');
      sum+=res.score;n++;
    });
    $('#overallScore').innerHTML=`<div class="score">Điểm trung bình phần Nâng cao: ${Math.round(sum/n)}/100</div>`;
    bump(true);
  };
}
