<script>const DATA={"title":"真正的朋友","vi":"Người bạn chân chính","theme":"","vocab":[["适应","shìyìng","thích nghi"],["交","jiāo","kết giao; giao/nộp"],["平时","píngshí","ngày thường, bình thường"],["逛","guàng","đi dạo, đi mua sắm"],["短信","duǎnxìn","tin nhắn"],["正好","zhènghǎo","vừa đúng, đúng lúc"],["聚会","jùhuì","tụ họp, buổi họp mặt"],["联系","liánxì","liên hệ"],["差不多","chàbuduō","gần như, xấp xỉ, gần giống"],["专门","zhuānmén","đặc biệt, riêng để"],["毕业","bìyè","tốt nghiệp"],["麻烦","máfan","phiền, làm phiền"],["好像","hǎoxiàng","dường như, giống như"],["重新","chóngxīn","lại, làm lại"],["尽管","jǐnguǎn","mặc dù; cứ việc"],["真正","zhēnzhèng","chân chính, thực sự"],["友谊","yǒuyì","tình bạn"],["丰富","fēngfù","phong phú; làm phong phú"],["无聊","wúliáo","nhàm chán"],["讨厌","tǎoyàn","ghét, không thích"],["却","què","nhưng, lại"],["周围","zhōuwéi","xung quanh"],["交流","jiāoliú","giao lưu, trao đổi"],["理解","lǐjiě","hiểu, thấu hiểu"],["镜子","jìngzi","gương"],["而","ér","mà, trong khi đó"],["当","dāng","khi"],["困难","kùnnan","khó khăn"],["及时","jíshí","kịp thời"],["陪","péi","đi cùng, ở bên"]],"grammar":[["交","<div class=\"g-lead\">交 là động từ đa nghĩa. Trong bài cần phân biệt “nộp/giao/trả” và “kết giao”.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• 交作业 / 交水费 / 交给警察.</div><div>• <b>交朋友</b> = kết bạn.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>老师说明天要交作业。</b><span>Giáo viên nói ngày mai phải nộp bài tập.</span></div><div class=\"g-line\"><b>这个月的水费你交了吗？</b><span>Tiền nước tháng này bạn nộp chưa?</span></div><div class=\"g-line\"><b>最近我新交了一个中国朋友。</b><span>Gần đây tôi mới kết bạn với một người Trung Quốc.</span></div></div>"],["正好","<div class=\"g-lead\">正好 có thể diễn tả “vừa đúng, vừa vặn, đúng lúc”, khi thời gian/số lượng/vị trí/mức độ vừa thỏa điều kiện.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>正好 + V</b> hoặc <b>数量正好</b>.</div><div>• Dùng khi người nói thấy một điều kiện vừa khớp.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>我们四个人正好打一辆出租车。</b><span>Bốn người chúng tôi vừa đúng đi một chiếc taxi.</span></div><div class=\"g-line\"><b>你来得正好，我正想找你。</b><span>Bạn đến đúng lúc, tôi đang muốn tìm bạn.</span></div></div>"],["差不多","<div class=\"g-lead\">差不多 có hai cách dùng quan trọng: tính từ “gần giống nhau” và phó từ “xấp xỉ/gần như”.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Tính từ làm vị ngữ: <b>A 跟 B 差不多</b>.</div><div>• Phó từ trước số lượng/mức độ: <b>差不多 + số lượng / cấu trúc so sánh</b>.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>姐妹俩性格差不多。</b><span>Tính cách hai chị em khá giống nhau.</span></div><div class=\"g-line\"><b>差不多一半儿吧。</b><span>Khoảng một nửa.</span></div><div class=\"g-line\"><b>她差不多跟我一样高了。</b><span>Cô ấy gần cao bằng tôi rồi.</span></div></div>"],["差不多 / 几乎","<div class=\"g-lead\">Cả hai đều có thể mang nghĩa “gần như”, nhưng phạm vi dùng không hoàn toàn giống nhau.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• 差不多 có thể làm tính từ/vị ngữ: 姐妹俩性格差不多.</div><div>• 几乎 không làm vị ngữ kiểu đó; thường làm phó từ.</div><div>• 几乎 còn có thể diễn tả một việc suýt xảy ra nhưng cuối cùng không xảy ra.</div></div><div class=\"g-note\"><b>Lưu ý</b><div>• Với tính từ đơn âm tiết: 他们俩差不多高; dùng 几乎 thường cần 一样: 他们俩几乎一样高.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>他汉语说得很好，差不多/几乎跟中国人一样。</b><span>Tiếng Trung của anh ấy rất tốt, gần như người Trung Quốc.</span></div><div class=\"g-line\"><b>这件事我几乎忘了告诉你。</b><span>Việc này tôi suýt quên nói với bạn.</span></div><div class=\"g-line\"><b>他们俩差不多高。</b><span>Hai người họ cao gần bằng nhau.</span></div></div>"],["毕业","<div class=\"g-lead\">毕业 là động từ “tốt nghiệp”. PDF nhấn mạnh trật tự kết hợp với tên trường/cấp học.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Nói <b>小学毕业 / 大学毕业</b> hoặc <b>从……毕业</b>.</div><div>• Không dùng kiểu <s>毕业大学</s> trong cách nói thông thường.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>我大学毕业以后去了上海。</b><span>Sau khi tốt nghiệp đại học tôi đến Thượng Hải.</span></div><div class=\"g-line\"><b>她从北京大学毕业。</b><span>Cô ấy tốt nghiệp Đại học Bắc Kinh.</span></div></div>"],["尽管……但是／却……","<div class=\"g-lead\">尽管 ở vế đầu đưa ra một sự thật nhượng bộ; vế sau nêu kết quả trái với điều có thể dự đoán.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>尽管 A，但是/可是/却/还是 B</b>.</div><div>• 却 thường đứng trước vị ngữ ở vế sau.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>尽管汉语比较难，但是我很喜欢。</b><span>Mặc dù tiếng Trung khá khó, tôi vẫn rất thích.</span></div><div class=\"g-line\"><b>尽管工作很忙，她却每天坚持锻炼。</b><span>Mặc dù công việc bận, cô ấy vẫn kiên trì tập luyện mỗi ngày.</span></div></div>"],["尽管 + V：cứ việc","<div class=\"g-lead\">Ngoài nghĩa “mặc dù”, 尽管 còn có thể đứng trước động từ với nghĩa “cứ việc/cứ thoải mái”.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>尽管 + V</b>, thường mang sắc thái cho phép hoặc khuyến khích.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>有什么事儿你尽管说吧。</b><span>Có việc gì bạn cứ nói.</span></div><div class=\"g-line\"><b>这些东西你尽管吃，千万别客气！</b><span>Mấy món này bạn cứ ăn thoải mái, đừng khách sáo!</span></div></div>"],["一……就……","<div class=\"g-lead\">Biểu thị hai hành động xảy ra nối tiếp rất nhanh: “vừa… thì / hễ… là…”.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>一 + V1，就 + V2</b>.</div><div>• Chủ ngữ có thể đặt trước 一; nếu hai vế khác chủ ngữ, cần đặt đúng vị trí cho rõ nghĩa.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>我每天下班就回家。</b><span>Mỗi ngày tan làm là tôi về nhà.</span></div><div class=\"g-line\"><b>他们一下飞机就打车去酒店。</b><span>Họ vừa xuống máy bay là bắt taxi đến khách sạn.</span></div><div class=\"g-line\"><b>一看到这张照片，我就想起过去。</b><span>Vừa nhìn thấy tấm ảnh này tôi liền nhớ lại quá khứ.</span></div></div>"],["一定……吧？","<div class=\"g-lead\">一定 + 吧? thể hiện suy đoán có mức độ chắc chắn khá cao và muốn người nghe xác nhận.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>S + 一定 + vị ngữ + 吧？</b></div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>你今天穿得这么帅，一定有约会吧？</b><span>Hôm nay bạn ăn mặc đẹp thế, chắc có hẹn nhỉ?</span></div><div class=\"g-line\"><b>这个包这么漂亮，一定很贵吧？</b><span>Cái túi đẹp thế này chắc đắt lắm nhỉ?</span></div></div>"],["丰富：tính từ / động từ","<div class=\"g-lead\">丰富 vừa là tính từ “phong phú” vừa là động từ “làm phong phú”.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Tính từ: 经验丰富、知识丰富.</div><div>• Động từ: 丰富生活、丰富经历、丰富知识.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>他的工作经验很丰富。</b><span>Kinh nghiệm làm việc của anh ấy rất phong phú.</span></div><div class=\"g-line\"><b>朋友可以丰富我们的生活。</b><span>Bạn bè có thể làm phong phú cuộc sống của chúng ta.</span></div></div>"],["却","<div class=\"g-lead\">却 là phó từ chuyển ý, thường làm nổi bật kết quả trái với điều được mong đợi ở vế trước.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Thường đứng <b>trước động từ/tính từ vị ngữ</b>.</div><div>• Hay phối hợp với 虽然、尽管 hoặc đứng độc lập trong câu đối lập.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>我等了很久，他却没来。</b><span>Tôi đợi rất lâu nhưng anh ấy lại không đến.</span></div><div class=\"g-line\"><b>尽管是第一次见面，他们却很快成了朋友。</b><span>Dù là lần đầu gặp, họ lại nhanh chóng trở thành bạn.</span></div></div>"],["而","<div class=\"g-lead\">而 là liên từ nối hai thành phần hoặc hai vế. Trong bài có cả quan hệ đồng đẳng và chuyển ý/đối chiếu.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Đồng đẳng/đối chiếu: A，而 B.</div><div>• Thường dùng trong văn viết hoặc câu có tính khái quát.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>左边的“日”是太阳，而右边的“月”是月亮。</b><span>Bên trái chữ 日 là mặt trời, còn bên phải chữ 月 là mặt trăng.</span></div><div class=\"g-line\"><b>男人不喜欢说，而女人喜欢跟丈夫说。</b><span>Đàn ông không thích nói ra, còn phụ nữ thích nói với chồng.</span></div></div>"],["当……的时候","<div class=\"g-lead\">Cấu trúc thời gian “khi…”. 当 dẫn vào hoàn cảnh/thời điểm, 的时候 đánh dấu mốc thời gian.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>当 + mệnh đề + 的时候，mệnh đề chính</b>.</div><div>• Trong khẩu ngữ, đôi lúc 当 có thể lược nhưng 的时候 vẫn giữ.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>当我还是个孩子的时候，经常去河里游泳。</b><span>Khi tôi còn là trẻ con, tôi thường ra sông bơi.</span></div><div class=\"g-line\"><b>当你遇到困难的时候，真正的朋友会帮助你。</b><span>Khi bạn gặp khó khăn, người bạn thật sự sẽ giúp bạn.</span></div></div>"]],"fills":[{"s":"刚搬到这里的时候我很不____，过了两个月就习惯了。","a":"适应","o":["适应","联系","毕业","理解"]},{"s":"我在运动俱乐部新____了几个朋友。","a":"交","o":["交","逛","陪","毕业"]},{"s":"我们____常常一起吃饭、运动，有时候也去逛街。","a":"平时","o":["平时","专门","重新","及时"]},{"s":"我正想给你打电话，你就来了，来得____。","a":"正好","o":["正好","差不多","好像","真正"]},{"s":"毕业以后我们一直保持____，每个月都会聊几次。","a":"联系","o":["联系","镜子","周围","困难"]},{"s":"____工作很忙，他____会参加老同学的聚会。","a":"尽管 / 却","o":["尽管 / 却","一 / 就","正好 / 吧","当 / 的时候"]},{"s":"朋友之间要多____，这样才能更了解对方。","a":"交流","o":["交流","讨厌","无聊","麻烦"]},{"s":"当我遇到____的时候，她总会及时出现并____我。","a":"困难 / 陪","o":["困难 / 陪","周围 / 逛","友谊 / 交","镜子 / 毕业"]}],"grammarQuiz":[{"q":"“最近我新____了一个中国朋友。”","o":["交","毕业","逛","陪"],"a":0,"e":"交朋友 = kết bạn."},{"q":"Câu nào dùng 正好 tự nhiên nhất?","o":["我有两张票，正好我们一起去。","我正好很朋友。","正好我毕业得。","他正好地交流。"],"a":0,"e":"正好 = đúng lúc/vừa đủ."},{"q":"Câu nào dùng 差不多 như tính từ?","o":["我们俩的性格差不多。","我差不多忘了带手机。","他差不多六十岁。","差不多有二十个人。"],"a":0,"e":"Ở câu A, 差不多 làm vị ngữ: hai tính cách gần giống nhau."},{"q":"Điền: ____下雨很大，他____按时来了。","o":["尽管 / 却","一 / 就","正好 / 吧","当 / 而"],"a":0,"e":"尽管……却…… biểu thị chuyển ý."},{"q":"Điền: 我____看到老照片，____想起大学时的朋友。","o":["一 / 就","尽管 / 却","正好 / 吧","当 / 而"],"a":0,"e":"一……就…… = ngay khi… thì…"},{"q":"“当你遇到困难的时候” dùng 当……的时候 để chỉ…","o":["thời điểm/tình huống","mức độ gần giống","suy đoán","số lượng vừa đủ"],"a":0,"e":"当……的时候 = khi…"}],"apply":["Viết hội thoại 8–10 lượt: Một người mới chuyển đến thành phố và kể về người bạn mới. Dùng ít nhất 6 từ: 适应、交、平时、逛、短信、正好、联系、交流、周围、无聊。","Viết 80–100 chữ: 你认为什么是真正的朋友？ Bắt buộc dùng 尽管……却……, 当……的时候 và ít nhất 5 từ mới Bài 2.","Viết tin nhắn 60–80 chữ mời một người bạn cũ gặp lại sau nhiều năm. Dùng 聚会、毕业、联系、重新、正好、友谊 và ít nhất một mốc thời gian."],"advanced":[{"q":"Sửa lỗi: 尽管他很忙，但是却他每天联系我。","hint":"却 đứng trước vị ngữ; không cần同时用 但是却 nếu muốn câu gọn.","sample":"尽管他很忙，他却每天联系我。"},{"q":"Viết lại bằng 一……就……: 我看到大学照片以后，马上想起以前的同学。","hint":"一 + động từ/cụm động từ + 就 + kết quả.","sample":"我一看到大学照片，就想起以前的同学。"},{"q":"Viết 60–80 chữ kể về một lần bạn bè giúp bạn lúc khó khăn. Dùng 当……的时候、及时、陪、理解、真正.","hint":"Nêu tình huống khó khăn → hành động của bạn → cảm nhận của bạn.","sample":"开放题：重点检查结构、词汇和内容是否完整。"}],"summary":"Bài 2 tập trung vào cách kết bạn, giữ liên lạc, tình bạn sau tốt nghiệp, giao tiếp, và phẩm chất của một người bạn chân chính khi ta gặp khó khăn."};const ADV_DATA={"mcq":[{"q":"刚到新城市时，他不太____这里的生活。","o":["适应","毕业","麻烦","联系"],"a":0,"e":"适应生活 = thích nghi với cuộc sống."},{"q":"我有两张电影票，____你也想看，我们一起去吧。","o":["正好","专门","重新","及时"],"a":0,"e":"正好 = đúng lúc/vừa hay."},{"q":"他们俩年龄和兴趣都____，所以很快成了朋友。","o":["差不多","无聊","讨厌","困难"],"a":0,"e":"差不多 = gần giống nhau."},{"q":"____毕业很多年，他们____一直保持联系。","o":["尽管 / 却","一 / 就","当 / 而","正好 / 吧"],"a":0,"e":"尽管……却…… diễn tả chuyển ý."},{"q":"朋友之间应该经常____，这样更容易互相理解。","o":["交流","毕业","逛","麻烦"],"a":0,"e":"交流 giúp hai bên hiểu nhau hơn."}],"reorder":[{"parts":["我","刚到这里时","很不适应","周围的环境"],"answer":"我刚到这里时很不适应周围的环境","e":"适应 + 环境/生活。"},{"parts":["我们","平时","常常","一起逛街","和运动"],"answer":"我们平时常常一起逛街和运动","e":"平时 thường đứng đầu/trước trạng ngữ tần suất."},{"parts":["毕业以后","我们","一直","保持联系"],"answer":"毕业以后我们一直保持联系","e":"毕业以后 + 持续动作。"},{"parts":["我","一看到","那张照片","就想起","大学生活"],"answer":"我一看到那张照片就想起大学生活","e":"一……就……。"},{"parts":["当我","遇到困难的时候","他","总会","及时帮助我"],"answer":"当我遇到困难的时候他总会及时帮助我","e":"当……的时候 + 主句。"}],"sequence":[{"q":"Sắp xếp cách kết bạn khi mới tới một thành phố:","items":["A. 参加活动认识周围的人","B. 主动交流并找到共同兴趣","C. 平时保持联系"],"o":["A → B → C","C → B → A","B → A → C const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function shuffleStaticQuestion(q){
  if(!q || !Array.isArray(q.o) || !q.o.length) return;
  const numericAnswer = typeof q.a === 'number';
  const correct = numericAnswer ? q.o[q.a] : q.a;
  q.o = shuffle(q.o);
  if(numericAnswer) q.a = q.o.indexOf(correct);
}

function randomizeSequenceQuestion(q){
  if(!q || !Array.isArray(q.items) || q.items.length < 2 || !Array.isArray(q.o) || typeof q.a !== 'number') return;

  // Lưu nhãn cũ (A/B/C...) và phần nội dung thực tế.
  const original = q.items.map((item, index) => {
    const m = String(item).match(/^\s*([A-Z])\.\s*(.*)$/);
    return {
      oldLabel: m ? m[1] : String.fromCharCode(65 + index),
      text: m ? m[2] : String(item)
    };
  });

  const correctOriginal = String(q.o[q.a] || '');
  const letters = original.map(x => x.oldLabel);

  // Xáo các mệnh đề; tránh để thứ tự đúng vẫn rơi vào A → B → C.
  let shuffledItems, mapping, transformedCorrect;
  let attempts = 0;

  do {
    shuffledItems = shuffle(original);
    mapping = {};
    shuffledItems.forEach((item, newIndex) => {
      mapping[item.oldLabel] = String.fromCharCode(65 + newIndex);
    });

    transformedCorrect = correctOriginal.replace(/[A-Z]/g, ch => mapping[ch] || ch);
    attempts++;
  } while (
    normalizeSequenceText(transformedCorrect) === 'ABC' &&
    attempts < 20
  );

  // Gắn lại nhãn A/B/C theo thứ tự HIỂN THỊ mới.
  q.items = shuffledItems.map((item, newIndex) =>
    `${String.fromCharCode(65 + newIndex)}. ${item.text}`
  );

  // Đổi toàn bộ phương án A→B→C... sang hệ nhãn mới.
  q.o = q.o.map(option =>
    String(option).replace(/[A-Z]/g, ch => mapping[ch] || ch)
  );
}

function normalizeSequenceText(s){
  return String(s || '').replace(/[^A-Z]/g, '');
}

function randomizeStaticAnswers(){
  (L.fills || []).forEach(shuffleStaticQuestion);
  (L.grammarQuiz || []).forEach(shuffleStaticQuestion);

  if(typeof ADV_DATA !== 'undefined' && ADV_DATA){
    (ADV_DATA.mcq || []).forEach(shuffleStaticQuestion);

    // Phần ③ Sắp xếp trình tự:
    // 1) xáo chính các mệnh đề A/B/C,
    // 2) đổi đáp án đúng tương ứng,
    // 3) tiếp tục xáo vị trí 4 lựa chọn.
    (ADV_DATA.sequence || []).forEach(q => {
      randomizeSequenceQuestion(q);
      shuffleStaticQuestion(q);
    });

    (ADV_DATA.error || []).forEach(shuffleStaticQuestion);
    (ADV_DATA.reading || []).forEach(r => (r.qs || []).forEach(shuffleStaticQuestion));
  }
}
randomizeStaticAnswers();

function taskKey(type,i){return `hsk4_bai${lesson}_${type}_${i}`}
function cleanText(t){return (t||'').replace(/\r/g,'').trim()}
function countHanzi(t){return (t.match(/[\u3400-\u9fff]/g)||[]).length}
function countLines(t){return t.split(/\n+/).map(x=>x.trim()).filter(Boolean).length}
function countSentences(t){const p=(t.match(/[。！？!?；;]/g)||[]).length;return Math.max(p,countLines(t))}
function timeMarkers(t){return (t.match(/(?:\d{1,2}[:：点时]|上午|下午|早上|晚上|中午|星期|周[一二三四五六日天]|今天|明天|后天)/g)||[]).length}
function numberMarkers(t){return (t.match(/\d+(?:\.\d+)?|[一二两三四五六七八九十百千万]+块?/g)||[]).length}
function discountCount(t){const a=t.match(/\d+(?:\.\d+)?折|[一二三四五六七八九十]+折|百分之\s*\d+/g)||[];return new Set(a).size}
function evalCriterion(c,t){let ratio=0,detail='';const han=countHanzi(t);if(c.type==='hanzi_length'){if(han>=c.min&&han<=c.max)ratio=1;else if(han>0){const dist=han<c.min?c.min-han:han-c.max;ratio=Math.max(0,1-dist/Math.max(20,c.max-c.min+20))}detail=`${han} chữ Hán`}
else if(c.type==='hanzi_min'){ratio=Math.min(1,han/c.min);detail=`${han}/${c.min} chữ Hán`}
else if(c.type==='line_count'){const n=countLines(t);ratio=n>=c.min&&(!c.max||n<=c.max)?1:Math.min(1,n/c.min);if(c.max&&n>c.max)ratio=Math.max(.7,1-(n-c.max)*.08);detail=`${n} lượt/dòng`}
else if(c.type==='sentence_count'){const n=countSentences(t);ratio=n>=c.min&&(!c.max||n<=c.max)?1:Math.min(1,n/c.min);if(c.max&&n>c.max)ratio=Math.max(.75,1-(n-c.max)*.05);detail=`${n} câu/ý`}
else if(c.type==='punctuation'){const n=countSentences(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} câu/ý`}
else if(c.type==='keywords'){const base=c.words||[];const hits=base.filter(w=>t.includes(w));let extra=0;if(c.anyWords&&c.anyWords.some(w=>t.includes(w)))extra=1;const need=c.min||base.length;const got=hits.length+extra;ratio=Math.min(1,got/need);const miss=base.filter(w=>!t.includes(w));detail=`đạt ${got}/${need}${miss.length?' · thiếu: '+miss.slice(0,5).join('、'):''}${c.anyWords&&!extra?' · cần một trong: '+c.anyWords.join('/') : ''}`}
else if(c.type==='vocab_hits'){const words=L.vocab.map(x=>x[0]);const hits=words.filter(w=>t.includes(w));ratio=Math.min(1,hits.length/c.min);detail=`${hits.length}/${c.min} từ: ${hits.slice(0,8).join('、')||'chưa có'}`}
else if(c.type==='combo'){const ok=(c.groups||[]).some(g=>g.every(w=>t.includes(w)));ratio=ok?1:0;detail=ok?'đã dùng':'chưa thấy cấu trúc yêu cầu'}
else if(c.type==='forbidden'){const bad=(c.words||[]).filter(w=>t.includes(w));ratio=bad.length?0:1;detail=bad.length?'còn lỗi: '+bad.join('、'):'không còn lỗi mục tiêu'}
else if(c.type==='time_markers'){const n=timeMarkers(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} mốc thời gian`}
else if(c.type==='number_markers'){const n=numberMarkers(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} số/giá`}
else if(c.type==='discount_count'){const n=discountCount(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} mức ưu đãi`}
else if(c.type==='speaker_lines'){const n=t.split(/\n+/).filter(x=>/[：:]/.test(x)).length;ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} dòng có người nói`}
return {ratio:Math.max(0,Math.min(1,ratio)),detail}}
function gradeText(text,rule){text=cleanText(text);if(!text)return {score:0,rows:[{label:'Chưa có bài làm',weight:100,ratio:0,detail:'Hãy nhập câu trả lời trước.'}]};let total=0;const rows=(rule.criteria||[]).map(c=>{const r=evalCriterion(c,text);const pts=r.ratio*c.weight;total+=pts;return {...c,...r,pts}});return {score:Math.round(total),rows}}

    'Sửa lỗi, viết lại và case nâng cao. Phần này vẫn giữ chấm tự động theo rubric nội bộ của bài học.',
    '<button class="btn" onclick="window.print()">In phần này</button><button class="btn primary" id="gradeAll">Chấm toàn bộ</button>'
  )+`<div class="overall"></div><div class="task-list" id="tasks"></div><div id="overallScore" style="margin-top:14px"></div>`;

  const w=$('#tasks');
  arr.forEach((item,i)=>{
    const q=typeof item==='string'?item:item.q;
    const t=el('div','task');
    t.innerHTML=`<h3>${i+1}. ${q}</h3><textarea placeholder="Nhập câu trả lời bằng tiếng Trung..."></textarea><div class="actions" style="margin-top:9px"><button class="btn save">Lưu</button><button class="btn primary grade">Chấm bài</button><button class="btn soft hintbtn">Gợi ý / đáp án mẫu</button></div><div class="grader"></div><div class="hintbox"><b>Gợi ý:</b> ${item.hint}<br><b>Mẫu:</b> ${item.sample}</div>`;
    const ta=t.querySelector('textarea');
    ta.value=localStorage.getItem(taskKey(type,i))||'';
    t.querySelector('.save').onclick=()=>{
      localStorage.setItem(taskKey(type,i),ta.value);
      toast('Đã lưu bài trên trình duyệt');
    };
    t.querySelector('.grade').onclick=()=>{
      localStorage.setItem(taskKey(type,i),ta.value);
      const res=gradeText(ta.value,rules[i]);
      const box=t.querySelector('.grader');
      box.innerHTML=gradeBlockHTML(res);
      box.classList.add('show');
      bump(true);
    };
    t.querySelector('.hintbtn').onclick=()=>t.querySelector('.hintbox').classList.toggle('show');
    w.appendChild(t);
  });

  $('#gradeAll').onclick=()=>{
    let sum=0,n=0;
    [...w.children].forEach((t,i)=>{
      const ta=t.querySelector('textarea'),res=gradeText(ta.value,rules[i]);
      localStorage.setItem(taskKey(type,i),ta.value);
      const box=t.querySelector('.grader');
      box.innerHTML=gradeBlockHTML(res);
      box.classList.add('show');
      sum+=res.score;n++;
    });
    $('#overallScore').innerHTML=`<div class="score">Điểm trung bình phần Nâng cao: ${Math.round(sum/n)}/100</div>`;
    bump(true);
  };
}
window.addEventListener('meow-ai-writing-graded',e=>{
  if(e.detail?.course==='hsk4' && Number(e.detail?.lesson)===2){
    toast(`AI đã chấm: ${e.detail.score}/100`);
  }
});
init();
</script>
<script>
(function(){
  const boot=()=>{
    if(window.MeowTracking){
      MeowTracking.openLesson('hsk4', 2);
      MeowTracking.startAutoScoreTracking('hsk4', 2);
    }
  };
  if(window.meowUser && window.MeowTracking) boot();
  else window.addEventListener('meow-auth-ready',boot,{once:true});
})();
</script>


<div class="footer">Học cùng meow meow, vui quá là vui</div>
