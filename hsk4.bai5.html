<script>const DATA={"title":"只买对的，不买贵的","vi":"Chỉ mua cái phù hợp, không mua cái đắt","theme":"","vocab":[["家具","jiājù","đồ nội thất"],["沙发","shāfā","ghế sofa"],["打折","dǎzhé","giảm giá"],["价格","jiàgé","giá cả"],["质量","zhìliàng","chất lượng"],["肯定","kěndìng","chắc chắn, nhất định"],["流行","liúxíng","thịnh hành, được ưa chuộng"],["顺便","shùnbiàn","nhân tiện"],["台","tái","lượng từ cho máy móc"],["光","guāng","chỉ, chỉ riêng"],["实在","shízài","quả thực, thật sự"],["制冷","zhìlěng","làm lạnh"],["效果","xiàoguǒ","hiệu quả"],["现金","xiànjīn","tiền mặt"],["邀请","yāoqǐng","mời"],["葡萄","pútao","quả nho"],["艺术","yìshù","nghệ thuật; có tính nghệ thuật"],["广告","guǎnggào","quảng cáo"],["味道","wèidào","mùi vị"],["优点","yōudiǎn","ưu điểm"],["实际","shíjì","thực tế"],["考虑","kǎolǜ","cân nhắc, suy xét"],["标准","biāozhǔn","tiêu chuẩn"],["样子","yàngzi","kiểu dáng, hình dáng"],["年龄","niánlíng","tuổi"],["浪费","làngfèi","lãng phí"],["购物","gòuwù","mua sắm"],["尤其","yóuqí","đặc biệt là, nhất là"],["受到","shòudào","nhận/chịu (ảnh hưởng, sự yêu thích...)"],["任何","rènhé","bất kỳ, bất cứ"],["寄","jì","gửi"]],"grammar":[["肯定：phó từ / tính từ","<div class=\"g-lead\"></div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Phó từ: <b>肯定 + vị ngữ</b> = chắc chắn.</div><div>• Tính từ: “chắc chắn/rõ ràng”: 不能肯定的事.</div><div>• Tính từ/danh hóa: 回答是肯定的 = câu trả lời là khẳng định.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>质量肯定不打折。</b><span>Chất lượng chắc chắn không bị giảm.</span></div><div class=\"g-line\"><b>喝太多酒肯定对身体不好。</b><span>Uống quá nhiều rượu chắc chắn không tốt cho sức khỏe.</span></div><div class=\"g-line\"><b>大部分人的回答都是肯定的。</b><span>Câu trả lời của phần lớn mọi người đều là khẳng định.</span></div></div>"],["再说：động từ / liên từ","<div class=\"g-lead\">再说 có hai cách dùng quan trọng.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Động từ: <b>以后再说 / 下次再说</b> = để sau hãy nói/tính.</div><div>• Liên từ: <b>再说，……</b> = hơn nữa/vả lại, bổ sung thêm một lý do.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>没我的号了，下次再说吧。</b><span>Không còn cỡ của tôi, lần sau tính tiếp.</span></div><div class=\"g-line\"><b>现在的事做了再说，以后的事以后再说。</b><span>Việc hiện tại làm rồi hãy tính, việc sau để sau nói.</span></div><div class=\"g-line\"><b>今天买得太多了。再说，这个月已经花了很多钱。</b><span>Hôm nay mua quá nhiều rồi. Hơn nữa tháng này đã tiêu rất nhiều tiền.</span></div></div>"],["实际 / 实际上","<div class=\"g-lead\">实际 và 实际上 khác nhau về từ loại.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>实际</b> có thể là danh từ: 联系实际 — gắn với thực tế.</div><div>• <b>实际</b> có thể là tính từ: 实际工作 — công việc thực tế.</div><div>• <b>实际上</b> là phó từ/liên kết ý: “trên thực tế/thực ra”.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>做计划应该联系实际。</b><span>Lập kế hoạch nên gắn với thực tế.</span></div><div class=\"g-line\"><b>实际工作能让我更了解知识。</b><span>Công việc thực tế giúp tôi hiểu kiến thức hơn.</span></div><div class=\"g-line\"><b>实际上，很多东西并不像广告说得那么好。</b><span>Thực tế, nhiều thứ không tốt như quảng cáo nói.</span></div></div>"],["准：准时 / 准备 / 标准","<div class=\"g-lead\">PDF dùng chữ 准 để giúp phân biệt ba từ thường gặp, không phải ba từ đồng nghĩa.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>准时</b>: đúng giờ.</div><div>• <b>准备</b>: chuẩn bị.</div><div>• <b>标准</b>: tiêu chuẩn.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>我一定准时到。</b><span>Tôi nhất định đến đúng giờ.</span></div><div class=\"g-line\"><b>同学们正在准备下星期的考试。</b><span>Các bạn đang chuẩn bị cho kỳ thi tuần sau.</span></div><div class=\"g-line\"><b>幸福的标准是不同的。</b><span>Tiêu chuẩn về hạnh phúc là khác nhau.</span></div></div>"],["对……来说","<div class=\"g-lead\">Dùng để nêu góc nhìn hoặc tiêu chuẩn đánh giá từ phía một người/đối tượng nào đó.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• <b>对 + người/đối tượng + 来说，……</b>.</div><div>• Có thể đặt đầu câu hoặc sau chủ đề.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>对我来说，衣服流行不流行并不重要。</b><span>Đối với tôi, quần áo có hợp mốt hay không không quan trọng.</span></div><div class=\"g-line\"><b>对一个女人来说，快乐很重要。</b><span>Đối với một người phụ nữ, niềm vui rất quan trọng.</span></div><div class=\"g-line\"><b>对一条大鱼来说，一杯水没有什么帮助。</b><span>Đối với một con cá lớn, một cốc nước không giúp được gì.</span></div></div>"],["尤其","<div class=\"g-lead\">尤其 là phó từ nhấn mạnh phần nổi bật nhất trong một tổng thể: “đặc biệt là”.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• Thường vế trước nêu phạm vi chung, vế sau dùng <b>尤其（是）</b> nêu điểm nổi bật.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>年轻人尤其喜欢在网上买东西。</b><span>Người trẻ đặc biệt thích mua đồ trên mạng.</span></div><div class=\"g-line\"><b>为了健康，尤其是四五十岁的人，应该每年体检。</b><span>Vì sức khỏe, đặc biệt người 40–50 tuổi nên khám sức khỏe hằng năm.</span></div></div>"],["尤其 / 特别","<div class=\"g-lead\">Hai từ đều có thể nêu phần nổi bật, nhưng không hoàn toàn giống nhau.</div><div class=\"g-rule\"><b>Cách dùng / cấu trúc</b><div>• 尤其（是） và 特别是 đều có thể nói “đặc biệt là”.</div><div>• Sau 尤其 có thể có hoặc không có 是; sau 特别 khi nêu đối tượng nổi bật thường dùng 特别是.</div><div>• 特别 còn có nghĩa mức độ “rất” và có thể làm tính từ “đặc biệt”; 尤其 không có hai cách dùng này.</div></div>","<div class=\"g-examples\"><div class=\"g-line\"><b>我尤其/特别喜欢贝多芬的音乐。</b><span>Tôi đặc biệt thích nhạc Beethoven.</span></div><div class=\"g-line\"><b>尤其是王老师讲的故事，给我留下很深的印象。</b><span>Đặc biệt là câu chuyện thầy Vương kể để lại cho tôi ấn tượng sâu sắc.</span></div><div class=\"g-line\"><b>那本小说让我特别感动。</b><span>Cuốn tiểu thuyết ấy làm tôi rất cảm động.</span></div><div class=\"g-line\"><b>如果有特别要求，请和我们联系。</b><span>Nếu có yêu cầu đặc biệt, hãy liên hệ với chúng tôi.</span></div></div>"]],"fills":[{"s":"这个沙发现在正在____，比平时便宜一千块。","a":"打折","o":["打折","寄","浪费","邀请"]},{"s":"您放心，____肯定不“打折”。","a":"质量","o":["质量","年龄","现金","味道"]},{"s":"商场正在打折，我们____也买一台冰箱吧。","a":"顺便","o":["顺便","尤其","实际","任何"]},{"s":"上个星期____买沙发就花了两千多。","a":"光","o":["光","台","实在","受到"]},{"s":"咱家的冰箱太旧了，____效果也不太好了。","a":"制冷","o":["制冷","艺术","流行","购物"]},{"s":"广告只介绍优点。____，很多东西并不像广告上说的那么好。","a":"实际上","o":["实际上","再说","顺便","肯定"]},{"s":"我买衣服的____是舒服、质量好，而且不能太贵。","a":"标准","o":["标准","样子","年龄","效果"]},{"s":"网上购物越来越流行，年轻人____喜欢。","a":"尤其","o":["尤其","任何","光","实际"]},{"s":"卖家可以把你买的东西____到办公室或者家里。","a":"寄","o":["寄","考虑","流行","受到"]},{"s":"以后遇到____问题，你都可以和我联系。","a":"任何","o":["任何","尤其","实际","现金"]}],"grammarQuiz":[{"q":"Điền: 质量____没问题，你放心吧。","o":["肯定","任何","样子","台"],"a":0,"e":"肯定 làm phó từ = chắc chắn."},{"q":"再说 trong câu “今天太晚了，再说，明天我还要早起。” có nghĩa…","o":["vả lại/hơn nữa","sau này mới nói","giảm giá","nhân tiện"],"a":0,"e":"Ở đây 再说 là liên từ bổ sung lý do."},{"q":"Điền: ____，广告不一定完全可信。","o":["实际上","顺便","台","现金"],"a":0,"e":"实际上 dùng để chuyển sang tình hình thực tế."},{"q":"Câu nào dùng 对……来说 đúng?","o":["对我来说，质量比样子更重要。","对我来质量说。","对来说我价格。","我对来说购物。"],"a":0,"e":"对 + đối tượng + 来说."},{"q":"Điền: 我喜欢很多运动，____是游泳。","o":["尤其","任何","寄","光"],"a":0,"e":"尤其(是) nêu điểm nổi bật trong tổng thể."},{"q":"Từ nào thuộc nhóm 准 với nghĩa “tiêu chuẩn”?","o":["标准","准备","准时","肯定"],"a":0,"e":"标准 = tiêu chuẩn; 准备 = chuẩn bị; 准时 = đúng giờ."}],"apply":["So sánh 2 sản phẩm (ví dụ 2 điện thoại/2 sofa) trong 80–100 chữ. Dùng 价格、质量、样子、标准、考虑、肯定 và 对……来说.","Viết hội thoại mua hàng 8 lượt: khách muốn mua một món đang 打折 nhưng nghi ngờ 质量; người bán giải thích và đề xuất thanh toán 现金/thẻ.","Chọn một quảng cáo bạn từng thấy và viết 70–90 chữ: quảng cáo nói 优点 gì, thực tế có giống không? Dùng 广告、实际/实际上、受到、尤其."],"advanced":[{"q":"Sửa lỗi: 对我来说觉得价格不重要。","hint":"对……来说 đã đóng vai trò nêu góc nhìn; sau đó dùng mệnh đề bình thường.","sample":"对我来说，价格并不是最重要的。"},{"q":"Viết lại bằng 再说: 我今天不买。东西太多了。这个月也花了很多钱。","hint":"Ghép lý do thứ hai với 再说.","sample":"我今天不买了，东西太多了。再说，这个月也花了很多钱。"},{"q":"Case: ngân sách 3000 tệ, chọn một laptop. Viết 100–120 chữ nêu 3 tiêu chí, rủi ro quảng cáo và quyết định cuối cùng.","hint":"Dùng 标准、质量、价格、实际、考虑、浪费、肯定、尤其.","sample":"开放题：ưu tiên const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function shuffleStaticQuestion(q){
  if(!q || !Array.isArray(q.o) || !q.o.length) return;
  const numericAnswer = typeof q.a === 'number';
  const correct = numericAnswer ? q.o[q.a] : q.a;
  q.o = shuffle(q.o);
  if(numericAnswer) q.a = q.o.indexOf(correct);
}

function randomizeSequenceQuestion(q){
  if(!q || !Array.isArray(q.items) || q.items.length < 2 || !Array.isArray(q.o) || typeof q.a !== 'number') return;

  // Lưu nhãn cũ (A/B/C...) và phần nội dung thực tế.
  const original = q.items.map((item, index) => {
    const m = String(item).match(/^\s*([A-Z])\.\s*(.*)$/);
    return {
      oldLabel: m ? m[1] : String.fromCharCode(65 + index),
      text: m ? m[2] : String(item)
    };
  });

  const correctOriginal = String(q.o[q.a] || '');
  const letters = original.map(x => x.oldLabel);

  // Xáo các mệnh đề; tránh để thứ tự đúng vẫn rơi vào A → B → C.
  let shuffledItems, mapping, transformedCorrect;
  let attempts = 0;

  do {
    shuffledItems = shuffle(original);
    mapping = {};
    shuffledItems.forEach((item, newIndex) => {
      mapping[item.oldLabel] = String.fromCharCode(65 + newIndex);
    });

    transformedCorrect = correctOriginal.replace(/[A-Z]/g, ch => mapping[ch] || ch);
    attempts++;
  } while (
    normalizeSequenceText(transformedCorrect) === 'ABC' &&
    attempts < 20
  );

  // Gắn lại nhãn A/B/C theo thứ tự HIỂN THỊ mới.
  q.items = shuffledItems.map((item, newIndex) =>
    `${String.fromCharCode(65 + newIndex)}. ${item.text}`
  );

  // Đổi toàn bộ phương án A→B→C... sang hệ nhãn mới.
  q.o = q.o.map(option =>
    String(option).replace(/[A-Z]/g, ch => mapping[ch] || ch)
  );
}

function normalizeSequenceText(s){
  return String(s || '').replace(/[^A-Z]/g, '');
}

function randomizeStaticAnswers(){
  (L.fills || []).forEach(shuffleStaticQuestion);
  (L.grammarQuiz || []).forEach(shuffleStaticQuestion);

  if(typeof ADV_DATA !== 'undefined' && ADV_DATA){
    (ADV_DATA.mcq || []).forEach(shuffleStaticQuestion);

    // Phần ③ Sắp xếp trình tự:
    // 1) xáo chính các mệnh đề A/B/C,
    // 2) đổi đáp án đúng tương ứng,
    // 3) tiếp tục xáo vị trí 4 lựa chọn.
    (ADV_DATA.sequence || []).forEach(q => {
      randomizeSequenceQuestion(q);
      shuffleStaticQuestion(q);
    });

    (ADV_DATA.error || []).forEach(shuffleStaticQuestion);
    (ADV_DATA.reading || []).forEach(r => (r.qs || []).forEach(shuffleStaticQuestion));
  }
}
randomizeStaticAnswers();

function renderQuiz(c){if(!state.quiz.length)state.quiz=makeVocabQuiz(L.vocab,10);c.innerHTML=intro('Trắc nghiệm từ vựng','','<button class="btn" id="newQuiz">Tạo bộ mới</button><button class="btn primary" id="checkQuiz">Chấm điểm</button>')+'<div class="quiz-grid" id="qgrid"></div><div id="qscore" style="margin-top:14px"></div>';const g=$('#qgrid');state.quiz.forEach((q,qi)=>{const card=el('div','qcard');card.innerHTML=`<div class="qtitle">${qi+1}. ${q.q}</div><div class="opts"></div><div class="feedback"></div>`;q.options.forEach((o,oi)=>{const b=el('button','opt'+(state.quizAns[qi]===oi?' selected':''),o);b.onclick=()=>{state.quizAns[qi]=oi;renderQuiz(c)};card.querySelector('.opts').appendChild(b)});g.appendChild(card)});$('#newQuiz').onclick=()=>{state.quiz=makeVocabQuiz(L.vocab,10);state.quizAns={};renderQuiz(c)};$('#checkQuiz').onclick=()=>{let s=0;state.quiz.forEach((q,qi)=>{const card=g.children[qi],bs=card.querySelectorAll('.opt'),ch=state.quizAns[qi];bs[q.ans]?.classList.add('good');if(ch!==undefined&&ch!==q.ans)bs[ch]?.classList.add('bad');const ok=ch===q.ans;if(ok)s++;card.querySelector('.feedback').textContent=(ok?'✓ Đúng. ':'✗ ')+q.exp;bump(ok)});$('#qscore').innerHTML=`<div class="score">Kết quả: ${s}/${state.quiz.length}</div>`}}

function renderGrammarQuiz(c){const items=L.grammarQuiz;c.innerHTML=intro('Kiểm tra ngữ pháp','Chọn đáp án phù hợp.','<button class="btn" id="resetG">Làm lại</button><button class="btn primary" id="checkG">Chấm điểm</button>')+'<div class="quiz-grid" id="gg"></div><div id="gs"></div>';const g=$('#gg');items.forEach((q,qi)=>{const card=el('div','qcard');card.innerHTML=`<div class="qtitle">${qi+1}. ${q.q}</div><div class="opts"></div><div class="feedback"></div>`;q.o.forEach((o,oi)=>{const b=el('button','opt'+(state.grammarAns[qi]===oi?' selected':''),o);b.onclick=()=>{state.grammarAns[qi]=oi;renderGrammarQuiz(c)};card.querySelector('.opts').appendChild(b)});g.appendChild(card)});$('#resetG').onclick=()=>{state.grammarAns={};renderGrammarQuiz(c)};$('#checkG').onclick=()=>{let s=0;items.forEach((q,qi)=>{const card=g.children[qi],bs=card.querySelectorAll('.opt'),ch=state.grammarAns[qi];bs[q.a]?.classList.add('good');if(ch!==undefined&&ch!==q.a)bs[ch]?.classList.add('bad');const ok=ch===q.a;if(ok)s++;card.querySelector('.feedback').textContent=(ok?'✓ ':'✗ ')+q.e;bump(ok)});$('#gs').innerHTML=`<div class="score" style="margin-top:14px">Kết quả: ${s}/${items.length}</div>`}}
function taskKey(type,i){return `hsk4_bai${lesson}_${type}_${i}`}
function cleanText(t){return (t||'').replace(/\r/g,'').trim()}
function countHanzi(t){return (t.match(/[\u3400-\u9fff]/g)||[]).length}
function countLines(t){return t.split(/\n+/).map(x=>x.trim()).filter(Boolean).length}
function countSentences(t){const p=(t.match(/[。！？!?；;]/g)||[]).length;return Math.max(p,countLines(t))}
function timeMarkers(t){return (t.match(/(?:\d{1,2}[:：点时]|上午|下午|早上|晚上|中午|星期|周[一二三四五六日天]|今天|明天|后天)/g)||[]).length}
function numberMarkers(t){return (t.match(/\d+(?:\.\d+)?|[一二两三四五六七八九十百千万]+块?/g)||[]).length}
function discountCount(t){const a=t.match(/\d+(?:\.\d+)?折|[一二三四五六七八九十]+折|百分之\s*\d+/g)||[];return new Set(a).size}
function evalCriterion(c,t){let ratio=0,detail='';const han=countHanzi(t);if(c.type==='hanzi_length'){if(han>=c.min&&han<=c.max)ratio=1;else if(han>0){const dist=han<c.min?c.min-han:han-c.max;ratio=Math.max(0,1-dist/Math.max(20,c.max-c.min+20))}detail=`${han} chữ Hán`}
else if(c.type==='hanzi_min'){ratio=Math.min(1,han/c.min);detail=`${han}/${c.min} chữ Hán`}
else if(c.type==='line_count'){const n=countLines(t);ratio=n>=c.min&&(!c.max||n<=c.max)?1:Math.min(1,n/c.min);if(c.max&&n>c.max)ratio=Math.max(.7,1-(n-c.max)*.08);detail=`${n} lượt/dòng`}
else if(c.type==='sentence_count'){const n=countSentences(t);ratio=n>=c.min&&(!c.max||n<=c.max)?1:Math.min(1,n/c.min);if(c.max&&n>c.max)ratio=Math.max(.75,1-(n-c.max)*.05);detail=`${n} câu/ý`}
else if(c.type==='punctuation'){const n=countSentences(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} câu/ý`}
else if(c.type==='keywords'){const base=c.words||[];const hits=base.filter(w=>t.includes(w));let extra=0;if(c.anyWords&&c.anyWords.some(w=>t.includes(w)))extra=1;const need=c.min||base.length;const got=hits.length+extra;ratio=Math.min(1,got/need);const miss=base.filter(w=>!t.includes(w));detail=`đạt ${got}/${need}${miss.length?' · thiếu: '+miss.slice(0,5).join('、'):''}${c.anyWords&&!extra?' · cần một trong: '+c.anyWords.join('/') : ''}`}
else if(c.type==='vocab_hits'){const words=L.vocab.map(x=>x[0]);const hits=words.filter(w=>t.includes(w));ratio=Math.min(1,hits.length/c.min);detail=`${hits.length}/${c.min} từ: ${hits.slice(0,8).join('、')||'chưa có'}`}
else if(c.type==='combo'){const ok=(c.groups||[]).some(g=>g.every(w=>t.includes(w)));ratio=ok?1:0;detail=ok?'đã dùng':'chưa thấy cấu trúc yêu cầu'}
else if(c.type==='forbidden'){const bad=(c.words||[]).filter(w=>t.includes(w));ratio=bad.length?0:1;detail=bad.length?'còn lỗi: '+bad.join('、'):'không còn lỗi mục tiêu'}
else if(c.type==='time_markers'){const n=timeMarkers(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} mốc thời gian`}
else if(c.type==='number_markers'){const n=numberMarkers(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} số/giá`}
else if(c.type==='discount_count'){const n=discountCount(t);ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} mức ưu đãi`}
else if(c.type==='speaker_lines'){const n=t.split(/\n+/).filter(x=>/[：:]/.test(x)).length;ratio=Math.min(1,n/c.min);detail=`${n}/${c.min} dòng có người nói`}
return {ratio:Math.max(0,Math.min(1,ratio)),detail}}
function gradeText(text,rule){text=cleanText(text);if(!text)return {score:0,rows:[{label:'Chưa có bài làm',weight:100,ratio:0,detail:'Hãy nhập câu trả lời trước.'}]};let total=0;const rows=(rule.criteria||[]).map(c=>{const r=evalCriterion(c,text);const pts=r.ratio*c.weight;total+=pts;return {...c,...r,pts}});return {score:Math.round(total),rows}}
function gradeBlockHTML(res){const verdict=res.score>=85?'Rất tốt':res.score>=70?'Đạt':res.score>=50?'Cần bổ sung':'Chưa đạt';return `<div class="grade-head"><div><b>Chấm tự động theo rubric</b><div style="font-size:12px;color:var(--muted)">${verdict}</div></div><div class="grade-big">${res.score}/100</div></div>`+res.rows.map(r=>`<div class="criterion ${r.ratio>=.99?'good':r.ratio>=.55?'partial':'bad'}"><span>${r.label}<br><small>${r.detail||''}</small></span><b>${Math.round(r.pts||0)}/${r.weight}</b></div>`).join('')+`<div class="grade-note">Điểm này do trình duyệt chấm theo tiêu chí có thể đo được (độ dài, từ khóa, cấu trúc, hình thức). Nó không đánh giá đầy đủ độ tự nhiên, lập luận hay lỗi ngữ pháp tinh tế như giáo viên/AI.</div>`}

function normalizeAdv(s){return String(s||'').replace(/[\s，。！？、；：,.!?;:]/g,'')}
function advChoiceHTML(q,key){const chosen=state.advChoice[key];return `<div class="adv-options">${q.o.map((o,oi)=>`<button class="adv-opt ${chosen===oi?'selected':''}" data-advkey="${key}" data-choice="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}</div><div class="adv-feedback" data-feedback="${key}"></div>`}
function bindAdvOptions(){document.querySelectorAll('.adv-opt').forEach(b=>b.onclick=()=>{const key=b.dataset.advkey,choice=Number(b.dataset.choice);state.advChoice[key]=choice;b.closest('.adv-options').querySelectorAll('.adv-opt').forEach(x=>x.classList.remove('selected','good','bad'));b.classList.add('selected');const fb=document.querySelector(`[data-feedback="${key}"]`);if(fb){fb.classList.remove('show');fb.textContent=''};b.closest('.adv-card')?.classList.remove('unanswered','correct','incorrect')})}
function bindOrderCards(){document.querySelectorAll('.order-card').forEach(card=>{const bank=card.querySelector('.order-bank'),ans=card.querySelector('.order-answer');bank.querySelectorAll('.word-chip').forEach(ch=>ch.onclick=()=>{if(ch.classList.contains('used'))return;ch.classList.add('used');const x=document.createElement('button');x.className='word-chip';x.textContent=ch.textContent;x.dataset.source=ch.dataset.source;x.onclick=()=>{const original=bank.querySelector(`[data-source="${x.dataset.source}"]`);if(original)original.classList.remove('used');x.remove();ans.classList.remove('good','bad');card.classList.remove('unanswered','correct','incorrect')};ans.appendChild(x);ans.classList.remove('good','bad')})})}
function renderAdvanced(c){const A=ADV_DATA;state.advChoice=state.advChoice||{};let n=1;let html=intro('Bài nâng cao · dạng HSK tương tác','','<button class="btn" id="resetAdv">Làm lại</button><button class="btn primary" id="gradeAdv">Chấm toàn bộ</button>');html+=`<div class="adv-note"><b>Mỗi câu = 5 điểm.</b></div><div class="adv-board">`;
html+=`<section class="adv-section"><div class="adv-section-head"><div><h3>① Chọn từ / cấu trúc phù hợp</h3><div class="desc">5 câu vận dụng từ vựng và ngữ pháp của bài.</div></div><div class="adv-num">25đ</div></div>`;A.mcq.forEach((q,i)=>{const key=`mcq-${i}`;html+=`<div class="adv-card" data-cardkey="${key}"><div class="adv-q">${n++}. ${q.q}</div>${advChoiceHTML(q,key)}</div>`});html+=`</section>`;
html+=`<section class="adv-section"><div class="adv-section-head"><div><h3>② Sắp xếp từ thành câu</h3><div class="desc">Bấm từng cụm từ theo thứ tự để tạo câu hoàn chỉnh.</div></div><div class="adv-num">25đ</div></div>`;A.reorder.forEach((q,i)=>{html+=`<div class="adv-card order-card" id="adv-reorder-${i}" data-cardkey="reorder-${i}"><div class="adv-q">${n++}. Sắp xếp thành câu đúng:</div><div class="order-bank">${shuffle(q.parts.map((p,j)=>({p,j}))).map(x=>`<button class="word-chip" data-source="${x.j}">${x.p}</button>`).join('')}</div><div class="order-answer" aria-label="Câu trả lời"></div><div class="adv-feedback" data-feedback="reorder-${i}"></div></div>`});html+=`</section>`;
html+=`<section class="adv-section"><div class="adv-section-head"><div><h3>③ Sắp xếp trình tự</h3><div class="desc">Chọn thứ tự A–B–C hợp lý nhất theo ngữ cảnh.</div></div><div class="adv-num">15đ</div></div>`;A.sequence.forEach((q,i)=>{const key=`sequence-${i}`;html+=`<div class="adv-card" data-cardkey="${key}"><div class="adv-q">${n++}. ${q.q}</div><div class="sequence-items">${q.items.map(x=>`<div>${x}</div>`).join('')}</div>${advChoiceHTML(q,key)}</div>`});html+=`</section>`;
html+=`<section class="adv-section"><div class="adv-section-head"><div><h3>④ Chọn câu đúng / sửa lỗi</h3><div class="desc">4 câu tập trung vào lỗi cấu trúc dễ nhầm.</div></div><div class="adv-num">20đ</div></div>`;A.error.forEach((q,i)=>{const key=`error-${i}`;html+=`<div class="adv-card" data-cardkey="${key}"><div class="adv-q">${n++}. ${q.q}</div>${advChoiceHTML(q,key)}</div>`});html+=`</section>`;
html+=`<section class="adv-section"><div class="adv-section-head"><div><h3>⑤ Đọc hiểu mini</h3><div class="desc">Đọc đoạn ngắn mới, sau đó trả lời 3 câu.</div></div><div class="adv-num">15đ</div></div>`;A.reading.forEach((r,ri)=>{html+=`<div class="reading-text">${r.text}</div>`;r.qs.forEach((q,qi)=>{const key=`reading-${ri}-${qi}`;html+=`<div class="adv-card" data-cardkey="${key}"><div class="adv-q">${n++}. ${q.q}</div>${advChoiceHTML(q,key)}</div>`})});html+=`</section></div><div class="adv-scorebar"><div><div class="scoretxt" id="advScore">Chưa chấm · 20 câu / 100 điểm</div><div style="font-size:12px;color:var(--muted)">Đáp án và giải thích hiện sau khi chấm.</div></div><div class="actions"><button class="btn" id="resetAdv2">Làm lại</button><button class="btn primary" id="gradeAdv2">Chấm toàn bộ</button></div></div>`;c.innerHTML=html;bindAdvOptions();bindOrderCards();$('#resetAdv').onclick=$('#resetAdv2').onclick=()=>{state.advChoice={};renderAdvanced(c);toast('Đã làm mới bài nâng cao')};$('#gradeAdv').onclick=$('#gradeAdv2').onclick=()=>gradeAdvanced(c)}
function gradeChoiceQuestion(q,key){const chosen=state.advChoice[key];const card=document.querySelector(`[data-cardkey="${key}"]`);const opts=card?card.querySelectorAll('.adv-opt'):[];opts.forEach(x=>x.classList.remove('good','bad'));if(opts[q.a])opts[q.a].classList.add('good');if(chosen!==undefined&&chosen!==q.a&&opts[chosen])opts[chosen].classList.add('bad');const ok=chosen===q.a;card?.classList.remove('unanswered','correct','incorrect');card?.classList.add(chosen===undefined?'unanswered':ok?'correct':'incorrect');const fb=card?.querySelector('.adv-feedback');if(fb){fb.classList.add('show');fb.innerHTML=chosen===undefined?`⚠ Chưa chọn đáp án. Đáp án đúng: <b>${String.fromCharCode(65+q.a)}</b>. ${q.e}`:`${ok?'✓ Đúng':'✗ Chưa đúng'} · Đáp án: <b>${String.fromCharCode(65+q.a)}</b>. ${q.e}`};return ok?1:0}
function gradeAdvanced(c){const A=ADV_DATA;let correct=0,total=0;A.mcq.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`mcq-${i}`)});A.reorder.forEach((q,i)=>{total++;const card=document.querySelector(`#adv-reorder-${i}`),ans=card.querySelector('.order-answer'),txt=[...ans.querySelectorAll('.word-chip')].map(x=>x.textContent).join('');const ok=normalizeAdv(txt)===normalizeAdv(q.answer);ans.classList.remove('good','bad');ans.classList.add(ok?'good':'bad');card.classList.remove('unanswered','correct','incorrect');card.classList.add(!txt?'unanswered':ok?'correct':'incorrect');const fb=card.querySelector('.adv-feedback');fb.classList.add('show');fb.innerHTML=!txt?`⚠ Chưa sắp xếp. Đáp án: <b>${q.answer}。</b> ${q.e}`:`${ok?'✓ Đúng':'✗ Chưa đúng'} · Đáp án: <b>${q.answer}。</b> ${q.e}`;if(ok)correct++});A.sequence.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`sequence-${i}`)});A.error.forEach((q,i)=>{total++;correct+=gradeChoiceQuestion(q,`error-${i}`)});A.reading.forEach((r,ri)=>r.qs.forEach((q,qi)=>{total++;correct+=gradeChoiceQuestion(q,`reading-${ri}-${qi}`)}));const score=Math.round(correct/total*100),verdict=score>=90?'Xuất sắc':score>=80?'Rất tốt':score>=70?'Đạt':score>=50?'Cần ôn thêm':'Nên làm lại';$('#advScore').textContent=`${score}/100 · ${correct}/${total} câu đúng · ${verdict}`;bump(true);toast(`Bài nâng cao: ${score}/100`)}

function renderOpenTasks(c,type){const arr=L[type];const rules=RULES[type];const isAdv=type==='advanced';c.innerHTML=intro(isAdv?'Bài nâng cao':'Bài vận dụng',isAdv?'Sửa lỗi, viết lại và case nâng cao. Có chấm tự động theo rubric.':'Bài viết/hội thoại có nút Chấm bài. Điểm là điểm luyện tập tự động, không phải điểm giáo viên.','<button class="btn" onclick="window.print()">In phần này</button><button class="btn primary" id="gradeAll">Chấm toàn bộ</button>')+`<div class="overall"></div><div class="task-list" id="tasks"></div><div id="overallScore" style="margin-top:14px"></div>`;const w=$('#tasks');arr.forEach((item,i)=>{const q=typeof item==='string'?item:item.q;const t=el('div','task');t.innerHTML=`<h3>${i+1}. ${q}</h3><textarea placeholder="Nhập câu trả lời bằng tiếng Trung..."></textarea><div class="actions" style="margin-top:9px"><button class="btn save">Lưu</button><button class="btn primary grade">Chấm bài</button>${isAdv?'<button class="btn soft hintbtn">Gợi ý / đáp án mẫu</button>':''}</div><div class="grader"></div>${isAdv?`<div class="hintbox"><b>Gợi ý:</b> ${item.hint}<br><b>Mẫu:</b> ${item.sample}</div>`:''}`;const ta=t.querySelector('textarea');ta.value=localStorage.getItem(taskKey(type,i))||'';t.querySelector('.save').onclick=()=>{localStorage.setItem(taskKey(type,i),ta.value);toast('Đã lưu bài trên trình duyệt')};t.querySelector('.grade').onclick=()=>{localStorage.setItem(taskKey(type,i),ta.value);const res=gradeText(ta.value,rules[i]);const box=t.querySelector('.grader');box.innerHTML=gradeBlockHTML(res);box.classList.add('show');bump(true)};if(isAdv)t.querySelector('.hintbtn').onclick=()=>t.querySelector('.hintbox').classList.toggle('show');w.appendChild(t)});$('#gradeAll').onclick=()=>{let sum=0,n=0;[...w.children].forEach((t,i)=>{const ta=t.querySelector('textarea'),res=gradeText(ta.value,rules[i]);localStorage.setItem(taskKey(type,i),ta.value);const box=t.querySelector('.grader');box.innerHTML=gradeBlockHTML(res);box.classList.add('show');sum+=res.score;n++});$('#overallScore').innerHTML=`<div class="score">Điểm trung bình phần ${isAdv?'Nâng cao':'Vận dụng'}: ${Math.round(sum/n)}/100</div>`;bump(true)}}
init();
</script>
