<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý bài tập · Tiếng Trung Meow Meow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --brand:#2E8AA3;--brand-2:#58B4C8;--brand-dark:#1F6479;--deep:#143F4F;--deep-2:#0E2F3C;
      --soft:#E8F4F7;--paper:#FBF8F2;--line:#DCE9EC;--white:#fff;
      --ink:#1B2E35;--muted:#5B7078;
      --gold:#F0B94B;--coral:#EF6A4C;--coral-dark:#D9533A;--seal:#D6453A;
      --shadow:0 14px 36px rgba(20,63,79,.10);
      --serif:"Noto Serif SC","Be Vietnam Pro",serif;--sans:"Be Vietnam Pro",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.65;background:var(--paper)}
    a{color:inherit;text-decoration:none}
    .container{width:min(1000px,calc(100% - 32px));margin:0 auto}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(251,248,242,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .topbar-inner{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--deep)}
    .logo-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--seal),#F0806B);font-family:var(--serif);font-size:18px;font-weight:900}
    .user-chip{font-size:.85rem;font-weight:600;color:var(--brand-dark);background:var(--soft);padding:8px 14px;border-radius:999px}
    .hero{padding:36px 0 20px}
    .hero h1{margin:0 0 6px;font-family:var(--serif);font-size:clamp(1.6rem,3.5vw,2.2rem);color:var(--deep)}
    .hero p{margin:0;color:var(--muted)}
    .card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 20px;border-radius:999px;font-weight:700;font-size:.9rem;border:0;cursor:pointer;font-family:inherit}
    .btn-primary{background:var(--coral);color:#fff}
    .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--deep)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
    .toolbar select,.toolbar input{padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;min-width:160px}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line)}
    th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
    tr:hover td{background:#FAFCFD}
    .score{font-weight:800;color:var(--brand-dark)}
    .score.high{color:#1F6B3F}
    .score.mid{color:#9A6B12}
    .score.low{color:#9B2C2C}
    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--soft);color:var(--brand-dark)}
    .detail-panel{display:none;margin-top:14px;padding:16px;background:var(--soft);border-radius:16px}
    .detail-panel.open{display:block}
    .ans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
    .ans-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
    .ans-item b{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}
    .login-gate{text-align:center;padding:60px 20px}
    .login-gate h2{font-family:var(--serif);color:var(--deep);margin:0 0 12px}
    .hidden{display:none!important}
    .empty{text-align:center;padding:40px 20px;color:var(--muted)}
    .msg{margin:12px 0;padding:12px 16px;border-radius:14px;font-weight:600}
    .msg.err{background:#FDECEC;color:#9B2C2C}
    .msg.info{background:var(--soft);color:var(--brand-dark)}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="index.html"><span class="logo-mark">喵</span><span>Quản lý bài tập</span></a>
      <div id="userChip" class="user-chip hidden">...</div>
    </div>
  </div>

  <main class="container">
    <div id="gate" class="login-gate card">
      <h2>Cần đăng nhập để xem bài nộp</h2>
      <p style="color:var(--muted);margin:0 0 22px">Trang này dành cho giáo viên xem đáp án học sinh đã chọn.</p>
      <a class="btn btn-primary" href="login.html?next=quan-ly-bai-tap.html">Đăng nhập</a>
    </div>

    <div id="app" class="hidden">
      <div class="hero">
        <h1>Danh sách bài nộp</h1>
        <p>Xem đáp án từng học sinh đã chọn. Bấm vào dòng để xem chi tiết.</p>
      </div>

      <div class="toolbar">
        <select id="filterEx">
          <option value="">Tất cả bài tập</option>
        </select>
        <input type="search" id="searchName" placeholder="Tìm theo tên học sinh...">
        <button class="btn btn-ghost" id="reloadBtn">Làm mới</button>
      </div>

      <div id="status" class="msg info hidden"></div>

      <div class="card" style="padding:0;overflow:hidden">
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Thời gian</th>
                <th>Học sinh</th>
                <th>Bài tập</th>
                <th>Điểm</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="5" class="empty">Đang tải...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://xmtvmwcjjqqzscmkdlwd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R5TEjUNB6lDTJuN4MNdhVQ_ANwIaKLP";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TEACHER_USERNAMES = ["amber123"];

    let rows = [];
    const $ = id => document.getElementById(id);

    function fmtTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function scoreClass(s) {
      if (s >= 80) return "high";
      if (s >= 50) return "mid";
      return "low";
    }

    function renderTable(list) {
      const tb = $("tbody");
      if (!list.length) {
        tb.innerHTML = `<tr><td colspan="5" class="empty">Chưa có bài nộp nào.</td></tr>`;
        return;
      }
      tb.innerHTML = list.map((r, i) => {
        const name = r.display_name || r.username || "Không tên";
        const ans = r.answers || {};
        const ansHtml = Object.keys(ans).sort((a,b)=>Number(a)-Number(b)).map(k =>
          `<div class="ans-item"><b>Câu ${k}</b>${ans[k]}</div>`
        ).join("");
        return `
          <tr data-i="${i}">
            <td>${fmtTime(r.submitted_at)}</td>
            <td><b>${name}</b>${r.username ? `<div style="font-size:.78rem;color:var(--muted)">@${r.username}</div>` : ""}</td>
            <td><span class="badge">${r.exercise_title || r.exercise_id}</span></td>
            <td class="score ${scoreClass(r.score)}">${r.score ?? "—"}%</td>
            <td><button class="btn btn-ghost" style="min-height:34px;padding:6px 12px;font-size:.8rem" data-toggle="${i}">Xem đáp án</button></td>
          </tr>
          <tr class="detail-row">
            <td colspan="5" style="padding:0 12px 12px">
              <div class="detail-panel" id="detail-${i}">
                <div style="font-weight:700;margin-bottom:10px;color:var(--deep)">Đáp án học sinh đã chọn</div>
                <div class="ans-grid">${ansHtml || "Không có dữ liệu"}</div>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      tb.querySelectorAll("[data-toggle]").forEach(btn => {
        btn.onclick = () => {
          const panel = $("detail-" + btn.dataset.toggle);
          panel.classList.toggle("open");
          btn.textContent = panel.classList.contains("open") ? "Ẩn đáp án" : "Xem đáp án";
        };
      });
    }

    function applyFilter() {
      const ex = $("filterEx").value;
      const q = $("searchName").value.trim().toLowerCase();
      let list = rows;
      if (ex) list = list.filter(r => r.exercise_id === ex);
      if (q) list = list.filter(r =>
        (r.display_name || "").toLowerCase().includes(q) ||
        (r.username || "").toLowerCase().includes(q)
      );
      renderTable(list);
    }

    async function load() {
      $("status").classList.remove("hidden");
      $("status").textContent = "Đang tải danh sách bài nộp...";
      const { data, error } = await db
        .from("submissions")
        .select("*")
        .order("submitted_at", { ascending: false })
        .limit(200);

      if (error) {
        $("status").className = "msg err";
        $("status").textContent = "Lỗi tải dữ liệu: " + error.message;
        $("tbody").innerHTML = `<tr><td colspan="5" class="empty">Không tải được dữ liệu. Kiểm tra RLS policy trong Supabase.</td></tr>`;
        return;
      }

      rows = data || [];
      $("status").classList.add("hidden");

      // fill filter
      const ids = [...new Set(rows.map(r => r.exercise_id))];
      const sel = $("filterEx");
      const cur = sel.value;
      sel.innerHTML = `<option value="">Tất cả bài tập (${rows.length})</option>` +
        ids.map(id => {
          const title = rows.find(r => r.exercise_id === id)?.exercise_title || id;
          return `<option value="${id}">${title}</option>`;
        }).join("");
      sel.value = cur;

      applyFilter();
    }

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        $("gate").classList.remove("hidden");
        $("app").classList.add("hidden");
        return;
      }

      const meta = session.user.user_metadata || {};
      const username = (meta.username || "").toLowerCase();

      // Chỉ cô (amber123) mới được vào trang quản lý
      if (!TEACHER_USERNAMES.includes(username)) {
        $("gate").innerHTML = `
          <h2>Bạn không có quyền truy cập</h2>
          <p style="color:var(--muted);margin:0 0 22px">Trang này chỉ dành cho giáo viên.</p>
          <a class="btn btn-primary" href="index.html">Về trang chính</a>
        `;
        $("gate").classList.remove("hidden");
        $("app").classList.add("hidden");
        return;
      }

      const name = meta.display_name || meta.username || "Giáo viên";
      $("userChip").textContent = name;
      $("userChip").classList.remove("hidden");
      $("gate").classList.add("hidden");
      $("app").classList.remove("hidden");

      $("filterEx").onchange = applyFilter;
      $("searchName").oninput = applyFilter;
      $("reloadBtn").onclick = load;

      await load();
    }

    init();
  </script>
</body>
</html>
