<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard chủ đề · HSK4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="topics-data.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">喵</span>
        <span>TỪ VỰNG THEO CHỦ ĐỀ · 主题词汇</span>
      </a>
      <a class="back-link" href="index.html">← 13 chủ đề</a>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container topic-head">
        <div>
          <div class="eyebrow" id="topicKicker">CHỦ ĐỀ</div>
          <h1 id="topicTitle">Flashcard từ vựng</h1>
          <p id="topicDescription">Đang tải nội dung chủ đề…</p>
          <div class="hero-meta">
            <span class="pill" id="wordCount">0 từ vựng</span>
            <span class="pill">Nhấn thẻ để xem ví dụ</span>
          </div>
        </div>
        <div class="topic-number" id="topicNumber" aria-hidden="true">01</div>
      </div>
    </section>

    <section class="container" aria-labelledby="deckTitle">
      <h2 class="sr-only" id="deckTitle">Bộ flashcard từ vựng</h2>
      <div class="deck-note" id="deckNote" hidden>
        Đây là thẻ mẫu để xem trước giao diện. Khi thêm dữ liệu thật vào <strong>topics-data.js</strong>, thẻ mẫu sẽ tự biến mất.
      </div>
      <div class="flashcard-grid" id="flashcardGrid"></div>
    </section>
  </main>

  <footer class="footer"><div class="container">中文学习空间 · Tiếng Trung Meow Meow</div></footer>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var params = new URLSearchParams(window.location.search);
      var id = Number(params.get("id")) || 1;
      var topics = window.HSK4_TOPICS || [];
      var topic = topics.find(function (item) { return item.id === id; }) || topics[0];

      if (!topic) {
        document.getElementById("flashcardGrid").innerHTML = '<div class="empty-state">Chưa có dữ liệu chủ đề.</div>';
        return;
      }

      var number = String(topic.id).padStart(2, "0");
      document.title = topic.title + " · Flashcard HSK4";
      document.getElementById("topicKicker").textContent = "CHỦ ĐỀ " + number + " · " + topic.chineseTitle;
      document.getElementById("topicTitle").textContent = topic.title;
      document.getElementById("topicDescription").textContent = topic.description;
      document.getElementById("topicNumber").textContent = number;
      document.getElementById("wordCount").textContent = topic.vocabulary.length + " từ vựng";

      var words = topic.vocabulary;
      var isDemo = words.length === 0;
      if (isDemo) {
        document.getElementById("deckNote").hidden = false;
        words = [{
          word: "示例",
          pinyin: "shìlì",
          meaning: "ví dụ / thẻ mẫu",
          partOfSpeech: "Danh từ / 名词",
          exampleZh: "这是一个示例。",
          exampleVi: "Đây là một ví dụ."
        }];
      }

      document.getElementById("flashcardGrid").innerHTML = words.map(function (item, index) {
        return '<article class="flashcard" data-word="' + escapeHtml(item.word) + '">' +
          '<div class="flashcard-inner">' +
            '<section class="card-face card-front">' +
              '<span class="' + (isDemo ? 'demo-badge' : 'word-index') + '">' + (isDemo ? 'THẺ MẪU' : 'TỪ ' + String(index + 1).padStart(2, '0')) + '</span>' +
              '<h2 class="word">' + escapeHtml(item.word) + '</h2>' +
              '<div class="pinyin">' + escapeHtml(item.pinyin) + '</div>' +
              '<div class="meaning">' + escapeHtml(item.meaning) + '</div>' +
              '<div class="card-actions">' +
                '<button class="card-button primary" type="button" data-action="speak">🔊 Nghe</button>' +
                '<button class="card-button" type="button" data-action="flip">Xem từ loại & ví dụ →</button>' +
              '</div>' +
            '</section>' +
            '<section class="card-face card-back">' +
              '<span class="part-of-speech">' + escapeHtml(item.partOfSpeech) + '</span>' +
              '<h3>CÂU VÍ DỤ · 例句</h3>' +
              '<p class="example-zh">' + escapeHtml(item.exampleZh) + '</p>' +
              '<p class="example-vi">' + escapeHtml(item.exampleVi) + '</p>' +
              '<div class="card-actions">' +
                '<button class="card-button primary" type="button" data-action="speak-example">🔊 Nghe ví dụ</button>' +
                '<button class="card-button" type="button" data-action="flip">← Xem lại từ</button>' +
              '</div>' +
            '</section>' +
          '</div></article>';
      }).join("");

      document.getElementById("flashcardGrid").addEventListener("click", function (event) {
        var button = event.target.closest("button[data-action]");
        if (!button) return;
        var card = button.closest(".flashcard");
        var action = button.getAttribute("data-action");
        if (action === "flip") {
          card.classList.toggle("is-flipped");
        } else if (action === "speak") {
          speakChinese(card.getAttribute("data-word"));
        } else if (action === "speak-example") {
          speakChinese(card.querySelector(".example-zh").textContent);
        }
      });
    });

    function speakChinese(text) {
      if (!("speechSynthesis" in window)) {
        alert("Trình duyệt này chưa hỗ trợ phát âm tự động.");
        return;
      }
      window.speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = 0.82;
      var voices = window.speechSynthesis.getVoices();
      var chineseVoice = voices.find(function (voice) { return /^zh(-|_)/i.test(voice.lang); });
      if (chineseVoice) utterance.voice = chineseVoice;
      window.speechSynthesis.speak(utterance);
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
